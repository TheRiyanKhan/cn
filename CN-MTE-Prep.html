// ----- lightbox -----
document.addEventListener('click',e=>{const box=e.target.closest('.fig .svgbox');if(!box||e.target.closest('.walkbtn'))return;const fig=box.closest('.fig');const d=DIAGRAMS[fig.dataset.fig];if(!d)return;$('#lbTitle').textContent=d.title;$('#lbEyebrow').textContent='Fig '+FIG_INDEX[d.id]+' · '+d.caption;$('#lbBody').innerHTML=d.svg();$('#lightbox').classList.add('open');});
$('#lbClose').addEventListener('click',()=>$('#lightbox').classList.remove('open'));document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lightbox').classList.remove('open');});
// ----- walkthrough -----
let walkUid=0;
document.addEventListener('click',e=>{const b=e.target.closest('.walkbtn');if(!b)return;const fig=b.closest('.fig');if(fig.querySelector('.walk')){closeWalk(fig);}else startWalk(fig);});
function closeWalk(fig){const w=fig.querySelector('.walk');if(w)w.remove();const svg=fig.querySelector('svg');svg.querySelectorAll('.hl-g').forEach(g=>g.remove());const b=fig.querySelector('.walkbtn');if(b)b.textContent='Walk me through ▸';if(fig._walkKey){document.removeEventListener('keydown',fig._walkKey);fig._walkKey=null;}}
function startWalk(fig){const id=fig.dataset.fig;const data=STEPS[id];const svg=fig.querySelector('svg');const vb=svg.viewBox.baseVal;const uid='hl'+(++walkUid);let i=0;let timer=null;
  const w=document.createElement('div');w.className='walk';w.innerHTML=`<div class="wstep"><div class="wnum" id="${uid}-n">1</div><div class="wtext" id="${uid}-t"></div></div><div class="wctl"><button class="btn small" data-w="prev">← Back</button><button class="btn small primary" data-w="next">Next →</button><button class="btn small ghost" data-w="play">▶ Auto-play</button><button class="btn small ghost" data-w="all">Show all</button><span class="wcount" id="${uid}-c"></span></div><div class="wdraw"><b>In the exam:</b> ${esc(data.draw)}</div>`;
  fig.appendChild(w);fig.querySelector('.walkbtn').textContent='Close walkthrough ✕';
  const resolve=(ref)=>{const bx=DIAGRAMS[id].boxes();const names=Array.isArray(ref)?ref:[ref];return names.map(n=>bx[n]).filter(Boolean);};
  const show=(k)=>{i=(k+data.steps.length)%data.steps.length;const st=data.steps[i];svg.querySelectorAll('.hl-g').forEach(g=>g.remove());const boxes=resolve(st[0]);if(!boxes.length){w.querySelector('#'+uid+'-n').textContent=i+1;w.querySelector('#'+uid+'-t').textContent=st[1];w.querySelector('#'+uid+'-c').textContent=`step ${i+1} of ${data.steps.length}`;return;}
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','hl-g');g.setAttribute('pointer-events','none');
    g.innerHTML=`<mask id="${uid}-m"><rect x="${vb.x}" y="${vb.y}" width="${vb.width}" height="${vb.height}" fill="white"/>${boxes.map(b=>`<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="8" fill="black"/>`).join('')}</mask><rect class="hl-dim" x="${vb.x}" y="${vb.y}" width="${vb.width}" height="${vb.height}" mask="url(#${uid}-m)"/>${boxes.map(b=>`<rect class="hl-box" x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="8"/>`).join('')}<circle class="hl-badge" cx="${boxes[0][0]}" cy="${boxes[0][1]}" r="10"/><text class="hl-badge-t" x="${boxes[0][0]}" y="${boxes[0][1]+4.2}" text-anchor="middle">${i+1}</text>`;
    svg.appendChild(g);w.querySelector('#'+uid+'-n').textContent=i+1;w.querySelector('#'+uid+'-t').textContent=st[1];w.querySelector('#'+uid+'-c').textContent=`step ${i+1} of ${data.steps.length}`;};
  const stopPlay=()=>{if(timer){clearInterval(timer);timer=null;w.querySelector('[data-w=play]').textContent='▶ Auto-play';}};
  w.addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(!b)return;const a=b.dataset.w;if(a==='next'){stopPlay();show(i+1);}else if(a==='prev'){stopPlay();show(i-1);}else if(a==='play'){if(timer){stopPlay();}else{b.textContent='⏸ Pause';timer=setInterval(()=>show(i+1),4500);}}else if(a==='all'){stopPlay();svg.querySelectorAll('.hl-g').forEach(g=>g.remove());const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','hl-g');g.setAttribute('pointer-events','none');g.innerHTML=data.steps.map((st,k)=>{const b=resolve(st[0])[0];if(!b)return '';return `<rect class="hl-box" style="animation:none" x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="8"/><circle class="hl-badge" cx="${b[0]}" cy="${b[1]}" r="10"/><text class="hl-badge-t" x="${b[0]}" y="${b[1]+4.2}" text-anchor="middle">${k+1}</text>`;}).join('');svg.appendChild(g);w.querySelector('#'+uid+'-t').innerHTML=data.steps.map((st,k)=>`<b>${k+1}.</b> ${esc(st[1])}`).join('<br>');w.querySelector('#'+uid+'-n').textContent='∑';w.querySelector('#'+uid+'-c').textContent='all steps';}});
  const key=(e)=>{if(!document.body.contains(w)){document.removeEventListener('keydown',key);return;}if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;const r=fig.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;if(e.key==='ArrowRight'){e.preventDefault();stopPlay();show(i+1);}if(e.key==='ArrowLeft'){e.preventDefault();stopPlay();show(i-1);}};
  document.addEventListener('keydown',key);fig._walkKey=key;show(0);}
function expand(html){return html.replace(/\[\[fig:([a-z0-9_]+)\]\]/g,(m,id)=>figHTML(id));}

// ----- splash -----
(function splash(){const text='Developed By Riyan Khan';const el=$('#typed');const sp=$('#splash');let i=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finish=()=>{sp.classList.add('gone');};
  $('#skipSplash').addEventListener('click',finish);
  if(reduced){el.textContent=text;$('#splashSub').classList.add('show');setTimeout(finish,900);return;}
  const tick=()=>{if(i<=text.length){el.textContent=text.slice(0,i);i++;setTimeout(tick,i<4?120:70);}else{$('#splashSub').classList.add('show');setTimeout(finish,1400);}};
  setTimeout(tick,350);
})();

// ----- NOTES -----
let curTopic=store.get('topic',TOPICS[0].id);
renderers.notes=function(){const p=$('#panel-notes');p.innerHTML=`<div class="notes"><aside class="rail" id="rail"></aside><article class="topic" id="topicView"></article></div>`;renderRail();showTopic(curTopic);};
function renderRail(){const r=$('#rail');const done=doneTopics();let html='';let unit='';TOPICS.forEach(t=>{if(t.unit!==unit){unit=t.unit;html+=`<div class="unit">${esc(unit)}</div>`;}html+=`<button data-t="${t.id}" class="${t.id===curTopic?'active':''}"><span class="done ${done.includes(t.id)?'on':''}"></span>${esc(t.title)}</button>`;});r.innerHTML=html;$$('button',r).forEach(b=>b.addEventListener('click',()=>showTopic(b.dataset.t)));}
function showTopic(id){const t=TOPICS.find(x=>x.id===id)||TOPICS[0];curTopic=t.id;store.set('topic',t.id);const i=TOPICS.indexOf(t);const done=doneTopics().includes(t.id);
  $('#topicView').innerHTML=`<div class="head"><div><div class="eyebrow">${esc(t.unit)}</div><h2>${esc(t.title)}</h2><p class="muted" style="margin-top:4px;max-width:70ch">${esc(t.summary)}</p></div><label class="chk"><input type="checkbox" id="doneChk" ${done?'checked':''}> I know this topic</label></div>${expand(t.body)}
  <div class="topic-nav">${i>0?`<button class="btn" data-t="${TOPICS[i-1].id}">← ${esc(TOPICS[i-1].title)}</button>`:'<span></span>'}${i<TOPICS.length-1?`<button class="btn primary" data-t="${TOPICS[i+1].id}">${esc(TOPICS[i+1].title)} →</button>`:'<span></span>'}</div>
  <p class="muted" style="margin-top:16px;font-size:.9rem">Practice this topic: <button class="btn small" id="toPractice">long questions</button> <button class="btn small" id="toFlash">flashcards</button></p>`;
  $('#doneChk').addEventListener('change',()=>{toggleDone(t.id);renderRail();toast(doneTopics().includes(t.id)?'Marked as known':'Unmarked');});
  $$('.topic-nav button').forEach(b=>b.addEventListener('click',()=>{showTopic(b.dataset.t);window.scrollTo({top:0});}));
  $('#toPractice').addEventListener('click',()=>{setMode('practice');$('#pfTopic').value=t.id;renderPractice();});
  $('#toFlash').addEventListener('click',()=>setMode('flash'));

// ----- FLASHCARDS -----
let fDeck=[],fIdx=0,fCat='All';
renderers.flash=function(){const cats=['All',...new Set(FLASHCARDS.map(c=>c[2]))];$('#panel-flash').innerHTML=`<div class="flash-wrap"><div><h2>Flashcards</h2><p class="muted" style="margin-top:4px">Tap the card to flip. Mark cards you know; "Review unknown" rebuilds the deck from the rest. <span class="kbd">Space</span> flip · <span class="kbd">→</span> next</p></div><div class="chips" id="fCats">${cats.map(c=>`<button class="chip ${c===fCat?'active':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="flashcard" id="fcard"><div class="inner"><div class="face front"><div class="eyebrow" id="fTopic"></div><div class="q" id="fQ"></div><p class="muted" style="font-size:.85rem">tap to reveal</p></div><div class="face back"><div class="eyebrow">Answer</div><div class="a" id="fA"></div></div></div></div><div class="flash-ctl"><button class="btn" id="fPrev">← Prev</button><button class="btn" id="fFlip">Flip</button><button class="btn primary" id="fNext">Next →</button><button class="btn" id="fKnow">✓ I know this</button><button class="btn ghost" id="fShuffle">Shuffle</button><button class="btn ghost" id="fUnknown">Review unknown</button></div><p class="score" id="fCount" style="text-align:center"></p></div>`;
  buildDeck();$('#fCats').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;fCat=b.dataset.c;$$('#fCats .chip').forEach(x=>x.classList.toggle('active',x===b));buildDeck();});
  $('#fcard').addEventListener('click',flip);$('#fFlip').addEventListener('click',flip);$('#fNext').addEventListener('click',()=>move(1));$('#fPrev').addEventListener('click',()=>move(-1));
  $('#fKnow').addEventListener('click',()=>{const k=store.get('flashKnown',[]);const key=fDeck[fIdx][0];if(!k.includes(key))k.push(key);store.set('flashKnown',k);toast('Marked known');move(1);});
  $('#fShuffle').addEventListener('click',()=>{fDeck=shuffle(fDeck);fIdx=0;showCard();});
  $('#fUnknown').addEventListener('click',()=>{const k=store.get('flashKnown',[]);const d=FLASHCARDS.filter(c=>(fCat==='All'||c[2]===fCat)&&!k.includes(c[0]));if(!d.length){toast('All cards marked known — well done');return;}fDeck=shuffle(d);fIdx=0;showCard();});
  document.addEventListener('keydown',e=>{if(!$('#panel-flash').classList.contains('active')||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.code==='Space'){e.preventDefault();flip();}if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);});};
function buildDeck(){fDeck=shuffle(FLASHCARDS.filter(c=>fCat==='All'||c[2]===fCat));fIdx=0;showCard();}
function showCard(){const c=fDeck[fIdx];$('#fcard').classList.remove('flipped');$('#fTopic').textContent=c[2];$('#fQ').textContent=c[0];$('#fA').textContent=c[1];const k=store.get('flashKnown',[]);$('#fCount').textContent=`${fIdx+1} / ${fDeck.length} · ${k.length} known overall`;}
function flip(){$('#fcard').classList.toggle('flipped');}
function move(d){fIdx=(fIdx+d+fDeck.length)%fDeck.length;showCard();}

// ----- PRACTICE -----
renderers.practice=function(){$('#panel-practice').innerHTML=`<h2>Practice questions</h2><p class="muted" style="margin:6px 0 12px;max-width:72ch">Write your answer on paper first, then open the model answer. Answers use the PPT wording in simple language and are structured for the exam: definition → explanation → diagram/table → example. <span class="badge asg">Assignment</span> = your teacher’s practice set (most likely to appear); <span class="badge ppt">PPT</span> = questions from the lecture slides’ own assessments.</p>
  <div class="filters"><label>Topic <select id="pfTopic"><option value="">All topics</option>${TOPICS.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></label><label>Marks <select id="pfMarks"><option value="">All</option><option value="7">7</option><option value="10">10</option><option value="16">16</option></select></label><label class="chk"><input type="checkbox" id="pfAsg"> Assignment only</label><button class="btn small" id="pfExpand">Show all answers</button></div><div id="plist"></div>`;

function qCard(q,n){return `<div class="qcard" id="q-${q.id}"><div class="qhead"><span class="badge m${q.marks}">${q.marks} marks</span>${q.tags.includes('asg')?`<span class="badge asg">Assignment Q${q.id.slice(1)}</span>`:(q.tags.includes('ppt')?`<span class="badge ppt">PPT</span>`:'')}<span class="badge">${esc(TOPIC_NAME[q.topic]||'')}</span></div><div class="qtext" style="margin-top:8px">${n?n+'. ':''}${esc(q.q)}</div><div class="howto">Suggested length: ${q.marks===7?'about 1 page, 6–8 points':q.marks===10?'1.5–2 pages with a diagram or table':'3 pages, cover every part, draw all diagrams'}.</div><button class="btn small" style="margin-top:10px" data-toggle="${q.id}">Show model answer</button><div class="answer" hidden>${expand(q.ans)}</div></div>`;}
function renderPractice(){const t=$('#pfTopic').value,m=$('#pfMarks').value,a=$('#pfAsg').checked;const list=QUESTIONS.filter(q=>(!t||q.topic===t)&&(!m||String(q.marks)===m)&&(!a||q.tags.includes('asg')));$('#plist').innerHTML=`<p class="muted" style="margin-bottom:10px">${list.length} question${list.length===1?'':'s'}</p>`+list.map((q,i)=>qCard(q,i+1)).join('');bindToggles('#plist');}
function bindToggles(root){$$(root+' [data-toggle]').forEach(b=>b.addEventListener('click',()=>{const a=b.nextElementSibling;a.hidden=!a.hidden;b.textContent=a.hidden?'Show model answer':'Hide model answer';}));}

// ----- MCQ -----
let mcqDeck=[],mcqIdx=0,mcqScore=0;
renderers.mcq=function(){$('#panel-mcq').innerHTML=`<div class="mcq"><h2>MCQ quiz</h2><p class="muted" style="margin:4px 0 12px">Quick-fire objective questions. Each round is 15 random questions; your overall accuracy is saved on this device.</p><div class="filters"><button class="btn primary" id="mcqStart">Start a round of 15</button><button class="btn" id="mcqAll">All ${MCQS.length} questions</button><span class="score" id="mcqOverall"></span></div><div id="mcqBox"></div></div>`;
  const stats=store.get('mcqStats',{a:0,c:0});$('#mcqOverall').textContent=stats.a?`Overall: ${stats.c}/${stats.a} (${Math.round(stats.c/stats.a*100)}%)`:'';
  $('#mcqStart').addEventListener('click',()=>startMcq(15));$('#mcqAll').addEventListener('click',()=>startMcq(MCQS.length));};
function startMcq(n){mcqDeck=shuffle(MCQS).slice(0,n);mcqIdx=0;mcqScore=0;showMcq();}
function showMcq(){const box=$('#mcqBox');if(mcqIdx>=mcqDeck.length){const pct=Math.round(mcqScore/mcqDeck.length*100);box.innerHTML=`<div class="result"><h3>Round complete: ${mcqScore} / ${mcqDeck.length} (${pct}%)</h3><p style="margin-top:6px">${pct>=80?'Excellent — you are exam-ready on these.':pct>=60?'Good. Revisit the explanations you missed.':'Go back to the notes for the weak topics, then try again.'}</p></div>`;return;}
  const q=mcqDeck[mcqIdx];box.innerHTML=`<div class="qcard"><div class="score">Question ${mcqIdx+1} of ${mcqDeck.length} · score ${mcqScore}</div><div class="qtext" style="margin:8px 0">${esc(q[0])}</div>${q[1].map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}<div id="mcqWhy"></div></div>`;
  $$('#mcqBox .opt').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.i;$$('#mcqBox .opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===q[2])x.classList.add('correct');});if(i!==q[2])b.classList.add('wrong');else mcqScore++;const st=store.get('mcqStats',{a:0,c:0});st.a++;if(i===q[2])st.c++;store.set('mcqStats',st);$('#mcqOverall').textContent=`Overall: ${st.c}/${st.a} (${Math.round(st.c/st.a*100)}%)`;
    $('#mcqWhy').innerHTML=`<div class="why"><b>${i===q[2]?'Correct.':'Not quite.'}</b> ${esc(q[3])}</div><button class="btn primary" style="margin-top:10px" id="mcqNext">Next →</button>`;$('#mcqNext').addEventListener('click',()=>{mcqIdx++;showMcq();});}));}

// ----- MOCK TEST -----
let mock=null,timerH=null;
renderers.mock=function(){const hist=store.get('mockHistory',[]);$('#panel-mock').innerHTML=`<h2>Mock test (MTE pattern)</h2><p class="muted" style="margin:4px 0 12px;max-width:72ch">A fresh paper every time: 2 × 7 marks, 2 × 10 marks, and a 16-mark question with an OR choice — 50 marks. Answer on paper (or type notes below), then reveal the model answers and give yourself marks honestly. Scores are saved on this device.</p>
  <div class="mock-head"><label>Duration <select id="mockMins"><option value="60">60 min</option><option value="90" selected>90 min</option><option value="120">120 min</option></select></label><label class="chk"><input type="checkbox" id="mockAsg" checked> Prefer assignment questions</label><button class="btn primary" id="mockStart">Generate &amp; start</button></div><div id="mockBox"></div>
  ${hist.length?`<div class="card" style="margin-top:18px"><div class="eyebrow">Previous attempts</div><table class="history" style="margin-top:6px"><thead><tr><th>Date</th><th>Score</th><th>%</th></tr></thead><tbody>${hist.slice(-8).reverse().map(h=>`<tr><td>${esc(h.d)}</td><td>${h.s}/50</td><td>${Math.round(h.s/50*100)}%</td></tr>`).join('')}</tbody></table></div>`:''}`;
  $('#mockStart').addEventListener('click',startMock);};
function pick(pool,n,used){const p=shuffle(pool.filter(q=>!used.has(q.id)));const out=p.slice(0,n);out.forEach(q=>used.add(q.id));return out;}
function startMock(){const preferAsg=$('#mockAsg').checked;const used=new Set();const by=(m)=>QUESTIONS.filter(q=>q.marks===m);const sel=(m,n)=>{let out=[];if(preferAsg){out=pick(by(m).filter(q=>q.tags.includes('asg')),Math.min(n,Math.ceil(n/2)),used);}out=out.concat(pick(by(m),n-out.length,used));return shuffle(out);};
  mock={q7:sel(7,2),q10:sel(10,2),q16:sel(16,2),start:Date.now(),mins:+$('#mockMins').value,marks:{}};
  const box=$('#mockBox');let n=0;const block=(q,label,marks)=>`<div class="mq"><div class="lab"><span>${label}</span><span class="badge m${marks}">${marks} marks</span></div><p style="margin-top:8px;font-weight:600">${esc(q.q)}</p><textarea id="ans-${q.id}" placeholder="Rough notes / key points you would write…"></textarea><div class="selfmark" hidden><span>Self-mark:</span><input type="number" min="0" max="${marks}" value="0" data-id="${q.id}" data-max="${marks}"> / ${marks}</div><button class="btn small" style="margin-top:8px" data-toggle="${q.id}" hidden>Show model answer</button><div class="answer" hidden>${expand(q.ans)}</div></div>`;
  box.innerHTML=`<div class="mock-head"><div class="timer" id="timer">--:--</div><span class="muted">Max marks 50 · Part A: Q1–Q2 (7 each) · Part B: Q3–Q4 (10 each) · Part C: Q5 (16, attempt one)</span><button class="btn" id="mockSubmit">Finish &amp; reveal answers</button></div>
  <h3 style="margin:10px 0">Part A</h3>${mock.q7.map(q=>block(q,'Q'+(++n),7)).join('')}<h3 style="margin:10px 0">Part B</h3>${mock.q10.map(q=>block(q,'Q'+(++n),10)).join('')}<h3 style="margin:10px 0">Part C — attempt either (a) or (b)</h3>${block(mock.q16[0],'Q5 (a)',16)}<div class="mq" style="padding:6px"><div class="or">OR</div></div>${block(mock.q16[1],'Q5 (b)',16)}<div id="mockResult"></div>`;
  box.scrollIntoView({behavior:'smooth'});clearInterval(timerH);timerH=setInterval(tickTimer,1000);tickTimer();$('#mockSubmit').addEventListener('click',finishMock);}
function tickTimer(){if(!mock)return;const left=mock.mins*60-Math.floor((Date.now()-mock.start)/1000);const t=$('#timer');if(!t){clearInterval(timerH);return;}if(left<=0){t.textContent='00:00';t.classList.add('low');clearInterval(timerH);toast('Time is up — reveal the answers');return;}const m=Math.floor(left/60),s=left%60;t.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;t.classList.toggle('low',left<300);}
function finishMock(){clearInterval(timerH);$$('#mockBox .selfmark').forEach(e=>e.hidden=false);$$('#mockBox [data-toggle]').forEach(b=>b.hidden=false);bindToggles('#mockBox');$('#mockSubmit').hidden=true;
  const res=$('#mockResult');res.innerHTML=`<div class="result"><h3>Now mark yourself</h3><p style="margin-top:6px">Open each model answer, compare with what you wrote, and enter marks. For Part C enter marks only for the option you attempted.</p><button class="btn primary" style="margin-top:10px" id="mockSave">Save score</button><div id="mockScore" class="score" style="margin-top:8px"></div></div>`;
  $('#mockSave').addEventListener('click',()=>{let total=0;const inputs=$$('#mockBox .selfmark input');inputs.forEach(i=>{const v=Math.min(+i.dataset.max,Math.max(0,+i.value||0));i.value=v;});const c16=inputs.filter(i=>i.dataset.max==='16').map(i=>+i.value);total=inputs.filter(i=>i.dataset.max!=='16').reduce((s,i)=>s+ +i.value,0)+Math.max(...c16);total=Math.min(50,total);const h=store.get('mockHistory',[]);h.push({d:new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}),s:total});store.set('mockHistory',h);$('#mockScore').textContent=`Saved: ${total} / 50 (${Math.round(total/50*100)}%)`;toast('Score saved');});
  res.scrollIntoView({behavior:'smooth'});}

// ----- boot -----
const h=(location.hash||'').replace('#','');setMode(MODES.includes(h)?h:'home',false);
})();


</script>
