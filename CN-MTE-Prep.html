{id:'lineconfig',unit:'Unit 1 · Basics',title:'Line configuration & transmission modes',summary:'Point-to-point vs multipoint links; simplex, half-duplex and full-duplex with examples.',
body:`
<section><h3>Line configuration (type of connection)</h3>
${beyond('line configuration is in the syllabus but not in the PPTs. Simple meaning:')}
${def('Line configuration','the way two or more devices attach to a link. A <i>link</i> is the communication path that carries data from one device to another.')}
${fig('lineconfig')}
<ul><li><b>Point-to-point</b> — a dedicated link between two devices; the whole capacity of the link is for them. Example: TV remote and TV, two routers on a leased line.</li><li><b>Multipoint (multidrop)</b> — more than two devices share one link. The capacity is shared either at the same time (spatially) or by taking turns (time-shared). Example: a bus topology LAN.</li></ul>
</section>
<section><h3>Transmission mode</h3>
${def('Transmission mode (communication mode)','the direction of data flow between two devices connected over a network.')}
<p><b>Why it matters:</b> it decides how well the channel is used, affects speed and cost, helps choose the right hardware/protocol, and is the base for designing communication systems.</p>
${fig('modes')}
<p><b>1. Simplex mode</b> — communication is one way (unidirectional). Only one device sends; the other only receives and can never send back. The whole channel capacity is used in one direction. Simplest and cheapest. <i>Examples:</i> keyboard → CPU, CPU → monitor, TV and radio broadcasting, loudspeaker, CCTV camera → monitor. <i>Analogy:</i> a one-way street.</p>
<p><b>2. Half-duplex mode</b> — communication is two way, but only one device can send at a time; they take turns. The full bandwidth is available to whichever device is sending. Better than simplex, slower than full-duplex because of waiting. <i>Examples:</i> walkie-talkies, old intercoms, CB radio, police wireless, old hub-based Ethernet. <i>Analogy:</i> a walkie-talkie — you must say "over" and release the button before the other person can reply.</p>
<p><b>3. Full-duplex mode</b> — both devices send and receive at the same time. The channel capacity is split or managed so both directions work together. Fastest and most efficient for two-way communication, but needs more complex and costly hardware. <i>Examples:</i> telephone and mobile calls, video conferencing (Zoom, Meet), modern switched LAN links. <i>Analogy:</i> a two-way road.</p>
${tbl(['Basis','Simplex','Half-duplex','Full-duplex'],[['Direction','One direction only','Both directions, one at a time','Both directions at the same time'],['Efficiency','Low (one way)','Moderate','High'],['Speed','N/A (one way)','Slower (waiting to switch)','Fastest'],['Complexity / cost','Simple, low cost','Moderate','More complex, higher cost'],['Example device','Keyboard, TV','Walkie-talkie','Telephone']])}
<p><b>Choosing the mode:</b> use simplex when data goes one way and no feedback is needed (broadcasting); half-duplex when both need to talk but not together and cost is limited (two-way radios); full-duplex when real-time two-way communication is needed (voice/video calls).</p>
${tip('Always draw the three Device A – Device B rows with arrows and give one example each. The question itself gives the examples: TV broadcast, walkie-talkie, telephone.')}
${src('Lecture 7')}
</section>`},

{id:'categories',unit:'Unit 1 · Basics',title:'Categories of networks: PAN, LAN, MAN, WAN',summary:'Networks classified by the area they cover, with features, examples, advantages and disadvantages.',
body:`
<section><h3>Classification by coverage area</h3>
<p>Your home Wi-Fi, your college network and the Internet are all networks, but they differ in size, speed and ownership. So networks are classified by the geographical area they cover.</p>
${fig('categories')}
</section>
<section><h3>LAN — Local Area Network</h3>
<p>A network that connects computers and devices within a small area — a room, a building or a campus — for fast and easy sharing of data and resources.</p>
<ul><li>Covers a small area (up to a few kilometres); very high speed (100 Mbps to several Gbps).</li><li>Usually owned, set up and managed by a single organisation.</li><li>Uses Ethernet cables or Wi-Fi; low error rate and high reliability because distances are short.</li><li><b>Advantages:</b> very fast data sharing, easy sharing of printers/files/Internet, central storage and backup, cost-effective, simple to install and manage.</li><li><b>Disadvantages:</b> limited area, initial hardware and cabling cost, security risk if not managed properly.</li><li><b>Examples:</b> college computer lab, office LAN, home Wi-Fi.</li></ul>
</section>
<section><h3>MAN — Metropolitan Area Network</h3>
<p>A network larger than a LAN — usually a whole city or town — often made by connecting several LANs together.</p>
<ul><li>Covers a city (about 5 to 50 km); moderate to high speed (slower than LAN, faster than WAN).</li><li>Owned by a single organisation or a group (a telecom company or civic body); commonly uses fibre-optic backbone cables.</li><li><b>Advantages:</b> connects many LANs across a city, efficient for organisations with several branches in one city, better speed and reliability than a WAN.</li><li><b>Disadvantages:</b> expensive to set up and maintain, harder to secure, needs special equipment and skilled technicians.</li><li><b>Examples:</b> cable TV network of a city, city-wide bank branch network, university campuses linked across a city.</li></ul>
</section>
<section><h3>WAN — Wide Area Network</h3>
<p>A network that spans a very large area — across cities, countries or continents. The Internet is the largest WAN.</p>
<ul><li>Generally lower speed than LAN/MAN (improving with fibre); owned by multiple organisations; uses public or leased links — satellite, leased telephone lines, fibre backbones.</li><li>Made of many connected LANs and MANs.</li><li><b>Advantages:</b> connects users over huge distances, global communication and business, central data sharing across branches.</li><li><b>Disadvantages:</b> high setup and maintenance cost, more transmission errors and security threats, slower and more complex to manage.</li><li><b>Examples:</b> the Internet, nationwide bank network, airline reservation systems.</li></ul>
</section>
<section><h3>PAN — Personal Area Network</h3>
<p>The smallest network, for one person's own devices within a very short range (a few metres).</p>
<ul><li>Range up to about 10 metres; wireless (Bluetooth, infrared) or wired (USB); low power, very easy to set up.</li><li><b>Examples:</b> Bluetooth earphones with a smartphone, laptop on a phone's hotspot, smartwatch synced with a phone.</li></ul>
</section>
<section><h3>Comparison</h3>
${tbl(['Feature','LAN','MAN','WAN','PAN'],[['Coverage','Room / building / campus','A city','Country / continent','A few metres (one person)'],['Typical speed','Very high','High','Moderate','High but short range'],['Ownership','Single organisation','Organisation / consortium','Multiple organisations','An individual'],['Example','College lab network','City cable TV network','The Internet','Bluetooth earphones']])}
${tip('General rule to write: as the area grows (LAN → MAN → WAN) the speed generally decreases and the cost, ownership and complexity increase.')}
${src('Lecture 8')}
</section>`},

{id:'topology',unit:'Unit 1 · Basics',title:'Network topologies',summary:'Bus, Star, Ring, Mesh, Tree (Star-Bus), Star-Ring and Hybrid: how each works, advantages, disadvantages and where to use it.',
body:`
<section><h3>What is network topology?</h3>
${def('Network topology','the physical or logical arrangement of computers, networking devices and communication links in a network. In simple words, it describes how devices are connected and how data travels between them.')}
<ul><li><b>Physical topology</b> — the actual arrangement of cables and devices.</li><li><b>Logical topology</b> — how data flows between devices, regardless of the cabling.</li></ul>
<p><b>How it works:</b> a network has nodes (computers, servers, printers), networking devices (switches, routers, hubs, access points), transmission media (Ethernet, fibre, wireless) and protocols (Ethernet, TCP/IP, Wi-Fi). The topology decides which device connects to which, and so the path data can take.</p>
<p><b>Why topology matters (advantages of choosing well):</b> better network planning, efficient communication, fault management (how one failure affects the rest), scalability (adding devices), cost management, and security (segmentation).</p>
${src('Lecture 4')}
</section>
<section><h3>1. Bus topology</h3>${fig('bus')}
<p>All computers connect to one common cable called the <b>bus</b>. The ends of the bus are closed with <b>terminators</b> that absorb the signal so it does not reflect back. <b>Working:</b> station 1 puts its data on the bus; the signal travels along the shared cable; all stations can detect it; only the station the data is meant for accepts it; the others ignore it.</p>
<ul><li><b>Advantages:</b> simple, needs less cable, cheap, easy to implement for small networks, no central device.</li><li><b>Disadvantages:</b> failure of the backbone stops the whole network; performance drops as traffic grows (collisions); difficult troubleshooting; limited scalability; a break in the main cable disconnects many devices.</li><li><b>Used in:</b> early Ethernet LANs, small temporary networks, older networks.</li></ul></section>
<section><h3>2. Star topology</h3>${fig('star')}
<p>Every computer is connected to a central device, normally a <b>switch</b> (or hub). <b>Working (PC1 → PC4):</b> PC1 creates the frame and sends it to the switch; the switch reads the destination MAC address, finds the right port and forwards the frame to PC4. A modern switch learns which MAC address is on which port, so it does not send the frame to every port.</p>
<ul><li><b>Advantages:</b> easy to install, manage and troubleshoot; a cable failure affects only one device; easy to add devices; good performance with switches; suitable for large LANs.</li><li><b>Disadvantages:</b> needs a central switch/hub; if the central device fails, all connected devices are affected; more cable than bus; higher installation cost.</li><li><b>Used in:</b> computer labs, schools, offices, homes, data centres — the most common physical topology in modern Ethernet LANs.</li></ul></section>
<section><h3>3. Ring topology</h3>${fig('ring')}
<p>Every device is connected to its two neighbours, forming a closed circle. Data travels around the ring. Traditional rings use <b>token passing</b>: a special control frame (the token) circulates, and a device gets the chance to transmit only when it receives the token.</p>
<ul><li><b>Advantages:</b> organised data transmission; token-based design gives predictable access; fewer collision problems; each device gets a turn.</li><li><b>Disadvantages:</b> failure of a device or link can affect a simple ring; adding or removing devices is disruptive; troubleshooting is difficult; expansion is less convenient; modern LANs prefer switched Ethernet.</li><li><b>Used in:</b> Token Ring networks, FDDI, some special communication systems.</li></ul></section>
<section><h3>4. Mesh topology</h3>${fig('mesh')}
<p>Devices are connected using many links, so there are multiple paths between devices; in a full mesh every device is directly connected to every other device.</p>
<ul><li><b>Advantages:</b> highly reliable; multiple paths; excellent fault tolerance (one link failure does not stop communication); suitable for critical networks; provides redundancy.</li><li><b>Disadvantages:</b> very expensive for full mesh; many cables and interfaces; complex installation and management; does not scale economically to many nodes.</li><li><b>Used in:</b> WANs, Internet backbone, wireless mesh networks, military and emergency communication.</li></ul>
<p><b>Formula:</b> links in a full mesh = n(n−1)/2. Example: 5 nodes → 5×4/2 = 10 links.</p></section>
<section><h3>5. Tree topology (Star-Bus)</h3>${fig('starbus')}
<p>A hierarchical structure in which several star-like networks are connected through higher-level devices. Large tree networks have levels: core layer, distribution layer, access layer.</p>
<ul><li><b>Advantages:</b> highly scalable; good for large organisations; easy hierarchical management; easy to divide into departments; easier fault isolation; new branches can be added easily.</li><li><b>Disadvantages:</b> failure of a higher-level device affects many devices; needs more equipment; more complex configuration; more expensive than a simple star; needs careful planning.</li><li><b>Used in:</b> universities, corporate offices, large campuses, enterprise networks.</li></ul></section>
<section><h3>6. Star-Ring topology</h3>${fig('starring')}
${beyond('star-ring is named in the syllabus but not explained in the PPTs. Simple meaning:')}
<p>Devices are cabled like a star to a central box called the <b>MAU</b> (Multistation Access Unit), but inside the box the ports are joined in a ring, so the token still passes station to station. A failed station is bypassed automatically. Used by IBM Token Ring.</p></section>
<section><h3>7. Hybrid topology</h3><p>Two or more different topologies combined to meet specific needs (for example star-bus or star-ring). Flexible and scalable but more complex and costly.</p></section>
<section><h3>Comparison of all topologies</h3>${fig('topocompare')}
${tbl(['Feature','Bus','Star','Ring','Mesh','Tree','Hybrid'],[['Structure','Backbone','Central device','Circular','Multiple links','Hierarchical','Combination'],['Cost','Low','Moderate','Moderate','High','Moderate–High','High'],['Reliability','Low','Good','Moderate','Very high','Good','High'],['Scalability','Low','Good','Moderate','Limited/expensive','Very high','Very high'],['Installation','Easy','Easy','Moderate','Difficult','Moderate','Difficult'],['Maintenance','Difficult','Easy','Moderate','Difficult','Moderate','Difficult'],['Fault tolerance','Low','Moderate','Low–Moderate','Very high','Good','Depends'],['Modern use','Rare','Very common','Special/old','Backbone','Very common','Very common']])}
${tip('Draw each topology small but labelled (terminator, switch, token, MAU). For each write: working, 2 advantages, 2 disadvantages, 1 place where it is used.')}
${src('Lecture 4')}
</section>`},

{id:'devices',unit:'Unit 1 · Basics',title:'Network devices: hub, repeater, bridge, switch, router, gateway',summary:'What each device does, its OSI layer, real-life examples, and why a hub is a physical-layer device.',
body:`
<section><h3>Devices and their layers</h3>${fig('devices')}
<p><b>Hub</b> — a simple, unintelligent multi-port device that connects several computers in a LAN. It broadcasts every incoming signal to ALL connected devices: a frame entering one port is copied to every other port, so every device sees all traffic. Bandwidth is shared and half-duplex; more devices mean more collisions. Cheap but inefficient and insecure, so hubs have been replaced by switches. A hub is called a "multi-port repeater". <i>Examples:</i> old school computer-lab LANs, temporary demo networks; like a USB hub splitting one port into many.</p>
<p><b>Repeater</b> — a two-port device at Layer 1 (Physical) that regenerates weak, distorted signals so data can travel longer distances. Signals lose strength over distance (attenuation); the repeater cleans the signal and re-creates it at full strength (regeneration, not just amplification). It connects two segments of the SAME network and does not understand addresses. <i>Examples:</i> Wi-Fi range extender at home, joining two 100 m Ethernet runs, repeaters every 50–100 km in undersea fibre cables.</p>
<p><b>Bridge</b> — works at Layer 2 (Data Link). It reads MAC addresses in frames and forwards traffic only where it needs to go. It connects two LAN segments and learns which devices are on each side (MAC-address learning). Frames are forwarded only when the destination is on the other segment, so there is less traffic and fewer collisions; both segments stay in the same logical network. Types: transparent bridges, wireless bridges. <i>Examples:</i> wireless bridge between two buildings, splitting a crowded office LAN into two segments, connecting a wired and a wireless segment.</p>
<p><b>Router</b> — works at Layer 3 (Network). It reads IP addresses and chooses the best path for each packet between networks: home LAN to the Internet, or one office network to another. It uses a routing table (static routes or dynamic protocols like OSPF and BGP). Home routers also do NAT, DHCP, firewall and Wi-Fi. <b>Key difference:</b> a bridge joins segments of the same network; a router joins different networks. <i>Examples:</i> home Wi-Fi router, office/campus routers with VPN, Internet backbone routers.</p>
<p><b>Gateway</b> — the "translator" of the network: it converts between different protocols, data formats or systems so incompatible networks can talk. It is the most powerful device, works up to Layer 7 (Application), and often includes routing and switching. "Default gateway" = the IP address of the router your device uses to leave the LAN. <i>Examples:</i> VoIP gateway (telephone lines PSTN ↔ Internet voice SIP), online payment gateway (website ↔ bank network), e-mail and API gateways.</p>
${tbl(['Device','Layer','What it does','Traffic behaviour'],[['Hub','1 – Physical','Multi-port signal broadcaster','Copies every frame to ALL ports'],['Repeater','1 – Physical','Signal regenerator','One stream in, one stronger stream out'],['Bridge','2 – Data Link','MAC-address filter','Forwards frames only to the right segment'],['Router','3 – Network','IP-based path finder','Chooses the best path for each packet'],['Gateway','Up to 7 – Application','Protocol translator','Converts between systems, then sends on']])}
${src('Lecture 10')}
</section>
<section><h3>Hub vs switch</h3>${fig('hubswitch')}
<p><b>Why a hub in a star topology is a Physical-layer device:</b> the hub only deals with raw electrical signals. It receives bits on one port, regenerates them and repeats them out of every other port. It cannot read a MAC address, cannot filter or choose a port, and all stations share one collision domain. Because it works only with signals and the physical connection, it belongs to Layer 1 — just like a multi-port repeater. A switch, which reads the destination MAC address and sends the frame to that port only, is the Layer-2 device that replaced it.</p>
<p><b>Switch</b> (from Lecture 1 and 4): directs data to the specific device inside a network by learning which MAC address is reachable through which port.</p>
</section>
<section><h3>Which device for which problem? (lecture activity)</h3>
${tbl(['Situation','Device'],[['Wi-Fi signal is weak in the garden and needs extending','Repeater'],['Office has two LAN segments and wants less traffic between them','Bridge'],['Company wants to connect its internal LAN to the Internet','Router'],['Traditional telephone system must talk to an Internet voice system','Gateway'],['A network cable is very long and the signal becomes weak','Repeater'],['Two sections of a LAN need connecting with MAC-based filtering','Bridge'],['Two different IP networks need to communicate','Router'],['Two networks using different protocols need to exchange data','Gateway']])}
${tip('One-line summary to write: "Intelligence grows left to right: Hub → Repeater → Bridge → Router → Gateway." Give one real-life example for each.')}
${src('Lecture 10')}
</section>`},

{id:'osi',unit:'Unit 2 · Reference models',title:'OSI reference model',summary:'The seven layers, the job of each, PDUs, protocols, real-life examples and the mnemonics.',
body:`
<section><h3>What is the OSI model?</h3>
${def('OSI model','the Open Systems Interconnection model, an ISO standard (ISO/IEC 7498, 1984) that divides network communication into 7 layers. Each layer does a specific job and talks only to the layers directly above and below it, so hardware, software and protocols can be developed independently.')}
<p><b>Why it is useful:</b> modular design (change one layer without breaking others), standard communication (every vendor builds to the same 7-layer contract, so devices interoperate), faster troubleshooting (find problems layer by layer: "is it the cable, the router or the app?").</p>
${fig('osi')}
${src('Lecture 11')}
</section>
<section><h3>The seven layers</h3>
${tbl(['#','Layer','PDU','Function','Real-life example','Protocols'],[
['1','Physical','Bit','Transmits raw bits (0s and 1s) over the medium — cables, connectors, voltages, data rates. Defines electrical/optical/radio signals and the physical topology. 1 = voltage present, 0 = no voltage.','"The road the data drives on": Ethernet cables, fibre, Wi-Fi radio waves.','Ethernet (PHY), USB, Bluetooth, DSL, RS-232'],
['2','Data Link','Frame','Groups bits into frames and adds a MAC (hardware) address. Detects/corrects errors with CRC. Controls who may talk on a shared medium (CSMA/CD for Ethernet, CSMA/CA for Wi-Fi).','"Traffic rules on a street": the MAC address is like a car number plate; a switch reads it and forwards only to the right device.','Ethernet (MAC), Wi-Fi 802.11, PPP, ARP'],
['3','Network','Packet','Adds logical (IP) addresses of sender and receiver across different networks. Routes packets — chooses the best path. Fragmentation and reassembly.','"The postal service": the IP address is your home address; routers are post offices choosing the route.','IP (v4/v6), ICMP, OSPF, BGP'],
['4','Transport','Segment','End-to-end delivery between applications using port numbers. Segments data and reassembles it in order. Flow control, error control, congestion control — reliable (TCP) or fast (UDP).','"Courier with tracking": TCP is registered post (numbered, confirmed, resent if lost); UDP is a postcard (fast, no receipt) — good for live video and gaming.','TCP, UDP'],
['5','Session','Data','Establishes, manages and ends sessions between two applications. Adds checkpoints so a long transfer can resume, not restart. Controls dialog (half/full duplex).','"A phone call": dial (open), talk (exchange), hang up (close). Video calls and online meetings are sessions.','NetBIOS, RPC, SIP, PPTP'],
['6','Presentation','Data','Translation between the app format and the network format (ASCII/Unicode). Encryption and decryption. Compression (ZIP, JPEG, MP3).','"A translator and a safe": translates languages and locks data in a safe (the HTTPS padlock).','SSL/TLS, JPEG, MPEG, ASCII, Unicode, GIF'],
['7','Application','Data','The layer you actually touch — gives network services to end-user software: file transfer, e-mail, web browsing, name lookup, remote login. Identifies partners and checks resources.','"The apps you use": browser (HTTP), e-mail (SMTP/IMAP), file transfer (FTP), DNS (the phone book of the Internet).','HTTP/HTTPS, SMTP, IMAP, POP3, FTP, DNS, DHCP'],
])}
<p><b>Mnemonics:</b> top → bottom "<i>Please Do Not Throw Sausage Pizza Away</i>"; bottom → top "<i>All People Seem To Need Data Processing</i>".</p>
</section>
<section><h3>How data moves through the layers (encapsulation)</h3>${fig('encap')}
<p>At the sender each layer adds its own header (the data link layer also adds a trailer with the CRC). At the receiver the headers are removed in the reverse order. A router only looks up to layer 3.</p>
${tip('A 10-mark OSI question needs: definition and purpose, the 7-layer diagram with PDUs, one or two functions per layer with an example, and the mnemonic.')}
${src('Lecture 11')}
</section>`},

{id:'tcpip',unit:'Unit 2 · Reference models',title:'TCP/IP model & comparison with OSI',summary:'The four TCP/IP layers with their jobs and protocols, the e-mail example, and the OSI ↔ TCP/IP comparison.',
body:`
<section><h3>What is the TCP/IP model?</h3>
${def('TCP/IP model','(Transmission Control Protocol / Internet Protocol) the standard protocol suite used for communication over the Internet. It is a simpler, practical version of the OSI model with four layers instead of seven. OSI is mainly theoretical; TCP/IP is used in real-world networking.')}
${fig('osivstcp')}
${src('Lecture 13')}
</section>
<section><h3>The four layers</h3>
<p><b>1. Application layer (top, closest to users)</b> — gives network services to applications so that browsers, e-mail clients and file-transfer apps can communicate. Functions: interface for users to use network services; supports web, e-mail, file transfer, remote login; handles data formatting, encryption and compression (merged with OSI's Presentation layer).</p>
${tbl(['Protocol','Use'],[['HTTP','Web browsing (opening websites)'],['HTTPS','Secure (encrypted) web browsing'],['FTP','Transfers files between computers'],['SMTP','Sends e-mails'],['IMAP / POP3','Retrieve e-mails from servers'],['DNS','Converts website names (google.com) into IP addresses']])}
<p><b>2. Transport layer</b> — reliable communication between devices by breaking data into segments, checking errors and managing retransmission. Functions: segmentation, flow control (prevents overwhelming the receiver), error handling, multiplexing (many applications at once).</p>
${tbl(['Protocol','Type','Use'],[['TCP','Reliable','Web browsing, e-mail, file transfer — where accuracy matters'],['UDP','Fast but unreliable','Video calls, gaming, streaming — where speed matters more than reliability']])}
<p><b>3. Internet layer</b> — logical addressing (IP addresses) and routing packets across different networks. Functions: assigns a unique IP address to each device, finds the best path, forwards packets between networks using routers.</p>
${tbl(['Protocol','Function'],[['IP','Assigns IP addresses and routes packets'],['ICMP','Network diagnostics (PING)'],['ARP','Converts IP addresses to MAC addresses'],['RIP, OSPF','Routing protocols — help routers find the best path']])}
<p><b>4. Network Access layer</b> — physically transmits data over the media (Ethernet cables, Wi-Fi, fibre). Functions: encapsulation (packets → frames), MAC addressing, error detection, defines the physical medium.</p>
${tbl(['Technology','Function'],[['Ethernet (IEEE 802.3)','Wired LANs'],['Wi-Fi (IEEE 802.11)','Wireless networks'],['Bluetooth','Short-range wireless'],['PPP','Direct connection between two devices']])}
</section>
<section><h3>Example: sending an e-mail with Gmail</h3>
<ol><li><b>Application layer</b> — Gmail formats the e-mail using SMTP; text and attachments become readable data.</li><li><b>Transport layer</b> — TCP breaks the e-mail into smaller packets, gives sequence numbers, and handles error detection and retransmission.</li><li><b>Internet layer</b> — the packets get source and destination IP addresses; IP finds the best path.</li><li><b>Network Access layer</b> — packets become electrical signals or radio waves and travel over Ethernet, Wi-Fi or fibre.</li></ol>
<p>The process is reversed at the receiver to rebuild the e-mail.</p>
</section>
<section><h3>OSI vs TCP/IP</h3>
${tbl(['TCP/IP layer','Corresponding OSI layers'],[['Application','Application, Presentation, Session (5–7)'],['Transport','Transport (4)'],['Internet','Network (3)'],['Network Access','Data Link and Physical (1–2)']])}
${tbl(['OSI model','TCP/IP model'],[['Open Systems Interconnection, developed by ISO','Transmission Control Protocol/Internet Protocol, developed by ARPANET'],['7 layers','4 layers'],['A guideline / reference model; generic protocol','Actual implementation; the standard protocols that built the Internet'],['Vertical approach','Horizontal approach'],['Session and Presentation are separate layers','Session and Presentation are inside the Application layer'],['Transport layer guarantees delivery of packets','Transport layer does not guarantee delivery (but TCP is still reliable)'],['Services, interfaces and protocols are not clearly defined for each layer','Clearly defined for each layer'],['Transport: only connection-oriented','Transport: both connection-oriented (TCP) and connectionless (UDP)'],['Network: both connectionless and connection-oriented','Network: connectionless only (IP)'],['Protocols are easy to replace','Protocols cannot be replaced easily']])}
<p><b>Lecture case (XylonTech):</b> file corruption → Transport layer problem (TCP should handle it; UDP would not). VoIP delay → TCP adds latency, so use UDP (Transport layer). "Connection timeout" → check the Network layer with ping, traceroute, Wireshark.</p>
${tip('Always draw the side-by-side mapping diagram. Write: TCP/IP Application = OSI 5+6+7; Network Access = OSI 1+2.')}
${src('Lecture 13')}
</section>`},

{id:'guided',unit:'Unit 2 · Physical layer',title:'Transmission media: guided (wired)',summary:'Twisted pair (UTP/STP), coaxial and optical fibre: construction, advantages, disadvantages, applications and comparison.',
body:`
<section><h3>What is transmission media?</h3>
${def('Transmission medium','the physical path between the transmitter and the receiver — the channel through which data is sent from one place to another, as electromagnetic signal waves. It sits below the physical layer.')}
<p><b>Guided (wired, bounded) media</b> use physical cables: twisted pair, coaxial, fibre optic. The signal is controlled and kept inside a fixed channel. <b>Unguided (wireless) media</b> use wireless signals: radio waves, microwaves, infrared.</p>
<p><b>Advantages of guided media (from the lecture):</b> low cost and easily available; flexible and lightweight; easy to set up; high transmission speed; secure; works within a limited area. <b>Disadvantages:</b> limited bandwidth (compared with fibre), open to interference and noise, maintenance and installation cost.</p>
${src('Lecture 2, Lecture 14')}
</section>
<section><h3>Twisted pair cable</h3>${fig('utp')}
<p>Made by twisting two separately insulated copper wires around each other; several such pairs are bundled in a protective sheath. The most widely used medium. Two types:</p>
<p><b>UTP (Unshielded Twisted Pair)</b> — two insulated copper wires twisted together with no physical shield; the twisting itself blocks interference. Used in telephone lines and office/home Ethernet (Cat5, Cat6). <i>Advantages:</i> low cost, high speed, easy to install, flexible and light. <i>Disadvantages:</i> open to external interference and crosstalk; limited to short distance because of attenuation; lower performance than STP; less secure.</p>
<p><b>STP (Shielded Twisted Pair)</b> — has a special jacket (copper braid or foil shield) to block external interference. Used in high-data-rate Ethernet and in voice and data channels of telephone lines. <i>Advantages:</i> higher speed than UTP, better performance, no crosstalk, good in high-EMI places (factories, power plants), more secure. <i>Disadvantages:</i> expensive, heavier and less flexible, hard to install and manufacture, needs grounding.</p>
${tbl(['Feature','STP','UTP'],[['Shield','Metallic shield around the wires','No shield — only twisting'],['Interference','Much better protection against EMI and crosstalk','More vulnerable to interference'],['Cost / install','Expensive, heavy, needs grounding','Cheap, light, easy'],['Applications','Gigabit/industrial Ethernet, factories, military','Office and home LANs (Cat5/Cat6), telephone wiring']])}
<p><b>Lecture case (smart city surveillance in a high-EMI area):</b> use STP because the shield blocks interference from power lines and radio signals and keeps the video stable; alternatives are fibre optic (immune to EMI, long distance) or 5G/Wi-Fi 6 wireless.</p>
</section>
<section><h3>Coaxial cable</h3>${fig('coax')}
<p>Has an outer plastic covering, an insulating layer (PVC or Teflon), and two conductors each with its own insulated cover. Carries information in two modes: <b>baseband</b> (the whole cable bandwidth for one signal) and <b>broadband</b> (bandwidth split into separate ranges). Widely used for cable TV and analog television.</p>
${tbl(['Part','Material','Purpose'],[['Centre conductor','Copper (solid or stranded)','Carries the high-frequency signal'],['Dielectric insulator','PE, foam PE, Teflon or PVC','Separates the inner conductor from the shield; keeps spacing constant'],['Outer conductor (shield)','Aluminium foil, braided copper/aluminium','Blocks EMI; return path'],['Jacket','PVC, PE','Protects from damage, UV, chemicals, fire']])}
<ul><li><b>Advantages:</b> easy to install and extend; high bandwidth; less expensive; less noise than UTP.</li><li><b>Disadvantages:</b> one cable failure can disturb the whole network; bulky; expensive over long distances; does not support very high speeds.</li><li><b>Applications:</b> cable TV, broadband Internet (older DOCSIS), CCTV, short-distance networking.</li></ul>
</section>
<section><h3>Optical fibre cable</h3>${fig('fiber')}
<p>Glass-based cable that transmits light signals using <b>total internal reflection</b>: the core is surrounded by a less dense glass/plastic covering (cladding), so the light stays inside the core. Carries huge data with high bandwidth and almost no electromagnetic interference. The cable can be unidirectional or bidirectional (WDM supports both modes).</p>
${tbl(['Part','Material','Purpose'],[['Core','Pure/doped silica','Carries light by total internal reflection'],['Cladding','Silica with lower refractive index','Reflects light back into the core'],['Coating / buffer','Acrylate polymer, PVC/nylon','Protects the fibre from bends and scratches'],['Strength members','Kevlar (aramid), steel wire','Pulling strength'],['Outer jacket','PE (outdoor), PVC (indoor)','Protects from UV, chemicals, fire, wear']])}
<ul><li><b>Advantages:</b> very high bandwidth; lightweight; negligible attenuation; fastest data transmission; immune to EMI; long distance without signal loss; more secure (does not radiate).</li><li><b>Disadvantages:</b> very costly; hard to install and maintain (special equipment); fragile; unidirectional — a second fibre is needed for two-way communication.</li><li><b>Applications:</b> high-speed Internet (FTTH), telecom and data centres, undersea and long-distance links, medical imaging, military.</li></ul>
</section>
<section><h3>Comparison</h3>${fig('mediacompare')}
${tbl(['Parameter','Twisted pair','Coaxial','Optical fibre'],[['Data rate / bandwidth','Lower (10 Mbps–10 Gbps short runs)','Higher than twisted pair (100s Mbps)','Highest (Gbps–Tbps)'],['Attenuation / distance','High; about 100 m','Moderate; about 500 m','Negligible; many km'],['Cost','Lowest','Moderate','Highest'],['Noise (EMI)','High (crosstalk, interference)','Low (shielded)','None (immune)'],['Installation','Easy','Moderate, bulky','Difficult, special tools']])}
${src('Lecture 2, Lecture 14')}
</section>`},

{id:'unguided',unit:'Unit 2 · Physical layer',title:'Unguided media & transmission impairments',summary:'Radio waves, microwaves and infrared; guided vs unguided comparison; attenuation, distortion and noise.',
body:`
<section><h3>Unguided (wireless) media</h3>
${def('Unguided media','transmission media that use wireless signals (no physical cable) to carry data: radio waves, microwaves, infrared.')}
${fig('unguided')}
<p><b>Radio waves</b> — used in Wi-Fi, Bluetooth, AM/FM radio, TV, GPS. <i>Advantages:</i> long range, pass through walls. <i>Disadvantages:</i> open to interference.</p>
<p><b>Microwaves</b> — used in satellite communication and mobile (cellular) networks, radar, higher-frequency Wi-Fi. <i>Advantages:</i> high bandwidth, long-distance transmission. <i>Disadvantages:</i> need line of sight, affected by weather (rain, water vapour).</p>
<p><b>Infrared</b> — used in remote controls and short-range communication, thermal imaging, night vision. <i>Advantages:</i> secure, no interference. <i>Disadvantages:</i> short range, needs line of sight, cannot pass through walls.</p>
${tbl(['Feature','Radio waves','Microwaves','Infrared'],[['Frequency range','3 kHz – 300 GHz','300 MHz – 300 GHz','300 GHz – 430 THz'],['Wavelength','1 mm – 100 km (longest)','1 mm – 1 m','700 nm – 1 mm (shortest)'],['Penetration','High — passes through walls and buildings','Medium — some obstacles, affected by rain','Low — cannot pass solid objects'],['Interference','Prone to interference from other signals','Affected by water vapour and obstacles','Blocked by walls; needs direct line of sight'],['Distance','Very long (thousands of km)','Medium (up to a few hundred km)','Short (a few metres)'],['Usage','Radio/TV broadcasting, Wi-Fi, GPS','Mobile networks, satellite, radar','Remote controls, night vision, thermal imaging']])}
<p><b>Lecture case (floating city):</b> for speed and reliability, Team Beta (microwaves + satellites) wins despite the cost; Team Alpha (radio + infrared) is cheaper but struggles with long distance and high speed.</p>
${src('Lecture 14')}
</section>
<section><h3>Guided vs unguided media</h3>
${tbl(['Aspect','Guided media','Unguided media'],[['Transmission path','Physical cables / wires','Wireless signals'],['Bandwidth','High (especially fibre)','Moderate to high'],['Range','Limited by cable length','Long range (e.g. radio waves)'],['Cost','Moderate to high','Low to moderate'],['Interference','Low (except twisted pair)','Susceptible to interference'],['Applications','Ethernet in offices (twisted pair), cable TV (coax), Internet backbone (fibre)','Wi-Fi at home/office (radio), satellite TV and GPS (microwave), remote controls (infrared)']])}
</section>
<section><h3>Transmission impairments</h3>${fig('impair')}
<ul><li><b>Attenuation</b> — loss of energy: the strength of the signal decreases as the distance increases.</li><li><b>Distortion</b> — a change in the shape of the signal. In a signal made of different frequencies, each frequency travels at its own speed, so they arrive at different times (delay distortion).</li><li><b>Noise</b> — unwanted signals that get added to the data while it travels over the medium.</li></ul>
${src('Lecture 14')}
</section>`},

{id:'csma',unit:'Unit 2 · MAC',title:'Multiple access & the CSMA family',summary:'Why MAC is needed, the three access categories, CSMA persistence methods, CSMA/CD with backoff, CSMA/CA with RTS/CTS, and a delay numerical.',
body:`
<section><h3>Why do we need CSMA?</h3>
<p>Many devices may share the same communication medium. If two devices transmit at the same time their signals interfere — a <b>collision</b>. CSMA reduces collisions by making a station sense the medium before transmitting.</p>
${fig('maccat')}
<p><b>Three categories of multiple-access protocols:</b> <b>random access</b> (ALOHA, CSMA, CSMA/CD, CSMA/CA — any station sends when it wants), <b>controlled access</b> (reservation, polling, token passing — a station sends only when allowed), <b>channelization</b> (FDMA, TDMA, CDMA — the bandwidth is divided by frequency, time or code).</p>
${src('Lecture 15 (Forouzan figure 12.2)')}
</section>
<section><h3>Steps in CSMA (Carrier Sense Multiple Access)</h3>
<ol><li><b>Carrier sensing</b> — the station listens to the channel to check if it is idle or busy.</li><li><b>Wait if busy</b> — if busy, wait until it becomes idle.</li><li><b>Transmit if idle</b> — if idle, transmit the data.</li><li><b>Collision handling</b> — if two stations transmit together a collision may occur; handled differently by each CSMA variant (abort, backoff, retry).</li><li><b>Backoff and retransmission</b> — wait a random backoff time, then start again from carrier sensing.</li></ol>
<p><b>Can a collision still happen after sensing? Yes.</b> Signals take time to travel through the medium, so two distant stations may both sense an idle channel and begin transmitting almost at the same time; their signals then collide.</p>
</section>
<section><h3>Persistence methods</h3>${fig('persist')}
<p><b>1-persistent CSMA</b> — channel busy: keep sensing until free, then grab it. Channel idle: transmit with probability 1. Collision: wait a random time and try again. Used by early wired Ethernet (IEEE 802.3) with CSMA/CD: fast transmission in LANs with few devices.</p>
<p><b>Non-persistent CSMA</b> — channel busy: do not keep sensing; wait a random time and try again. Channel idle: transmit. Collision: wait a random time and try again. <i>Advantages:</i> fewer collisions (random wait), better under heavy traffic. <i>Disadvantages:</i> higher delay, inefficient in light traffic. Used in wireless networks with many devices.</p>
<p><b>p-persistent CSMA</b> — channel busy: keep sensing. Channel idle: transmit with probability p, otherwise wait for the next slot (probability 1−p). Collision: wait random time and try again. <i>Advantages:</i> balances efficiency and collision avoidance; more efficient than 1-persistent in light traffic. <i>Disadvantages:</i> collisions still possible if several stations choose to send; less predictable. Used in wireless LANs and IoT networks.</p>
${tbl(['Feature','1-persistent','Non-persistent','p-persistent'],[['Channel busy','Senses continuously','Waits random time, then senses again','Keeps sensing'],['Channel becomes idle','Transmits immediately','Transmits when sensed idle','Transmits with probability p'],['If it does not transmit','—','—','Waits next slot (1−p)'],['Collision probability','Higher','Lower','Controlled by p'],['Delay','Low at light load','May be higher','Balanced'],['Aggressiveness','Highest','Lowest','Adjustable']])}
<p><b>Lecture case:</b> X (1-persistent) is the most aggressive, Z (p = 0.3) moderate, Y (non-persistent) least aggressive. With 100+ devices, p-persistent scales best because the probability p reduces simultaneous transmissions.</p>
</section>
<section><h3>CSMA/CD — Collision Detection (Ethernet)</h3>${fig('csmacd')}
<p><b>Why collision detection?</b> On a shared wired medium a station can keep monitoring the medium while it transmits. If what it hears differs from what it sends, a collision is detected; the station stops, and retries after a random delay.</p>
${tbl(['Step','Description'],[['1 Carrier sensing','Listen to check if the channel is idle'],['2 Start transmission','If idle, start transmitting'],['3 Collision detection','While transmitting, keep monitoring the channel'],['4 Stop on collision','If a collision is detected, stop immediately'],['5 Jam signal','Send a jam signal so all stations know about the collision'],['6 Backoff','Wait a random backoff time before resending'],['7 Retry','Repeat from step 1']])}
<p><b>Binary exponential backoff:</b> after a collision, stations should not retransmit immediately or they may collide again. Ethernet chooses a random waiting time, and after each repeated collision the range of possible waiting times becomes larger. This reduces the chance that the same stations collide again and again.</p>
</section>
<section><h3>CSMA/CA — Collision Avoidance (Wi-Fi)</h3>${fig('csmaca')}
<p><b>Why can't wireless simply detect collisions?</b> A transmitting station's own signal is much stronger than a weak incoming signal, so listening while transmitting does not work. Wireless also has the <b>hidden-terminal problem</b>. So IEEE 802.11 avoids collisions instead of detecting them.</p>
<ol><li><b>Carrier sensing before transmission</b> — listen to check idle or busy.</li><li><b>Collision avoidance with waiting</b> — if idle, wait a random backoff time before sending, so stations that also want to send do not start together.</li><li><b>RTS/CTS (optional, Wi-Fi)</b> — the sender sends RTS (Request To Send) and waits for CTS (Clear To Send) from the receiver, which reserves the medium.</li><li><b>Data transmission</b> — after CTS (or after the backoff) send the data.</li><li><b>Acknowledgment</b> — the receiver sends an ACK if the data arrived correctly. No ACK ⇒ assume a collision and retry after another random backoff.</li></ol>
<p><b>Wi-Fi sequence:</b> sense → if busy wait → when idle wait the inter-frame period → random backoff → transmit when the counter reaches zero → receiver ACKs → no ACK means retry.</p>
${fig('hidden')}
${tbl(['Aspect','CSMA/CD','CSMA/CA'],[['Full form','Carrier Sense Multiple Access with Collision Detection','… with Collision Avoidance'],['Collision handling','Detects collisions during transmission','Avoids collisions before transmission'],['Used in','Wired networks (Ethernet)','Wireless networks (Wi-Fi)'],['Method','Listen → transmit → detect collision → backoff','Listen → wait (backoff) → RTS/CTS → transmit'],['Extra signals','Jam signal after collision','RTS/CTS to reserve the channel'],['Acknowledgment','Not always used','ACK is usually used'],['Efficiency','Higher in low-traffic wired networks','Better in wireless with interference']])}
<p><b>Why modern switched full-duplex Ethernet does not need CSMA/CD:</b> each device has its own point-to-point link to a switch port and sends and receives on separate wire pairs at the same time, so there is no shared medium and no collisions.</p>
</section>
<section><h3>Lecture numerical: total delay</h3>
<p>Frame of 10 million bits, link with 15 routers (queuing 2 µs + processing 1 µs each), length 3000 km, speed in link 2×10⁸ m/s, bandwidth 6 Mbps.</p>
<ul><li>Transmission delay = L/R = 10⁷ / (6×10⁶) = 1.667 s</li><li>Propagation delay = d/v = 3×10⁶ / 2×10⁸ = 0.015 s = 15 ms</li><li>Queuing + processing = 15 × (2 + 1) µs = 45 µs</li><li><b>Total ≈ 1.667 + 0.015 + 0.000045 ≈ 1.682 s</b></li></ul>
${fig('delay')}
${src('Lecture 15')}
</section>`},

{id:'lantech',unit:'Unit 2 · MAC',title:'Ethernet, Token Ring, FDDI & Wireless LAN',summary:'Ethernet features, frame and evolution; FDDI dual ring and token passing; Token Ring; WLAN architecture, standards, CSMA/CA, security.',
body:`
<section><h3>Ethernet (IEEE 802.3)</h3>
${def('Ethernet','one of the most widely used networking technologies in LANs. It defines how devices on a network communicate and share data using a common protocol.')}
<ul><li><b>Standard:</b> IEEE 802.3.</li><li><b>Topology:</b> traditionally bus; now commonly star with switches.</li><li><b>Speeds:</b> Ethernet 10 Mbps → Fast Ethernet 100 Mbps → Gigabit Ethernet 1 Gbps → 10-Gigabit and beyond (up to 100 Gbps).</li><li><b>MAC:</b> uses CSMA/CD to manage transmission and avoid collisions on shared channels.</li></ul>
<p><b>How Ethernet works:</b> a device checks if the channel is free; if free it sends the data as an Ethernet frame; if two devices send at the same time there is a collision; both detect it, stop, wait a random time and retry (CSMA/CD).</p>
${fig('framing')}
${tbl(['Advantages','Disadvantages'],[['High speed (up to 100 Gbps)','Limited mobility — needs cables'],['Reliable and stable — less interference than Wi-Fi','Cabling complexity in large setups'],['Cost-effective hardware and maintenance','Hard to expand over long distances (cable ~100 m)'],['Secure — harder to intercept than wireless','Takes longer to install than wireless'],['Widely compatible, standardised','Not ideal for phones/tablets'],['Low latency — good for gaming, VoIP, streaming','Wires can get damaged']])}
<p><b>Lecture case (small office, 10 PCs):</b> 10 Mbps Ethernet technically works for browsing and e-mail but is slow by modern standards and 10 PCs sharing 10 Mbps will get congested; better: Fast Ethernet (100 Mbps) or Gigabit Ethernet (1 Gbps).</p>
<p><b>Lab with 30 PCs on a Gigabit switch:</b> star topology; no shared collision domain (each port is its own); CSMA/CD not needed on full-duplex links; the switch forwards by the destination MAC address.</p>
${fig('macaddr')}
${src('Lecture 16')}
</section>
<section><h3>FDDI — Fiber Distributed Data Interface</h3>${fig('fddi')}
<p>A high-speed LAN technology based on fibre-optic communication. It uses <b>token passing</b> to control access to the shared ring and a <b>dual-ring</b> architecture for reliability. Historically used for campus and enterprise backbones. <b>Key idea: fibre + ring topology + token passing + redundancy.</b></p>
<p><b>Why FDDI was needed:</b> higher speed and longer distance (fibre), reliability — one cable failure should not stop the network (dual ring), and organised access for many stations (token).</p>
<p><b>Architecture:</b> the <b>primary ring</b> normally carries data; the <b>secondary ring</b> is an alternate/backup path. Components: fibre links, network stations, token, primary ring, secondary ring, frames. Think: main road = primary ring, alternate road = secondary ring.</p>
<p><b>Data transfer step by step:</b> 1 the token circulates → 2 a station with data waits for the token → 3 it captures the token (permission to transmit) → 4 the frame travels toward the destination → 5 the destination identifies and copies the frame → 6 the token is passed on so other stations get a turn. The token works like one classroom microphone: only the holder speaks.</p>
<p><b>Fault tolerance:</b> redundancy = having an extra path; fault tolerance = continuing to work despite a failure. With the dual ring, if a link fails the network can reconfigure (wrap) around the fault in many cases.</p>
<ul><li><b>Features:</b> fibre, token passing, dual ring, controlled access, redundancy, high speed for its time (100 Mbps).</li><li><b>Advantages:</b> high bandwidth, longer fibre links, less EMI, reliable backbone, organised access, alternate path.</li><li><b>Limitations:</b> higher cost and complexity; token design less common today; modern Ethernet is faster; mostly a legacy technology.</li><li><b>Applications:</b> campus backbone (library ↔ labs ↔ admin ↔ hostels ↔ data centre), enterprise backbone, high-reliability LANs.</li></ul>
${src('Lecture 17')}
</section>
<section><h3>Token Ring (IEEE 802.5)</h3>${fig('tokenring')}
${beyond('the Token Ring lecture (18) is not in your folder; the FDDI PPT only compares it. Simple notes:')}
<p>IBM's LAN at 4 or 16 Mbps. Stations are cabled as a star to a central MAU but logically form a ring. A free token circulates; a station that wants to send captures it, sends its frame, the destination copies it, the sender removes it and releases a new token. No collisions, every station gets a turn (deterministic). Now obsolete.</p>
${tbl(['Feature','FDDI','Token Ring','Ethernet'],[['Transmission','Fibre optic (typical)','Twisted pair / legacy media','Copper / fibre'],['Access method','Token passing','Token passing','CSMA/CD historically; switched Ethernet today'],['Topology','Dual ring','Logical ring','Star / switched'],['Typical role','High-speed backbone (historical)','LAN (historical)','Modern LAN / backbone']])}
<p>Memory trick from the lecture: FDDI = Fibre + Token + Dual Ring; Token Ring = Token + Ring; Ethernet = today's common LAN.</p>
${fig('ethernetcmp')}
</section>
<section><h3>Wireless LAN (IEEE 802.11, Wi-Fi)</h3>
${def('WLAN','a Local Area Network that uses radio-frequency communication to connect devices without data cables. Purpose: local connectivity, resource sharing and Internet access with user mobility. Wi-Fi is the technology based on the IEEE 802.11 family.')}
${fig('wlan')}
<ul><li><b>Architecture:</b> <b>Station (STA)</b> — a wireless endpoint (laptop, phone, printer). <b>Access Point (AP)</b> — provides wireless connectivity and forwards traffic to the wired network; an AP is not the same as a router (home Wi-Fi routers combine both). <b>Distribution System (DS)</b> — connects APs for larger deployments.</li><li><b>Modes:</b> <b>Infrastructure mode</b> — AP required; stations talk through the AP; centralised; multiple APs form an ESS; used in homes, colleges, offices. <b>Ad hoc mode</b> — no AP; stations talk directly, peer-to-peer; temporary and small; less control.</li><li><b>BSS</b> — Basic Service Set: stations with one AP (identified by BSSID). <b>IBSS</b> — Independent BSS for ad hoc (no AP). <b>ESS</b> — Extended Service Set: several BSSs connected through a DS, larger coverage and roaming.</li><li><b>IEEE 802.11</b> defines the WLAN MAC and PHY. Generations: 802.11b (2.4 GHz, 11 Mb/s), 802.11a (5 GHz, 54 Mb/s), 802.11g (2.4 GHz, 54 Mb/s), 802.11n = Wi-Fi 4 (MIMO), 802.11ac = Wi-Fi 5 (5 GHz, Gb/s class), 802.11ax = Wi-Fi 6/6E (OFDMA), 802.11be = Wi-Fi 7 (multi-link). Advertised PHY rate ≠ real throughput.</li><li><b>Bands:</b> 2.4 GHz — longer coverage, more crowded, lower capacity; 5 GHz — shorter range, less crowded, more channels; 6 GHz — newest, cleanest.</li><li><b>Wireless transmission:</b> digital data → modulation/coding → RF signal → antenna/medium → receiver. Impairments: attenuation, reflection, diffraction, interference. PHY: frequency and channel, modulation and coding (adaptive rate), MIMO (many antennas) and OFDMA (channel split into resource units).</li><li><b>MAC — CSMA/CA:</b> 1 sense, 2 wait if busy, 3 random backoff, 4 transmit, 5 ACK. Collision avoidance because a wireless station cannot detect collisions while transmitting. <b>Hidden node:</b> A and B both reach the AP but cannot hear each other → collisions at the AP → fixed by <b>RTS/CTS</b> (sender asks, AP answers, others defer for the announced duration; costs some overhead).</li><li><b>Security:</b> goals — authentication, confidentiality, integrity, access control. WEP (obsolete, insecure) → WPA/WPA2 (AES-CCMP) → WPA3 (newest). Best practice: strong passwords, firmware updates, prefer WPA3/WPA2, use 802.1X/EAP in enterprises.</li><li><b>Joining and roaming:</b> discover/select SSID → authenticate → associate with an AP → roam (re-associate with another AP in the ESS).</li><li><b>Performance factors:</b> signal strength, SNR, interference, airtime shared by many clients, channel width, retransmissions.</li></ul>
${tbl(['Advantages of WLAN','Limitations of WLAN'],[['Mobility — move while connected','Interference and congestion'],['Less cabling','Coverage varies with walls and distance'],['Flexible — easy to add or move devices','Shared medium — users compete for airtime'],['Scalable — add APs','Security risks if misconfigured'],['Convenient — many device types','Throughput changes with environment and load']])}
${tbl(['Feature','WLAN','Wired LAN'],[['Medium','Radio waves','Copper/fibre cable'],['Mobility','High','Low'],['Installation','Flexible, less cabling','Needs physical cabling'],['Interference','More susceptible','Generally less'],['Performance','Variable','Usually predictable'],['Security','Needs careful wireless configuration','Physical access adds protection'],['Typical use','Mobile users, classrooms, hotspots','Servers, fixed desktops, backbone links']])}
${tbl(['Feature','Wi-Fi','Bluetooth','Zigbee / 802.15.4'],[['Purpose','Local networking / Internet','Personal peripherals','Low-power sensing / automation'],['Range','Room/building','Short','Short to moderate'],['Data rate','High','Low to moderate','Low'],['Power','Moderate','Low','Very low'],['Network','WLAN','WPAN','Low-power mesh/star'],['Examples','Laptop, phone, AP','Headset, keyboard, mouse','Sensors, smart lighting']])}
${src('Lecture 19')}
</section>`},

{id:'dll',unit:'Unit 2 · Data link layer',title:'Data link layer: functions & framing',summary:'The five DLL functions, the LLC/MAC sublayers, and framing by character count, byte stuffing and bit stuffing with solved problems.',
body:`
<section><h3>Functions of the Data Link Layer</h3>
${fig('dllsub')}
<p>The data link layer does: <b>(i) framing, (ii) error detection, (iii) error correction, (iv) flow control, (v) physical addressing</b>.</p>
<ul><li><b>Framing</b> — divides the data stream into smaller units called frames for transmission over the physical medium. Purpose: helps error detection and synchronisation, and lets the receiver recognise the start and end of each frame.</li><li><b>Error detection and correction</b> — the DLL adds error-detection codes (parity, checksum, CRC) to each frame; the receiver recalculates and compares; if they differ, an error occurred. Correction can be by retransmission or by codes like Hamming code.</li><li><b>Flow control</b> — stops a fast sender from overwhelming a slow receiver.</li><li><b>Physical addressing</b> — adds MAC (hardware) addresses of sender and receiver to the frame.</li><li><b>Medium access control</b> — decides who may use a shared link (CSMA/CD, CSMA/CA, token passing) — done by the MAC sublayer.</li></ul>
<p>The DLL is divided into two sublayers (Forouzan fig. 12.1): <b>LLC</b> (Logical Link Control — flow and error control, interface to the network layer) and <b>MAC</b> (Medium Access Control — addressing and access to the shared medium).</p>
<p><b>Lecture case (data corruption on a LAN):</b> the DLL function responsible is <b>error control</b>; checksum/CRC detect the errors (CRC is more robust and common at the DLL); to improve correction use Forward Error Correction (FEC) such as Hamming code or Reed-Solomon.</p>
${src('Lecture 20')}
</section>
<section><h3>Framing methods</h3>
<p><b>1. Character count</b> — the first byte of the frame gives the total number of characters in the frame (including the count byte). Example: frame ABC → transmitted as [4 A B C]; the receiver reads 4 and takes the next 3 characters. <i>Drawback:</i> if the count byte is corrupted, the receiver loses track of where the frame ends — frame misalignment.</p>
<p><b>2. Byte stuffing</b> — a special character (FLAG) marks the start and end of a frame. If FLAG (or the escape byte ESC) appears inside the data, an extra ESC byte is inserted before it, so the receiver knows it is data and not a delimiter. Example: data A B FLAG C → stuffed A B ESC FLAG C. Lecture problem: data A FLAG B ESC C → [A ESC FLAG B ESC ESC C]. Used in PPP, SLIP.</p>
<p><b>3. Bit stuffing</b> — a special bit pattern (01111110 in HDLC) frames the data. Whenever the sender sees five consecutive 1s in the data it inserts a 0 after them, so the flag pattern never appears inside the data. The receiver removes the 0 after every five 1s. Example: data 01111110 → stuffed 011111010. Used in HDLC, SDLC.</p>
${fig('bitstuff')}
<p><b>Lecture problem:</b> flag 01111110, data <code>01111110 1101111110110</code> → after stuffing (0 inserted after each five 1s) the frame is <code>01111110 | stuffed data | 01111110</code>. Scan left to right, count 1s, after five 1s write a 0 at once.</p>
${tbl(['Feature','Character count','Byte stuffing','Bit stuffing'],[['Framing method','Count of characters in first byte','Special byte (FLAG) marks start/end','Special bit pattern (01111110) as delimiter'],['Control character','Count (number)','FLAG and ESC','Bit pattern'],['Stuffing trigger','Not applicable','FLAG or ESC in data','Five consecutive 1s'],['Stuffing action','Not required','Insert ESC before FLAG/ESC','Insert 0 after five 1s'],['Unstuffing','Not required','Remove ESC at receiver','Remove stuffed 0 at receiver'],['Pros','Simple','Easy frame boundaries','Works for bit-oriented protocols'],['Cons','Corrupted count loses sync','Frame grows if many special bytes','Small overhead from inserted bits'],['Used in','Early protocols','PPP, SLIP','HDLC, SDLC']])}
${tip('Bit-stuffing numericals: underline the inserted 0s and put the flag at both ends of your final answer.')}
${src('Lecture 20')}
</section>`},

{id:'errorctl',unit:'Unit 2 · Data link layer',title:'Error detection & correction',summary:'Types of errors, parity, two-dimensional parity, checksum, CRC and Hamming distance with the lecture’s solved problems.',
body:`
<section><h3>Errors</h3>
${def('Error detection','the process of identifying errors that occur during data transmission over a network. Causes: noise, signal attenuation, interference, hardware faults.')}
<ul><li><b>Single-bit error</b> — only one bit is changed.</li><li><b>Burst error</b> — two or more bits are changed in a sequence.</li></ul>
<p>To detect errors we add <b>redundancy bits</b> that carry extra information. Methods: simple parity check, two-dimensional parity check, checksum, cyclic redundancy check (CRC).</p>
${src('Lecture 20')}
</section>
<section><h3>Simple parity check</h3>${fig('parity')}
<p>One extra bit is added to the data: a 1 if the block has an odd number of 1s, a 0 if it has an even number, so that the total number of 1s is even — <b>even parity</b>. (Odd parity makes the total odd.) The receiver counts the 1s; if the parity is wrong, there is an error.</p>
<p><b>Lecture problems:</b> for even parity, data 1101011 (five 1s) needs parity bit <b>1</b>. In an 8-bit even-parity system, strings B 10110101 (five 1s) and C 10001111 (five 1s) have a parity error; A 11010010 (four) and D 11111111 (eight) are fine. A parity error means a bit was flipped during transmission.</p>
${tbl(['Advantages','Disadvantages'],[['Simple to understand and implement','Can only detect single-bit (odd) errors, not correct them'],['Minimal extra hardware','Fails to detect burst errors (an even number of bit errors)'],['Low overhead — one bit per data unit','Not suitable for high-reliability applications'],['Fast','Gives no idea where the error is']])}
</section>
<section><h3>Two-dimensional parity check</h3>${fig('twodparity')}
<p>Parity bits are calculated for each row (like simple parity) and also for each column; both are sent with the data. The receiver recomputes them and compares.</p>
<p><b>Lecture problem (4×4 block, even parity):</b> received row 3 is 1 1 0 0 with parity 1 — two 1s but parity says odd → row 3 fails; column 4 is 0 1 0 1 with parity 1 → column 4 fails. So the error is at (row 3, column 4): it was 0 and should be 1. The receiver flips that bit → corrected row 3 = 1 1 0 1.</p>
</section>
<section><h3>Checksum</h3>${fig('checksum')}
<p>The sender adds the data units using <b>1's complement arithmetic</b> (if there is a carry over, it is added to the sum), then complements the sum to get the checksum and sends it with the data. The receiver adds all the units including the checksum, complements the result, and if it is 0 there is no error.</p>
<p><b>Lecture example (four 8-bit frames):</b> 11001100 + 10101010 + 11110000 + 11000011 → sum complemented = checksum 11010011; the receiver's sum of everything is all 1s → complement 0 → no error.</p>
<p><b>Lecture problem:</b> data unit 10101001 00111001. Sender: 10101001 + 00111001 = 11100010 (sum) → checksum = 00011101. Receiver: 10101001 + 00111001 + 00011101 = 11111111 → complement 00000000 → no error.</p>
</section>
<section><h3>Cyclic Redundancy Check (CRC)</h3>${fig('crc')}
<p>Given a dataword of n bits and a divisor (key) of k bits:</p>
<ol><li>Append (k−1) zeros to the data.</li><li>Do modulo-2 division (XOR, no carries).</li><li>The remainder is the CRC (it must be k−1 bits).</li><li>Codeword = data + CRC; length = n + k − 1 bits.</li></ol>
<p><b>Lecture example:</b> data 100100, key 1101 (generator polynomial x³ + x² + 1). Append 000 → 100100000 ÷ 1101 → remainder <b>001</b>, so the codeword sent is <b>100100001</b>. Receiver divides 100100001 by 1101 → remainder 000 → no error. If 100000001 is received instead, the remainder is not zero → error.</p>
<p><b>Lecture problem:</b> message 1001101, generator x³ + x² + 1 = 1101 → CRC = 100, frame = 1001101100; dividing the received 1001101100 by 1101 gives remainder 000 → no error.</p>
<p><b>Important:</b> the length of the CRC always equals the degree of the generator polynomial. CRC-12 → 12-bit checksum; a 1000-bit message + CRC-12 = 1012 bits transmitted.</p>
</section>
<section><h3>Hamming distance</h3>
${def('Hamming distance','the number of positions at which two binary strings of equal length differ. It tells how many bits must change to turn one string into the other, which helps in detecting and correcting errors.')}
<p><b>Example:</b> sent 10110010, received 10010011 → XOR = 00100001 → differences at positions 3 and 8 → Hamming distance = <b>2</b>.</p>
${tbl(['Codeword 1','Codeword 2','Different positions','Hamming distance'],[['11001','10011','2 and 4 (XOR 01010)','2 (the slide says 3 — recount yourself: 1<u>1</u>0<u>0</u>1 vs 1<u>0</u>0<u>1</u>1)'],['0110','1110','1','1'],['101010','111111','2, 4, 6','3'],['00000000','11111111','all 8','8'],['1100','1100','—','0']])}
<p><b>Why it matters:</b> if the minimum distance between valid codewords is d, the code can detect up to d−1 errors and correct up to (d−1)/2 errors. Hamming code (an FEC method) uses this to correct single-bit errors.</p>
${src('Lecture 20')}
</section>`},

{id:'flowctl',unit:'Unit 2 · Data link layer',title:'Flow control & congestion control',summary:'Stop-and-Wait and Sliding Window, ARQ types, and the difference between flow control and congestion control.',
body:`
${beyond('flow control is named as a DLL function in Lecture 20 but not explained in any PPT. These notes use the standard textbook (Forouzan) in simple words, because Assignment Q11 and Q14 ask for them.')}
<section><h3>What is flow control?</h3>
${def('Flow control','a set of rules that tells the sender how much data it may send before it must wait for an acknowledgement (ACK) from the receiver, so that a fast sender does not overwhelm a slow receiver whose buffer is limited.')}
</section>
<section><h3>Stop-and-Wait</h3>${fig('stopwait')}
<p>The sender sends ONE frame and waits for an ACK before sending the next. A timer is started; if no ACK arrives before it expires, the frame is sent again. Sequence numbers 0 and 1 let the receiver throw away duplicates.</p>
<ul><li><b>Good:</b> very simple, needs little buffer.</li><li><b>Bad:</b> the link stays idle during every round trip, so it is very slow on long or fast links. Efficiency = 1/(1 + 2a), where a = propagation time ÷ transmission time.</li></ul>
</section>
<section><h3>Sliding window</h3>${fig('slidingwindow')}
<p>The sender may send several frames (up to the window size W) before it needs an ACK. Frames carry sequence numbers; ACKs can cover several frames and can be piggybacked on data going the other way. When ACKs arrive the window slides forward.</p>
<ul><li><b>Good:</b> keeps the link busy; much higher throughput. Efficiency = W/(1 + 2a).</li><li><b>Bad:</b> more complex, needs buffers for W frames.</li></ul>
${tbl(['Basis','Stop-and-Wait','Sliding window'],[['Frames in flight','1','Up to W'],['Sequence numbers','0 / 1','0 … 2ᵐ−1'],['ACK','One per frame','Cumulative, can be piggybacked'],['Link use','Low','High'],['Buffer','Minimal','W frames'],['Complexity','Simple','Complex']])}
<p><b>ARQ (error control by retransmission):</b> Stop-and-Wait ARQ (resend the one frame on timeout), Go-Back-N ARQ (on a lost frame, resend it and all frames after it; receiver discards out-of-order frames), Selective Repeat ARQ (resend only the lost frame; receiver buffers the rest).</p>
${fig('arq')}
</section>
<section><h3>Flow control vs congestion control</h3>${fig('flowcong')}
${tbl(['Basis','Flow control','Congestion control'],[['Problem','The receiver cannot keep up','The network (routers, links) is overloaded'],['Scope','Between one sender and one receiver','The whole network, all senders'],['Who controls','The receiver (window, ACKs)','The network signals (packet loss, delay) and the sender slows down'],['Mechanisms','Stop-and-wait, sliding window, TCP receiver window','TCP slow start, congestion window, traffic shaping, choke packets'],['Example','A PC sending to a slow printer','Thousands of users through one router in the evening']])}
<p><b>How a fast sender causes congestion even when the receiver is ready:</b> flow control checks only the receiver's buffer. If the receiver says "I have space", the sender pushes data at full speed. But the path goes through routers and links that may be slower (a 1 Gbps LAN feeding a 100 Mbps WAN link, or a router shared by many users). Packets arrive at that router faster than it can forward them, its queue fills, delay grows and packets are dropped; the dropped packets are resent, adding even more traffic. So the sender must also obey a congestion window (TCP sends at most min(receiver window, congestion window)) and slow down when it sees loss or delay.</p>
</section>`},

{id:'switching',unit:'Unit 2 · Data link layer',title:'Switching: circuit, packet & message',summary:'How each switching technique works, their comparison, datagram vs virtual circuit, connection-oriented vs connectionless.',
body:`
${beyond('the switching lecture was announced as "next lecture" in Lecture 20 but is not in your folder. Simple notes from the textbook (Forouzan), needed for Assignment Q13 and Q15.')}
<section><h3>What is switching?</h3>
${def('Switching','a way of moving data through a network of connected switches (intermediate nodes) so that every pair of devices does not need its own direct link.')}
${fig('switching')}
</section>
<section><h3>Circuit switching</h3>
<p>A dedicated path is set up between the two stations BEFORE data is sent and stays reserved until the call ends. <b>Three phases:</b> (1) set-up — the path is reserved link by link; (2) data transfer — data flows continuously with no addresses needed; (3) teardown — the path is released. Example: telephone network.</p>
<ul><li><b>Good:</b> guaranteed bandwidth, fixed delay, data in order, good for voice.</li><li><b>Bad:</b> set-up delay; the reserved capacity is wasted when nobody is talking; if no circuit is free the call is blocked; inefficient for bursty computer data.</li></ul>
</section>
<section><h3>Message switching</h3>
<p>No path is reserved. The WHOLE message, with its destination address, is sent to the first switch, which stores it, waits for a free link and forwards it to the next switch (store-and-forward), and so on. Example: telegraph.</p>
<ul><li><b>Good:</b> links are shared, no blocking, no set-up.</li><li><b>Bad:</b> every switch needs a lot of storage, delays are long (the whole message must arrive before it is forwarded), not usable for real-time traffic.</li></ul>
</section>
<section><h3>Packet switching</h3>
<p>The message is cut into small <b>packets</b>, each with a header (addresses, sequence number). Packets are stored and forwarded one by one; many can travel at the same time on different links, and they are put back together at the destination. Example: the Internet.</p>
${fig('vcdatagram')}
<ul><li><b>Datagram approach (connectionless):</b> each packet is routed on its own using the full address; packets may take different paths and arrive out of order; no set-up; if a link fails, later packets go another way. Used by IP.</li><li><b>Virtual-circuit approach (connection-oriented):</b> a path is chosen first and every packet carries a short circuit number and follows that path in order; resources may be reserved. Used by ATM, Frame Relay.</li><li><b>Good:</b> efficient use of links, low delay, robust. <b>Bad:</b> header overhead, variable delay, packets can be lost or reordered.</li></ul>
${tbl(['Basis','Circuit switching','Message switching','Packet switching'],[['Dedicated path','Yes','No','No'],['Set-up phase','Yes','No','No (datagram) / Yes (VC)'],['Store-and-forward','No','Whole message','Packets'],['Address in data','Not needed','Each message','Each packet'],['Delay','Set-up, then constant','Very high','Low but variable'],['Bandwidth use','Wasted when idle','Shared','Shared — best'],['Storage at nodes','None','Large','Small buffers'],['Real-time','Excellent','Poor','Good'],['Example','Telephone','Telegraph','Internet']])}
</section>
<section><h3>Connection-oriented vs connectionless; datagram vs virtual circuit</h3>
${tbl(['Basis','Connection-oriented (TCP, telephone)','Connectionless (UDP, IP, post)'],[['Set-up','Connection made before data, released after','None; each unit sent on its own'],['Order','In sequence','May be out of order'],['Reliability','ACKs, retransmission, flow control','Best effort, no guarantee'],['Overhead','Set-up cost, then efficient','Low, good for short messages']])}
${tbl(['Basis','Virtual-circuit network','Datagram network'],[['Route','Chosen once at set-up; all packets follow it','Each packet routed independently'],['Address in packet','Short circuit number','Full source and destination address'],['Switch state','One entry per circuit','None per flow'],['Order','Guaranteed','Not guaranteed'],['On failure','Circuit lost; must be set up again','Packets rerouted automatically'],['Examples','ATM, Frame Relay, MPLS','IP, Ethernet']])}
<p><b>Router operation (from Lecture 10):</b> a Layer-3 device that reads the destination IP address, looks in its routing table and forwards the packet on the best path between different networks; it is essential whenever a LAN must reach the Internet or another network.</p>
</section>`},

{id:'design',unit:'Unit 2 · Applications',title:'Network design scenarios (Assignment Q16–Q18)',summary:'A segmented network for an organisation, wired vs wireless office, and secure remote access over Wi-Fi — built from the PPT concepts.',
body:`
${beyond('these are design questions from the assignment, not PPT topics. The answers use the PPT concepts (devices, topologies, WLAN security, media) in a simple way.')}
<section><h3>Q16 — Segmented network for an organisation</h3>
<p><b>Problem with one flat network:</b> all PCs, servers, printers and wireless devices share one network, so every broadcast reaches everyone, one faulty device slows all, a visitor's laptop can reach the servers, and faults are hard to find.</p>
${fig('segmented')}
<p><b>Proposal:</b> a tree (star-bus) design — Internet → firewall/router → core switch → one switch per group, with separate <b>VLANs</b> (logical segments) for servers, staff PCs, printers and guest Wi-Fi. The router/firewall decides which segment may talk to which (staff → servers and printers; guests → Internet only).</p>
<ul><li><b>Benefits:</b> better performance (smaller broadcast domains), security (segments isolated, rules at the firewall), fault containment (a problem stays in one segment), easier management, easy to grow (add a switch or VLAN), sensitive data kept apart.</li></ul>
</section>
<section><h3>Q17 — Fully wireless vs wired-plus-wireless office</h3>
${tbl(['Criterion','Completely wireless','Wired + wireless'],[['Cost','No cabling, but many access points; cheap to start','Cabling cost at the start, but cheap long-lasting switches'],['Speed','Shared airtime (CSMA/CA), speed varies with distance and users','Dedicated full-duplex 1 Gbps per port, steady'],['Security','Radio leaks outside; needs WPA3; rogue APs possible','Physical access needed; servers never on air; Wi-Fi in its own segment'],['Reliability','Interference, dead zones, congestion','Very stable; wireless only as an extra'],['Ease of use','Easiest for mobile users and changes','Fixed devices need a port; mobile users still get Wi-Fi']])}
${fig('officenet')}
<p><b>Recommendation:</b> wired Gigabit Ethernet for desktops, servers and printers (speed, security, reliability — Lecture 16 advantages of Ethernet) plus Wi-Fi access points with WPA3 for laptops and phones (mobility — Lecture 19 advantages of WLAN). The access points themselves connect through the wired LAN anyway.</p>
</section>
<section><h3>Q18 — Secure remote access to an internal web app over Wi-Fi</h3>${fig('vpn')}
<ol><li><b>Secure Wi-Fi link:</b> the laptop joins Wi-Fi using WPA2/WPA3 with a strong password (Lecture 19 security best practice); open hotspots are treated as unsafe.</li><li><b>Safe laptop:</b> company-managed, updated, antivirus, disk encryption.</li><li><b>VPN tunnel:</b> a VPN client makes an encrypted tunnel across the Internet to the company's VPN gateway/firewall, so nobody on the Wi-Fi or Internet can read or change the data. Login needs username + password + MFA code (and a device certificate).</li><li><b>Access control:</b> the firewall allows the VPN user to reach only the web application (HTTPS, port 443), nothing else; traffic is logged.</li><li><b>Application security:</b> the web app uses HTTPS (encryption at the presentation layer — the "safe" from Lecture 11) with login and session time-outs.</li><li><b>Reliability:</b> two VPN gateways and automatic reconnection.</li></ol>
<p>This gives confidentiality (encryption), integrity, authentication (MFA) and availability.</p>
</section>`},
];

// ---------- QUESTION BANK: teacher's assignment Q1–Q18 (answers in simple language from the PPTs) ----------
const QUESTIONS=[];
function Q(o){QUESTIONS.push(o);}

const END=`<div class="end">— end of answer —</div>`;
