<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body style="margin:0">
<title>CN MTE Prep</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a sticky top nav of study modes, each mode a full-width panel; notes use a left topic rail that collapses to a chip row on phones. */
/* Layout: paper-white engineering sheet; sticky top nav; notes with a topic rail; isometric figures on bench cards. */
:root{
  --bg:#f4f4f0; --surface:#fbfbf9; --surface-2:#ebebe6; --fg:#262a28; --muted:#6c716e;
  --line:#d8d8d1; --accent:#c4563a; --accent-ink:#ffffff; --accent-soft:#f7e4dc;
  --warn:#b06a22; --warn-soft:#f8ecd9; --good:#3b7a5a; --good-soft:#e0efe6; --bad:#b23a2e; --bad-soft:#f6dfdb;
  --ink-2:#3f5468; --mark:#f7e9c6;
  --display:"Archivo","Segoe UI",system-ui,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:12px; --shadow:0 1px 2px rgba(40,40,30,.05),0 10px 30px -14px rgba(40,40,30,.22);
  --p0:#fcfcfa;--p1:#f1f1ed;--p2:#e7e7e2;--p3:#dadad4;--p4:#cfcfc8;--p5:#c3c3bb;--q0:#f3f3f0;--q1:#e8e8e3;--q2:#dededa;--q3:#d2d2cc;--q4:#c7c7c0;--q5:#bbbbb3;
  --a0:#f6ddd3;--a1:#efc9ba;--a2:#e6b4a2;--a3:#d99d88;--a4:#c98870;--a5:#b9765e;--ink:#8f918f;--ink2:#6b6e6c;--ink3:#3b3e3c;--ember:#c4563a;--halo:rgba(90,80,70,.14);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15181a; --surface:#1d2124; --surface-2:#272c30; --fg:#e4e6e2; --muted:#9aa09c; --line:#33393d;
  --accent:#e58a6b; --accent-ink:#1b120e; --accent-soft:#3b2820; --warn:#e3a35b; --warn-soft:#3a2b14; --good:#7cc79d; --good-soft:#183226; --bad:#f08a7c; --bad-soft:#3b1b17;
  --ink-2:#9cb6cf; --mark:#4a3d18; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --p0:#33393d;--p1:#2d3236;--p2:#282d31;--p3:#23282b;--p4:#1e2225;--p5:#1a1d20;--q0:#2b3034;--q1:#262b2f;--q2:#22272a;--q3:#1e2225;--q4:#1a1e21;--q5:#161a1c;
  --a0:#6a4336;--a1:#5f3b2f;--a2:#54342a;--a3:#482c23;--a4:#3d251d;--a5:#331f18;--ink:#767e83;--ink2:#a7afb3;--ink3:#e4e6e2;--ember:#e58a6b;--halo:rgba(0,0,0,.22); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15181a; --surface:#1d2124; --surface-2:#272c30; --fg:#e4e6e2; --muted:#9aa09c; --line:#33393d;
  --accent:#e58a6b; --accent-ink:#1b120e; --accent-soft:#3b2820; --warn:#e3a35b; --warn-soft:#3a2b14; --good:#7cc79d; --good-soft:#183226; --bad:#f08a7c; --bad-soft:#3b1b17;
  --ink-2:#9cb6cf; --mark:#4a3d18; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --p0:#33393d;--p1:#2d3236;--p2:#282d31;--p3:#23282b;--p4:#1e2225;--p5:#1a1d20;--q0:#2b3034;--q1:#262b2f;--q2:#22272a;--q3:#1e2225;--q4:#1a1e21;--q5:#161a1c;
  --a0:#6a4336;--a1:#5f3b2f;--a2:#54342a;--a3:#482c23;--a4:#3d251d;--a5:#331f18;--ink:#767e83;--ink2:#a7afb3;--ink3:#e4e6e2;--ember:#e58a6b;--halo:rgba(0,0,0,.22); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,3vw,2.3rem);font-weight:800}
h2{font-size:clamp(1.3rem,2.4vw,1.7rem);font-weight:700}
h3{font-size:1.12rem;font-weight:600}
h4{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.92em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:.7rem;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--fg);display:grid;place-items:center;transition:opacity .6s ease,visibility .6s;font-family:var(--display)}
#splash.gone{opacity:0;visibility:hidden}
#splash .typed{font-size:clamp(1.4rem,4vw,2.6rem);font-weight:700;letter-spacing:.02em;white-space:nowrap}
#splash .cursor{display:inline-block;width:.08em;height:1.05em;background:var(--accent);margin-left:.08em;vertical-align:-.12em;animation:blink 1s steps(2) infinite}
#splash .sub{margin-top:14px;color:var(--muted);font-family:var(--mono);font-size:.9rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;opacity:0;transition:opacity .5s}
#splash .sub.show{opacity:1}
#splash .skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));right:calc(24px + env(safe-area-inset-right,0px));background:transparent;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);padding:6px 14px;border-radius:999px}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){#splash .cursor{animation:none}}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.05rem;white-space:nowrap}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.brand small{font-family:var(--mono);font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-left:4px}
nav.modes{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.modes button{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 11px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:.86rem}
nav.modes button:hover{color:var(--fg);background:var(--surface-2)}
nav.modes button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.countdown{font-family:var(--mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.countdown b{color:var(--warn)}

main{padding-block:22px 40px}
.panel{display:none}
.panel.active{display:block}

/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:start}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card.tint{background:var(--accent-soft);border-color:transparent}
.stack{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.paper{border-left:4px solid var(--accent);padding-left:14px}
.paper table{width:100%;border-collapse:collapse;font-size:.95rem}
.paper td,.paper th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.paper th{font-family:var(--display);font-weight:600;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.tile{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);text-align:left;color:var(--fg)}
.tile:hover{border-color:var(--accent)}
.tile b{font-family:var(--display);font-size:1.02rem}
.tile span{color:var(--muted);font-size:.9rem}
.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.plan li{margin:4px 0}
ol,ul{margin:6px 0 6px 20px;padding:0}
li{margin:3px 0}

/* notes */
.notes{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px}
@media (max-width:860px){.notes{grid-template-columns:1fr}}
.rail{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 90px);overflow:auto}
@media (max-width:860px){.rail{position:static;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;max-height:none;padding-bottom:6px}}
.rail .unit{font-family:var(--display);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
@media (max-width:860px){.rail .unit{display:none}}
.rail button{text-align:left;background:transparent;border:0;border-radius:8px;padding:7px 10px;color:var(--fg);font-size:.92rem;display:flex;gap:8px;align-items:center;line-height:1.3}
@media (max-width:860px){.rail button{white-space:nowrap}}
.rail button:hover{background:var(--surface-2)}
.rail button.active{background:var(--accent-soft);color:var(--fg);font-weight:600}
.rail button .done{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.rail button .done.on{background:var(--good)}
article.topic{min-width:0}
article.topic .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
article.topic section{margin-top:22px}
article.topic section h3{margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
article.topic p{max-width:72ch;margin:6px 0}
article.topic li{max-width:72ch}
.def{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink-2);border-radius:8px;padding:10px 14px;margin:8px 0;max-width:80ch}
.def b{font-family:var(--display)}
.tip{background:var(--warn-soft);border-radius:8px;padding:10px 14px;margin:10px 0;max-width:80ch;border-left:4px solid var(--warn)}
.tip b{font-family:var(--display)}
.tip.beyond{background:var(--surface-2);border-left-color:var(--muted)}
.src{font-family:var(--mono);font-size:.68rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:8px}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:520px}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2);font-family:var(--display);font-weight:600;font-size:.82rem}
.tbl tr:last-child td{border-bottom:0}
.fig{margin:14px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;max-width:760px;box-shadow:var(--shadow)}
.fig .svgbox{position:relative;cursor:zoom-in}
.fig .svgbox::after{content:"tap to enlarge";position:absolute;right:6px;top:4px;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.7}
.fig .svgbox .fignum{position:absolute;left:6px;top:4px;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#lightbox{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#lightbox.open{display:flex}
#lightbox .lbhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#lightbox .lbbody{flex:1;overflow:auto;display:grid;place-items:center}
#lightbox .lbbody svg{width:min(100%,1100px);height:auto;max-width:none}
.fig .svgbox{overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;max-width:720px;margin:0 auto;font-family:var(--body)}
.fig figcaption{font-size:.85rem;color:var(--muted);margin-top:8px;font-family:var(--display)}
.fig figcaption b{color:var(--fg)}
svg text{fill:var(--fg)}
/* old flat-diagram classes kept for any inline SVG in answers */
svg .box{fill:var(--surface-2);stroke:var(--fg);stroke-width:1.3}
svg .boxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
svg .boxw{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.3}
svg .ln{stroke:var(--fg);stroke-width:1.4;fill:none}
svg .lna{stroke:var(--accent);stroke-width:2;fill:none}
svg .lnd{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}
svg .lbl{font-size:12px}
svg .sm{font-size:10.5px;fill:var(--muted)}
svg .ttl{font-size:13px;font-weight:700;font-family:var(--display)}
svg .mono{font-family:var(--mono);font-size:11.5px}
svg .node{fill:var(--surface);stroke:var(--fg);stroke-width:1.3}
svg .hub{fill:var(--accent);stroke:none}
svg .arrow{fill:var(--fg)}
.topic-nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}
.btn{background:var(--surface);border:1px solid var(--line);color:var(--fg);padding:8px 14px;border-radius:8px;font-family:var(--display);font-weight:600;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.82rem}
.btn.ghost{background:transparent}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}

/* diagrams gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:16px}
.gallery .fig{margin:0;max-width:none}
.gallery .fig svg{max-width:none}

/* flashcards */
.flash-wrap{max-width:720px;margin:0 auto;display:grid;gap:14px}
.flashcard{perspective:1200px;min-height:260px}
.flashcard .inner{position:relative;width:100%;min-height:260px;transition:transform .5s;transform-style:preserve-3d}
.flashcard.flipped .inner{transform:rotateY(180deg)}
.flashcard .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:10px;box-shadow:var(--shadow);overflow:auto}
.flashcard .face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.flashcard .face .q{font-family:var(--display);font-size:1.25rem;font-weight:600}
.flashcard .face .a{font-size:1.02rem}
.flash-ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.82rem;color:var(--fg)}
.chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* formulas */
.formula{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;gap:6px}
.formula .f{font-family:var(--mono);font-size:1.02rem;background:var(--surface-2);padding:8px 10px;border-radius:6px;overflow-x:auto}
.formula .ex{font-size:.92rem;color:var(--muted)}
.formula .ex b{color:var(--fg)}

/* practice */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,input[type=number],input[type=text]{font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:100%}
.filters label{display:inline-flex;gap:6px;align-items:center;max-width:100%;min-width:0}
.filters select{max-width:min(320px,calc(100vw - 110px))}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.qcard .qhead{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.qcard .qtext{font-weight:600;font-size:1.02rem;flex:1 1 300px;min-width:0}
.badge{font-family:var(--display);font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.badge.m7{background:var(--good-soft);color:var(--good)}
.badge.m10{background:var(--accent-soft);color:var(--accent)}
.badge.m16{background:var(--warn-soft);color:var(--warn)}
.badge.asg{background:var(--mark);color:var(--fg)}
.badge.ppt{background:var(--surface-2);color:var(--ink-2)}
.answer{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.answer h4{margin:12px 0 4px;color:var(--ink-2)}
.answer h4:first-child{margin-top:0}
.answer p{margin:5px 0;max-width:80ch}
.answer ul,.answer ol{max-width:80ch}
.answer .fig{max-width:640px}
.answer .end{font-family:var(--display);font-size:.8rem;color:var(--muted);margin-top:10px;text-transform:uppercase;letter-spacing:.06em}
.howto{font-size:.86rem;color:var(--muted);margin-top:6px}

/* mcq */
.mcq{max-width:760px;margin:0 auto}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:6px 0;color:var(--fg)}
.opt:hover{border-color:var(--accent)}
.opt.correct{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{margin-top:10px;background:var(--surface-2);padding:10px 12px;border-radius:8px;font-size:.95rem}
.score{font-family:var(--mono);font-size:.9rem}

/* mock */
.mock-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.timer{font-family:var(--mono);font-size:1.3rem;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.mq{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.mq .lab{font-family:var(--display);font-weight:700;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mq .or{font-family:var(--display);text-align:center;font-weight:800;margin:12px 0;color:var(--warn);letter-spacing:.2em}
.mq textarea{width:100%;min-height:120px;font:inherit;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px;resize:vertical}
.selfmark{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:.92rem}
.selfmark input{width:70px}
.result{background:var(--accent-soft);border-radius:var(--radius);padding:16px;margin-top:14px}
.history td{padding:4px 8px;font-family:var(--mono);font-size:.85rem}

footer{border-top:1px solid var(--line);margin-top:30px}
footer .wrap{padding-block:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
footer a{font-weight:600}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
mark{background:var(--mark);color:inherit;padding:0 2px}
.kbd{font-family:var(--mono);font-size:.8rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface-2)}
details.sum{margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
details.sum summary{cursor:pointer;font-family:var(--display);font-weight:600}

/* walkthrough */
.fig .figbar{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-top:8px;flex-wrap:wrap}
.fig .figbar figcaption{margin-top:0;flex:1 1 240px;min-width:0}

<script>
// ---------- ISO KIT (paper-white isometric figures) ----------
const ISO=(()=>{
const C=Math.cos(Math.PI/6),S=Math.sin(Math.PI/6);
const P=(x,y,z=0)=>[(x-y)*C,(x+y)*S-z];
const f=(n)=>Math.round(n*100)/100;
const pts=(arr)=>arr.map(p=>f(p[0])+','+f(p[1])).join(' ');
const circlePlan=(cx,cy,r,n=28)=>{const o=[];for(let i=0;i<n;i++){const a=i/n*2*Math.PI;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return o;};
const rrPlan=(x,y,w,d,r=0,n=6)=>{if(r<=0)return [[x,y],[x+w,y],[x+w,y+d],[x,y+d]];r=Math.min(r,w/2,d/2);const o=[];const corner=(cx,cy,a0)=>{for(let i=0;i<=n;i++){const a=a0+i/n*Math.PI/2;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}};corner(x+w-r,y+r,-Math.PI/2);corner(x+w-r,y+d-r,0);corner(x+r,y+d-r,Math.PI/2);corner(x+r,y+r,Math.PI);return o;};
// tone from outward normal (nx,ny): light comes from the back-left; right-facing (+x) faces are darker than +y faces
const toneOf=(nx,ny)=>{const a=Math.atan2(ny,nx);// 0 = +x (right face), pi/2 = +y (left face)
  const t=Math.cos(a-Math.PI*0.5);// 1 at +y, 0 at +x
  return t>0.8?1:t>0.5?2:t>0.15?3:t>-0.25?4:5;};
class Scene{
  constructor(){this.items=[];this.named={};this._id=0;}
  add(svg,key,ptsScreen,name){this.items.push({svg,key});if(ptsScreen&&ptsScreen.length){this._bb(ptsScreen,name);}}
  _bb(ps,name){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ps.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});this._all=this._all||[1e9,1e9,-1e9,-1e9];this._all=[Math.min(this._all[0],x0),Math.min(this._all[1],y0),Math.max(this._all[2],x1),Math.max(this._all[3],y1)];if(name){const n=this.named[name];this.named[name]=n?[Math.min(n[0],x0),Math.min(n[1],y0),Math.max(n[2],x1),Math.max(n[3],y1)]:[x0,y0,x1,y1];}}
  // generic extruded prism from a plan polygon (convex), bottom z, height h; topScale lets a cone-like top (same centre)
  prism(plan,z,h,o={}){const {tone='mid',name,cls='',acc=false,inner='',topFill=true,zTop}=o;const zt=zTop!=null?zTop:z+h;const top=plan.map(p=>P(p[0],p[1],zt));const bot=plan.map(p=>P(p[0],p[1],z));const n=plan.length;let sides='';const cx=plan.reduce((a,p)=>a+p[0],0)/n,cy=plan.reduce((a,p)=>a+p[1],0)/n;
    for(let i=0;i<n;i++){const a=plan[i],b=plan[(i+1)%n];const ex=b[0]-a[0],ey=b[1]-a[1];let nx=ey,ny=-ex;// outward for clockwise? decide by centre
      if((a[0]-cx)*nx+(a[1]-cy)*ny<0){nx=-nx;ny=-ny;}const len=Math.hypot(nx,ny)||1;nx/=len;ny/=len;
      if(nx+ny<=0.02)continue;// back faces hidden
      const t=toneOf(nx,ny);sides+=`<polygon points="${pts([bot[i],bot[(i+1)%n],top[(i+1)%n],top[i]])}" class="i-f i-s${t} ${tone}${acc?' acc':''}"/>`;}
    // silhouette outline: top outline + front chain verticals
    const topPoly=`<polygon points="${pts(top)}" class="i-f i-s0 ${tone}${acc?' acc':''}"/>`;
    const sx=top.map(p=>p[0]);const iMin=sx.indexOf(Math.min(...sx)),iMax=sx.indexOf(Math.max(...sx));
    const outline=`<polygon points="${pts(top)}" class="i-o ${cls}"/><line x1="${f(top[iMin][0])}" y1="${f(top[iMin][1])}" x2="${f(bot[iMin][0])}" y2="${f(bot[iMin][1])}" class="i-o"/><line x1="${f(top[iMax][0])}" y1="${f(top[iMax][1])}" x2="${f(bot[iMax][0])}" y2="${f(bot[iMax][1])}" class="i-o"/>`+this._frontChain(bot,iMin,iMax);
    const xys=plan.map(p=>p[0]+p[1]);const mn=Math.min(...xys),mx=Math.max(...xys);const flat=(zt-z)<4.5;const key=o.key!=null?o.key:(flat?mn+0.3*(mx-mn):(cx+cy))+z*0.002+(o.bias||0);
    this.add(`<g class="i-part">${sides}${topFill?topPoly:''}${outline}${inner}</g>`,key,[...top,...bot],name);return {top,bot,key,cx,cy,zt};}
  _frontChain(bot,iMin,iMax){// chain of bottom points from iMin to iMax along the larger-sy side
    const n=bot.length;const walk=(dir)=>{const o=[];let i=iMin;o.push(bot[i]);while(i!==iMax){i=(i+dir+n)%n;o.push(bot[i]);}return o;};const a=walk(1),b=walk(-1);const sy=(arr)=>arr.reduce((s,p)=>s+p[1],0)/arr.length;const ch=sy(a)>sy(b)?a:b;return `<polyline points="${pts(ch)}" class="i-o"/>`;}
  box(x,y,z,w,d,h,o={}){return this.prism(rrPlan(x,y,w,d,o.r||0,o.n||5),z,h,o);}
  cyl(x,y,z,r,h,o={}){return this.prism(circlePlan(x,y,r,o.n||30),z,h,o);}
  // lathe: profile [[z,r],...] around (x,y); bands between consecutive radii, shaded per segment
  lathe(x,y,prof,o={}){const {tone='mid',name,acc=false,n=30}=o;let s='';const allp=[];let last=null;
    for(let k=0;k<prof.length-1;k++){const [z0,r0]=prof[k],[z1,r1]=prof[k+1];const p0=circlePlan(x,y,Math.max(r0,0.01),n),p1=circlePlan(x,y,Math.max(r1,0.01),n);
      for(let i=0;i<n;i++){const a=p0[i],b=p0[(i+1)%n],c=p1[(i+1)%n],d=p1[i];const mx=(a[0]+b[0])/2-x,my=(a[1]+b[1])/2-y;const len=Math.hypot(mx,my)||1;const nx=mx/len,ny=my/len;if(nx+ny<=0.02)continue;const t=toneOf(nx,ny);const q=[P(a[0],a[1],z0),P(b[0],b[1],z0),P(c[0],c[1],z1),P(d[0],d[1],z1)];allp.push(...q);s+=`<polygon points="${pts(q)}" class="i-f i-s${t} ${tone}${acc?' acc':''}"/>`;}
      last=[z1,r1];}
    // top disc + outline of silhouette: left and right extreme generatrix
    const [zt,rt]=prof[prof.length-1];const topP=circlePlan(x,y,Math.max(rt,0.01),n).map(p=>P(p[0],p[1],zt));if(rt>0.3){s+=`<polygon points="${pts(topP)}" class="i-f i-s0 ${tone}${acc?' acc':''}"/><polygon points="${pts(topP)}" class="i-o"/>`;}
    // silhouette: for each profile point, the extreme left/right screen points are at plan angles 135° and -45° (perpendicular to view)
    const L=prof.map(([z,r])=>P(x+r*Math.cos(Math.PI*0.75),y+r*Math.sin(Math.PI*0.75),z)),R=prof.map(([z,r])=>P(x+r*Math.cos(-Math.PI*0.25),y+r*Math.sin(-Math.PI*0.25),z));
    s+=`<polyline points="${pts(L)}" class="i-o"/><polyline points="${pts(R)}" class="i-o"/>`;
    // bottom front arc
    const [zb,rb]=prof[0];const botP=circlePlan(x,y,Math.max(rb,0.01),n);const front=botP.filter(p=>(p[0]-x)+(p[1]-y)>-0.001*rb).map(p=>P(p[0],p[1],zb));
    s+=this._arcFront(x,y,rb,zb);
    const key=o.key!=null?o.key:(x+y)+prof[0][0]*0.002+(o.bias||0);this.add(`<g class="i-part">${s}</g>`,key,[...allp,...topP],name);return {key};}
  _arcFront(x,y,r,z,n=40){let d='';for(let i=0;i<=n;i++){const a=-Math.PI*0.25+i/n*Math.PI;const p=P(x+r*Math.cos(a),y+r*Math.sin(a),z);d+=(i?'L':'M')+f(p[0])+' '+f(p[1]);}return `<path d="${d}" class="i-o"/>`;}
  flat(plan,z,o={}){const p=plan.map(q=>P(q[0],q[1],z));const key=o.key!=null?o.key:(plan[0][0]+plan[0][1])-5;this.add(`<polygon points="${pts(p)}" class="i-f i-s0 ${o.tone||'lo'}${o.acc?' acc':''} ${o.cls||''}"/>${o.outline!==false?`<polygon points="${pts(p)}" class="i-o ${o.ocls||''}"/>`:''}`,key,p,o.name);}
  ring(x,y,z,r,o={}){const p=circlePlan(x,y,r,40).map(q=>P(q[0],q[1],z));this.add(`<polygon points="${pts(p)}" class="${o.cls||'i-o'}" fill="none"/>`,o.key!=null?o.key:(x+y)+z*0.002+(o.bias||0),p,o.name);}
  wire(points,o={}){const p=points.map(q=>P(q[0],q[1],q[2]||0));let s=`<polyline points="${pts(p)}" class="i-w ${o.cls||''}"/>`;if(o.dots!==false){s+=`<circle cx="${f(p[0][0])}" cy="${f(p[0][1])}" r="${o.dr||1.3}" class="i-d"/><circle cx="${f(p[p.length-1][0])}" cy="${f(p[p.length-1][1])}" r="${o.dr||1.3}" class="i-d"/>`;}if(o.arrow){const a=p[p.length-2],b=p[p.length-1];const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);const k=4;const q=[b,[b[0]-k*Math.cos(ang-0.5),b[1]-k*Math.sin(ang-0.5)],[b[0]-k*Math.cos(ang+0.5),b[1]-k*Math.sin(ang+0.5)]];s+=`<polygon points="${pts(q)}" class="i-ah ${o.cls||''}"/>`;}const key=o.key!=null?o.key:900;this.add(`<g class="i-part">${s}</g>`,key,p,o.name);}
  dot(x,y,z,r=0.9,o={}){const p=P(x,y,z);this.add(`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${r}" class="i-screw ${o.cls||''}"/>`,o.key!=null?o.key:(x+y)+z*0.002+0.0001,[p],o.name);}
  screws(x,y,z,w,d,inset=3){[[x+inset,y+inset],[x+w-inset,y+inset],[x+inset,y+d-inset],[x+w-inset,y+d-inset]].forEach(p=>this.dot(p[0],p[1],z,0.9));}
  ticks(x0,y0,x1,y1,z,count,len=2,o={}){let s='';const dx=(x1-x0)/count,dy=(y1-y0)/count;const nx=o.nx??0,ny=o.ny??1;for(let i=0;i<=count;i++){const px=x0+dx*i,py=y0+dy*i;const L=i%5===0?len*1.8:len;const a=P(px,py,z),b=P(px+nx*L,py+ny*L,z);s+=`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" class="i-t ${i%5===0?'maj':''}"/>`;}this.add(s,o.key!=null?o.key:(x0+y0)+z*0.002+0.0002,null);}
  // text on a face: plane 'top' (u=x,v=y at z), 'right' (x=const; u=y,v=z), 'left' (y=const; u=x,v=z)
  text(plane,x,y,z,str,o={}){let m,anchor=o.anchor||'middle';const size=o.size||4.2;if(plane==='top'){const p=P(x,y,z);m=`matrix(${f(C)} ${f(S)} ${f(-C)} ${f(S)} ${f(p[0])} ${f(p[1])})`;}else if(plane==='right'){const p=P(x,y,z);m=`matrix(${f(C)} ${f(-S)} 0 1 ${f(p[0])} ${f(p[1])})`;}else if(plane==='left'){const p=P(x,y,z);m=`matrix(${f(C)} ${f(S)} 0 1 ${f(p[0])} ${f(p[1])})`;}else{const p=P(x,y,z);m=`translate(${f(p[0])} ${f(p[1])})`;}
    const p=P(x,y,z);const tw=str.replace(/<[^>]+>/g,'').length*size*0.6;let bx;if(plane==='top'){const u0=anchor==='start'?0:(anchor==='end'?-tw:-tw/2);const q0=P(x+u0,y,z),q1=P(x+u0+tw,y,z),q2=P(x+u0,y-size,z);bx=[Math.min(q0[0],q2[0]),Math.max(q1[0],q1[0])];p[1]=Math.max(q0[1],q1[1]);var py0=Math.min(q2[1],q1[1]-size);}else{bx=anchor==='start'?[p[0],p[0]+tw]:(anchor==='end'?[p[0]-tw,p[0]]:[p[0]-tw/2,p[0]+tw/2]);}this.add(`<text transform="${m}" font-size="${size}" text-anchor="${anchor}" class="i-txt ${o.cls||''}">${str}</text>`,o.key!=null?o.key:(x+y)+z*0.002+0.0003,[[bx[0],(typeof py0!=='undefined'&&plane==='top')?py0:p[1]-size],[bx[1],p[1]+size*0.3]],o.name);}
  label(x,y,z,str,o={}){// engraved label plate with text on top
    const w=o.w||(str.length*2.6+6),d=o.d||7;this.box(x,y,z,w,d,0.8,{tone:'hi',r:1,key:o.key});this.text('top',x+w/2,y+d/2+1.4,z+0.9,str,{size:o.size||3.6,key:(o.key!=null?o.key+0.001:undefined),cls:o.cls});return {w,d};}
  halo(x,y,w,d){const c=P(x+w/2,y+d/2,0);const rx=(w+d)*0.5,ry=(w+d)*0.27;this.add(`<ellipse cx="${f(c[0])}" cy="${f(c[1]+5)}" rx="${f(rx)}" ry="${f(ry)}" class="i-halo"/>`,-1e6,[[c[0]-rx,c[1]-ry],[c[0]+rx,c[1]+ry]]);}

    const svg=`<svg viewBox="0 0 ${f(w)} ${f(h)}" xmlns="http://www.w3.org/2000/svg" role="img" class="iso"><g transform="translate(${f(-x)} ${f(-y)})">${items.map(i=>i.svg).join('')}</g></svg>`;return {svg,boxes,w,h};}
}
// ---- assemblies (each returns nothing; parts added to scene in a fixed painter order) ----
const keyer=(o,x,y,z)=>{const k0=o.key!=null?o.key:(x+y)+z*0.002;let n=0;return ()=>k0+(n++)*1e-5;};
const A={
  bench(sc,x,y,w,d,o={}){sc.halo(x,y,w,d);sc.box(x,y,0,w,d,3,{tone:'lo',r:4,key:-1000});sc.box(x+1.2,y+1.2,3,w-2.4,d-2.4,0.6,{tone:'lo',r:3.2,key:-999});sc.screws(x,y,3.6,w,d,3.5);
    if(o.ruler!==false){sc.ticks(x+6,y+d-1.4,x+w-6,y+d-1.4,3.6,Math.max(5,Math.round((w-12)/4)),1.6,{nx:0,ny:-1,key:-998});}
    if(o.label){sc.label(x+w-o.label.length*2.6-10,y+3,3.6,o.label,{key:-997});}},

  sc.text('top',10,30,3.65,'STUFFED',{size:2.6,anchor:'start',name:'stuffed'});cubes(sc,24,26,3.6,st,{s:3.4,size:2.4});

});

{id:'datacomm',unit:'Unit 1 · Basics',title:'Data communication & its components',summary:'What data communication means, its 4 key features, the components, and distributed processing.',
body:`
<section><h3>What is data communication?</h3>
${def('Data communication','the exchange of data between two devices using a transmission medium (like a wire cable or wireless signal). <i>Telecommunication</i> means communication at a distance. <i>Data</i> means information in any form agreed by the two parties.')}
<p>In simple words: data communication is sending digital or analog data between two or more devices through a medium such as cables, wireless signals or optical fibre. It is the base of every computer network, because it lets devices share information and resources.</p>
${src('Lecture 1')}
</section>
<section><h3>Four key features of data communication</h3>
<ol><li><b>Delivery</b> — the data must reach the correct destination.</li><li><b>Accuracy</b> — the data must arrive without errors.</li><li><b>Timeliness</b> — the data must arrive within an acceptable time (very important for real-time things like video calls).</li><li><b>Jitter</b> — the variation in packet arrival time must be small (important for audio and video streaming).</li></ol>
${tip('Remember <b>D-A-T-J</b>: Delivery, Accuracy, Timeliness, Jitter. Write one line for each.')}
</section>
<section><h3>Components of a data communication system</h3>
${fig('datacomm')}
<p>The five basic components:</p>
<ol><li><b>Message</b> — the information to be communicated: text, images, audio, video or a mix of these.</li><li><b>Sender</b> — the device that creates and sends the message. Examples: computer, smartphone, sensor.</li><li><b>Receiver</b> — the device that receives the message. Examples: another computer, server, printer, mobile.</li><li><b>Transmission medium</b> — the physical path for the data. Wired: twisted pair, coaxial, fibre optic. Wireless: radio waves, microwaves, infrared, satellite.</li><li><b>Protocol</b> — a set of rules that govern data communication, so both devices understand each other. Examples: HTTP, FTP, TCP/IP, SMTP.</li></ol>
<p>The lecture also lists these supporting parts:</p>
<ul><li><b>Encoder and decoder</b> — the encoder changes the message into a form that can be transmitted (digital/electrical signals); the decoder changes it back at the receiver.</li><li><b>Modem / transceiver</b> — a modem converts digital data to analog signals (and back) for analog media; a transceiver both transmits and receives.</li><li><b>Switches and routers</b> — a switch sends data to the right device inside a network; a router forwards packets between different networks.</li><li><b>Topology</b> — the physical or logical arrangement of the network parts (star, bus, ring, mesh).</li><li><b>Timing</b> — synchronisation between sender and receiver so data is sent and received correctly.</li></ul>
${src('Lecture 1')}
</section>
<section><h3>Types of data communication (modes)</h3>
<p><b>Simplex</b> — data flows one way only (TV broadcast). <b>Half-duplex</b> — both ways but one at a time (walkie-talkie). <b>Full-duplex</b> — both ways at the same time (telephone call). Full notes in the <i>Transmission modes</i> topic.</p>
<p><b>Applications:</b> Internet browsing, video conferencing, online gaming, file sharing, IoT devices.</p>
</section>
<section><h3>Distributed processing</h3>
${beyond('this syllabus word is not explained in the PPTs. Simple meaning from the textbook (Forouzan):')}
${def('Distributed processing','a task is divided among many computers connected by a network, instead of one big machine doing all the work. Each computer handles a part of the job.')}
${fig('distributed')}
<ul><li><b>Why it is good:</b> faster (work done in parallel), no single point of failure, easy to grow, each system can limit what others may do (security), data can stay where it is used.</li><li><b>Examples:</b> client–server web apps, cloud computing, bank ATM networks.</li></ul>
</section>`},

{id:'standards',unit:'Unit 1 · Basics',title:'Standards & organizations',summary:'What network standards are, why they matter, and the organizations that make them.',
body:`
<section><h3>What are network standards?</h3>
${def('Network standards','a set of rules, protocols and guidelines that make sure networking devices and software from different companies can communicate reliably.')}
<p><b>Why are they important?</b></p>
<ul><li>Compatibility between devices from different vendors.</li><li>Reliable and error-free communication.</li><li>Better network security and performance.</li><li>Global communication and Internet connectivity.</li><li>Lower development and implementation cost.</li></ul>
${src('Lecture 3')}
</section>
<section><h3>Standardization organizations</h3>
${fig('standards')}
${tbl(['Organization','Full name','Role in computer networks'],[
['ISO','International Organization for Standardization (1947, Geneva, 170+ member countries)','Develops international standards, including the <b>OSI reference model</b> (7 layers). Also ISO/IEC 27001 (information security), ISO 9001 (quality).'],

${tip('For "mention the major organizations" write at least 5 names with one line each. The easy set: ISO (OSI), IEEE (802 standards), IETF (RFCs), ITU-T (telecom), ANSI (USA), EIA/TIA (cabling), W3C (web), ICANN (names).')}
