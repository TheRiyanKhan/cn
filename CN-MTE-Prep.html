Q({id:'c1',marks:10,topic:'devices',tags:['ppt'],q:'Explain hub, repeater, bridge, router and gateway with their OSI layer, working and one real-life example each. How does a bridge differ from a router?',
ans:`[[fig:devices]]
<p><b>Hub (Layer 1)</b> – a simple multi-port device that connects computers in a LAN and broadcasts every incoming signal to all connected devices. Bandwidth is shared and half-duplex; more devices mean more collisions. Cheap but inefficient and insecure, so replaced by switches. <i>Example:</i> 4–8 PCs in an old school lab plugged into one hub – every PC received every print job.</p>
<p><b>Repeater (Layer 1)</b> – a two-port device that regenerates weak, distorted signals so data can travel longer. Signals lose strength and pick up noise over distance (attenuation); the repeater cleans and re-creates the signal at full strength. Connects two segments of the same network; no addresses. <i>Example:</i> a Wi-Fi range extender for the upstairs bedroom; undersea fibre cables have repeaters every 50–100 km.</p>
<p><b>Bridge (Layer 2)</b> – reads MAC addresses inside frames and forwards traffic only where it needs to go. Connects two LAN segments, learns which devices are on each side, forwards a frame only when the destination is on the other side; less traffic, fewer collisions; both segments remain one logical network. <i>Example:</i> a wireless bridge joining an office and a warehouse 200 m apart; splitting a 100-PC office LAN into two segments.</p>
<p><b>Router (Layer 3)</b> – reads IP addresses and chooses the best path for each packet between networks, using a routing table (static or OSPF/BGP). Home routers also do NAT, DHCP, firewall and Wi-Fi. <i>Example:</i> the home Wi-Fi router linking all devices to the ISP; campus routers; Internet backbone routers.</p>
<p><b>Gateway (up to Layer 7)</b> – the translator: converts between different protocols, data formats or systems so incompatible networks can talk; often includes routing and switching. <i>Example:</i> office VoIP gateway (telephone lines ↔ Internet voice); online payment gateway; e-mail gateway.</p>
${H('Bridge vs router')}
${T(['Basis','Bridge','Router'],[['Layer','2 – Data Link','3 – Network'],['Address used','MAC address','IP address'],['Connects','Segments of the SAME network','DIFFERENT networks'],['Broadcasts','Passed on','Stopped'],['Path choice','None','Chooses the best path with a routing table'],['Example','Wireless bridge between buildings','LAN to Internet']])}
<p>Key sentence from the lecture: "a bridge joins segments of the same network; a router joins different networks."</p>
${END}`});

Q({id:'c2',marks:10,topic:'tcpip',tags:['ppt'],q:'Compare the TCP/IP model with the OSI model. Show how the four TCP/IP layers correspond to the seven OSI layers using a diagram or table.',
ans:`[[fig:osivstcp]]
${H('Correspondence')}
${T(['TCP/IP model','Corresponding OSI layers'],[['Application','Application, Presentation and Session (layers 5–7)'],['Transport','Transport (layer 4)'],['Internet','Network (layer 3)'],['Network Access','Data Link and Physical (layers 1–2)']])}
${H('Differences')}
${T(['Basis','OSI model','TCP/IP model'],[['Stands for','Open System Interconnection','Transmission Control Protocol / Internet Protocol'],['Developed by','ISO','ARPANET (US Department of Defense)'],['Layers','7','4 (some books show 5: Application, Transport, Internet, Data Link, Physical)'],['Nature','Independent standard and generic reference model – a guideline','Actual implementation; the standard protocols that built the Internet'],['Approach','Vertical','Horizontal'],['Session & Presentation','Separate layers','Included in the Application layer'],['Transport layer','Guarantees delivery of packets; connection-oriented only','Does not guarantee delivery (but TCP is reliable); supports both connection-oriented (TCP) and connectionless (UDP)'],['Network layer','Both connectionless and connection-oriented services','Connectionless only (IP)'],['Definitions','Services, protocols and interfaces not clearly defined per layer','Clearly defined per layer'],['Protocol replacement','Easy – protocols fit the model','Difficult – the protocols are the model'],['Use','Teaching, design, troubleshooting','Real networks and the Internet']])}
<p><b>Importance of TCP/IP in daily life:</b> web browsing (HTTP, DNS, TCP/IP), video streaming (UDP, TCP, IP), cyber security (firewalls, VPNs).</p>
${END}`});

Q({id:'c3',marks:10,topic:'unguided',tags:['ppt'],q:'Explain radio waves, microwaves and infrared as unguided transmission media. Compare their characteristics, advantages, limitations and applications. Also explain attenuation, distortion and noise.',
ans:`[[fig:unguided]]
<p><b>Unguided media</b> transmit data as wireless signals without a physical cable.</p>
<p><b>Radio waves</b> – used in Wi-Fi, Bluetooth, AM/FM radio and TV. <i>Advantages:</i> long range, pass through walls and buildings. <i>Limitations:</i> prone to interference from other signals.</p>
<p><b>Microwaves</b> – used in satellite communication, mobile (cellular) networks and radar. <i>Advantages:</i> high bandwidth, long-distance transmission. <i>Limitations:</i> need line of sight; affected by weather (rain, water vapour) and obstacles.</p>
<p><b>Infrared</b> – used in remote controls and short-range communication, thermal imaging, night vision. <i>Advantages:</i> secure, no interference between rooms. <i>Limitations:</i> short range, needs line of sight, cannot pass through walls.</p>
${T(['Feature','Radio waves','Microwaves','Infrared'],[['Frequency','3 kHz – 300 GHz','300 MHz – 300 GHz','300 GHz – 430 THz'],['Wavelength','1 mm – 100 km (longest)','1 mm – 1 m','700 nm – 1 mm (shortest)'],['Penetration','High – through walls','Medium – affected by rain','Low – no solid objects'],['Interference','Prone','Water vapour, obstacles','Blocked by walls; needs LOS'],['Distance','Very long (thousands of km)','Medium (hundreds of km)','Short (a few metres)'],['Usage','Broadcasting, Wi-Fi, GPS','Mobile, satellite, radar','Remote controls, night vision']])}
${H('Transmission impairments')}
[[fig:impair]]
<ul><li><b>Attenuation</b> – loss of energy: the signal strength decreases with distance.</li><li><b>Distortion</b> – a change in the shape of the signal because each frequency component travels at its own speed and arrives at a different time (delay distortion).</li><li><b>Noise</b> – unwanted signals added to the data while it travels over the medium.</li></ul>
${END}`});

Q({id:'c4',marks:10,topic:'csma',tags:['ppt'],q:'What is CSMA? Explain its working and why collisions may still occur after carrier sensing. Explain 1-persistent, non-persistent and p-persistent CSMA and compare their collision probability and delay.',
ans:`<p><b>CSMA</b> (Carrier Sense Multiple Access) is a random-access method in which a station listens to the channel before transmitting ("sense before transmit"), to reduce collisions when many devices share one medium.</p>
${H('Working')}
<ol><li><b>Carrier sensing</b> – listen to check whether the channel is idle or busy.</li><li><b>Wait if busy</b> – wait until it becomes idle.</li><li><b>Transmit if idle</b> – send the data.</li><li><b>Collision handling</b> – if two stations transmit together a collision may occur; handled by the CSMA variant (abort, backoff, retry).</li><li><b>Backoff and retransmission</b> – wait a random time and start again from sensing.</li></ol>
${H('Why collisions still happen')}
<p>Carrier sensing cannot remove collisions completely because signals take time to travel through the medium (propagation delay). Two distant stations may both sense an idle channel and begin transmitting almost at the same time; their signals then collide.</p>
${H('Persistence methods')}
[[fig:persist]]
<p><b>1-persistent:</b> busy → keep sensing until free, then grab it; idle → transmit with probability 1; collision → wait random time, retry. Used by early Ethernet (802.3) with CSMA/CD.</p>
<p><b>Non-persistent:</b> busy → do not keep sensing; wait a random time and try again; idle → transmit. Fewer collisions and better under heavy traffic, but higher delay and inefficient in light traffic. Used in wireless networks.</p>
<p><b>p-persistent:</b> busy → keep sensing; idle → transmit with probability p, else defer to the next slot (probability 1 − p); collision → random wait. Balances efficiency and collision avoidance; used in Wi-Fi and IoT networks.</p>
${T(['Feature','1-persistent','Non-persistent','p-persistent'],[['Channel busy','Senses continuously','Waits random time, senses again','Keeps sensing'],['Channel idle','Transmits immediately','Transmits','Transmits with probability p'],['Collision probability','Highest','Lowest','Controlled by p'],['Delay','Low at light load','May be higher','Balanced'],['Aggressiveness','Highest','Lowest','Adjustable']])}
${END}`});

Q({id:'c5',marks:10,topic:'errorctl',tags:['ppt'],q:'A 4×4 block is sent with even row and column parity. Received block: rows 1010|0, 0101|0, 1100|1, 0011|0 and column parity 0001. (i) Has an error occurred? Locate it. (ii) How can the receiver correct it? Explain two-dimensional parity.',
ans:`[[fig:twodparity]]
<p><b>Two-dimensional parity:</b> parity bits are calculated for each row (like simple parity) and also for each column, and both are sent with the data. The receiver recomputes them and compares with the received parity bits.</p>
${H('Step 1 – check row parities (even)')}
${T(['Row','Data bits','1s','Expected parity','Received','Match?'],[['1','1 0 1 0','2','0','0','Yes'],['2','0 1 0 1','2','0','0','Yes'],['3','1 1 0 0','2','0','1','<b>No</b>'],['4','0 0 1 1','2','0','0','Yes']])}
<p>Error detected in row 3.</p>
${H('Step 2 – check column parities')}
${T(['Column','Bits','1s','Expected','Received','Match?'],[['1','1 0 1 0','2','0','0','Yes'],['2','0 1 1 0','2','0','0','Yes'],['3','1 0 0 1','2','0','0','Yes'],['4','0 1 0 1','2','0','1','<b>No</b>']])}
<p>Error detected in column 4.</p>
${H('Step 3 – locate')}
<p>(i) Yes, an error occurred, at the intersection: <b>row 3, column 4</b>. The bit was received as 0 but should be 1.</p>
${H('Step 4 – correct')}
<p>(ii) The receiver flips that bit: received row 3 = 1 1 0 0 → corrected row 3 = <b>1 1 0 1</b>. Now row 3 has three 1s with parity 1 (even total) and column 4 has three 1s with parity 1 – both correct. So 2-D parity can detect and correct a single-bit error without retransmission.</p>
${END}`});

Q({id:'c6',marks:10,topic:'errorctl',tags:['ppt'],q:'A sender transmits the 7-bit message 1001101 using the generator polynomial x³ + x² + 1. (i) Find the CRC. (ii) Give the transmitted frame. (iii) The received frame is 1001101100 — check for errors. (iv) How does the CRC length relate to the polynomial degree?',
ans:`${H('(i) CRC')}
<p>Generator x³ + x² + 1 → binary <b>1101</b> (4 bits, degree 3), so the CRC has 3 bits. Append 000 to the message: 1001101<b>000</b>.</p>
<pre class="mono" style="background:var(--surface-2);padding:10px;border-radius:6px;overflow-x:auto">1001 ⊕ 1101 = 0100
→ 1001 (bring down 1) ⊕ 1101 = 0100
→ 1000 (bring down 0) ⊕ 1101 = 0101
→ 1011 (bring down 1) ⊕ 1101 = 0110
→ 1100 (bring down 0) ⊕ 1101 = 0001
→ 0010 (bring down 0) leading 0 → 0010
→ 0100 (bring down 0) leading 0 → 0100
remainder = 100</pre>
<p>CRC = <b>100</b>.</p>
${H('(ii) Transmitted frame')}
<p>Frame = message + CRC = 1001101 <b>100</b> = <b>1001101100</b> (10 bits).</p>
${H('(iii) Checking the received frame 1001101100')}
<pre class="mono" style="background:var(--surface-2);padding:10px;border-radius:6px;overflow-x:auto">1001 ⊕ 1101 = 0100 → 1001 ⊕ 1101 = 0100 → 1000 ⊕ 1101 = 0101
→ 1011 ⊕ 1101 = 0110 → 1101 ⊕ 1101 = 0000 → 0000 → 0000
remainder = 000</pre>
<p>The remainder is zero, so <b>no error</b> occurred – the received frame is exactly the one sent, and the receiver accepts 1001101. (If any bit had changed, the remainder would be non-zero and the frame rejected.)</p>
${H('(iv) CRC length and polynomial degree')}
<p>The CRC is the remainder of division by a k-bit divisor, so it has k − 1 bits – exactly the <b>degree of the generator polynomial</b>. Degree 3 → 3-bit CRC; CRC-12 → 12 bits; CRC-32 (Ethernet) → 32 bits. Example from the lecture: a 1000-bit message with CRC-12 is transmitted as 1000 + 12 = 1012 bits.</p>
${END}`});

Q({id:'c7',marks:10,topic:'lantech',tags:['ppt'],q:'What is Ethernet? Explain its major characteristics, IEEE standard, topology, transmission speeds and applications. Why is CSMA/CD not required in modern switched full-duplex Ethernet?',
ans:`<p><b>Ethernet</b> is one of the most widely used networking technologies in LANs. It defines how devices on a network communicate and share data using a common protocol.</p>
${H('Characteristics')}
<ul><li><b>Standard:</b> IEEE 802.3.</li><li><b>Topology:</b> traditionally bus; now commonly star topology with switches.</li><li><b>Data transfer speeds:</b> Ethernet 10 Mbps, Fast Ethernet 100 Mbps, Gigabit Ethernet 1 Gbps, 10-Gigabit Ethernet and beyond (up to 100 Gbps).</li><li><b>Medium access:</b> CSMA/CD manages transmission and avoids collisions on shared channels.</li><li><b>Frame:</b> preamble, SFD, destination and source MAC, length/type, data (46–1500 bytes), CRC; 64–1518 bytes.</li></ul>
[[fig:framing]]
<p><b>How it works:</b> a device checks the channel; if free it sends an Ethernet frame; if two devices send at once there is a collision; both detect it, stop, wait a random time and retry.</p>
${T(['Advantages','Disadvantages'],[['High speed (up to 100 Gbps)','Limited mobility – needs cables'],['Reliable and stable, less interference than Wi-Fi','Cabling becomes complex in large setups'],['Cost-effective hardware and maintenance','Hard to expand over long distances (about 100 m per cable)'],['Secure – harder to intercept than wireless','Longer installation time than wireless'],['Widely compatible, standardised','Not suitable for phones/tablets'],['Low latency – gaming, VoIP, streaming','Cables can be damaged']])}
<p><b>Applications:</b> office, campus and home LANs; servers and data centres; backbone links; connecting switches, IP phones and access points.</p>
${H('Why switched full-duplex Ethernet does not need CSMA/CD')}
<p>CSMA/CD exists only to share one cable among many stations. In switched Ethernet each device has its own point-to-point link to a switch port, and the link is <b>full-duplex</b>: one wire pair carries data from the device to the switch and another from the switch to the device, so both can send at the same time without interfering. There is no shared medium and no collision domain beyond the two ends, so collisions cannot happen; carrier sensing, collision detection, jam signals and backoff are switched off, and the full bandwidth is available in both directions. Example from the lecture: 30 lab PCs on a Gigabit switch – star topology, no shared collision domain, no CSMA/CD, the switch forwards by the destination MAC address.</p>
${END}`});

Q({id:'c8',marks:10,topic:'lantech',tags:['ppt'],q:'Explain IEEE 802.11 and the major Wi-Fi generations. Describe CSMA/CA with ACK and backoff as used in WLAN, the hidden-node problem and RTS/CTS, and WLAN security.',
ans:`${H('IEEE 802.11')}
<p>IEEE 802.11 defines the WLAN Medium Access Control (MAC) and Physical layer (PHY) specifications – the foundation of Wi-Fi. Successive amendments improved throughput, spectrum use and coverage. Note: advertised PHY rates are not the same as real application throughput.</p>
${T(['Standard','Band','Max PHY rate','Key feature'],[['802.11b','2.4 GHz','11 Mb/s','DSSS'],['802.11a','5 GHz','54 Mb/s','OFDM'],['802.11g','2.4 GHz','54 Mb/s','OFDM'],['802.11n (Wi-Fi 4)','2.4/5 GHz','Higher throughput','MIMO'],['802.11ac (Wi-Fi 5)','5 GHz','Hundreds of Mb/s to Gb/s','Wide channels'],['802.11ax (Wi-Fi 6/6E)','2.4/5/6 GHz','Higher efficiency and capacity','OFDMA'],['802.11be (Wi-Fi 7)','2.4/5/6 GHz','Very high throughput','Multi-link']])}
<p>Bands: 2.4 GHz – longer coverage but crowded; 5 GHz – less crowded, more channels; 6 GHz – newest and cleanest.</p>
${H('CSMA/CA in WLAN')}
[[fig:csmaca]]
<p>1 <b>Sense</b> the channel; 2 if busy, <b>wait</b>; 3 when idle, wait the inter-frame period and choose a random <b>backoff</b>; 4 <b>transmit</b> when the counter reaches zero; 5 the receiver sends an <b>ACK</b>; if no ACK arrives the sender assumes failure and retries. Collision <i>avoidance</i> is used because a wireless station cannot reliably detect collisions while transmitting.</p>
${H('Hidden-node problem and RTS/CTS')}
[[fig:hidden]]
<p>Stations A and B both reach the AP but cannot hear each other, so both may transmit at the same time and corrupt each other's frames at the AP. <b>RTS/CTS:</b> the sender sends RTS (Request To Send) to reserve the medium; the AP replies CTS (Clear To Send), which nearby stations hear and then defer for the announced duration. This reduces hidden-node collisions, at the cost of some control-frame overhead.</p>
${H('WLAN security')}
<p>Goals: authentication (verify users/devices), confidentiality (no unauthorised reading), integrity (detect changes), access control (only authorised clients). Evolution: <b>WEP</b> – obsolete and insecure; <b>WPA/WPA2</b> – major improvement, WPA2 uses AES-CCMP; <b>WPA3</b> – newer and stronger. Best practices: strong passwords, keep AP/router firmware updated, prefer WPA3 or WPA2, use 802.1X/EAP in enterprise networks.</p>
${END}`});

Q({id:'c9',marks:10,topic:'guided',tags:['ppt'],q:'Explain twisted-pair cable. Differentiate STP and UTP with respect to construction, advantages, disadvantages and applications. Explain the construction of coaxial cable.',
ans:`[[fig:utp]]
${H('Twisted-pair cable')}
<p>Made by twisting two separately insulated copper wires around each other to make one cable; several pairs are bundled inside a protective sheath. The twisting lets the wires carry signals with less interference. It is the most widely used transmission medium (telephone lines, Ethernet).</p>
${H('STP vs UTP')}
${T(['Feature','STP (Shielded Twisted Pair)','UTP (Unshielded Twisted Pair)'],[['Construction','Twisted pairs with a metallic shield (copper braid or foil) around the wires','Twisted pairs without any shield; relies only on twisting'],['Advantages','Better protection against EMI and crosstalk; suitable for high-noise industrial places; more secure (harder to tap)','Affordable and cost-effective; easy to install and maintain; flexible and lightweight'],['Disadvantages','More expensive; heavier and less flexible, harder to install; needs grounding','More vulnerable to interference and crosstalk; not for high-EMI places; less secure'],['Applications','High-speed networks (Gigabit, industrial Ethernet); factories, power plants; military and government','Office and home networks; Ethernet cables Cat5/Cat6 for LANs; telephone and Internet wiring']])}
<p><b>Lecture case:</b> a smart-city surveillance network near power lines should use STP, because the shield blocks interference and keeps the video stable; alternatives are fibre (immune to EMI) or 5G/Wi-Fi 6 wireless.</p>
${H('Construction of coaxial cable')}
[[fig:coax]]
<p>Coaxial cable has an outer plastic covering, an insulation layer of PVC or Teflon, and two parallel conductors each with its own insulated cover:</p>
${T(['Component','Material','Purpose'],[['Centre conductor','Copper (solid or stranded), copper-clad steel','Carries the high-frequency electrical signal'],['Dielectric insulator','Polyethylene, foam PE, Teflon or PVC','Separates the inner conductor from the shield; keeps spacing constant'],['Outer conductor (shield)','Aluminium foil, braided copper/aluminium','Blocks electromagnetic interference; return path'],['Second shield (optional)','Braid + foil','Extra EMI protection (double-shielded cables)'],['Jacket / sheath','PVC, PE, LSZH','Protects from mechanical damage, UV, chemicals, fire']])}
<p>It transmits in <b>baseband</b> mode (dedicated bandwidth) or <b>broadband</b> mode (bandwidth split into separate ranges) and is widely used for cable TV and analog television networks.</p>
${END}`});

Q({id:'c10',marks:10,topic:'topology',tags:['ppt'],q:'Explain bus, ring, mesh and tree topologies with their components, working, advantages, disadvantages and applications.',
ans:`${H('Bus topology')}
[[fig:bus]]
<p><b>Components:</b> backbone cable, nodes, connecting cables, terminators at both ends. <b>Working:</b> station 1 sends data onto the bus; the signal travels along the shared cable; all devices detect it; the receiver recognises its data and the others ignore it; terminators absorb the signal so it does not reflect. <b>Advantages:</b> simple, less cable, inexpensive, easy for small networks, no central device. <b>Disadvantages:</b> backbone failure affects all; performance drops with traffic; troubleshooting difficult; more collisions; limited scalability. <b>Applications:</b> early Ethernet LANs, small temporary networks.</p>
${H('Ring topology')}
[[fig:ring]]
<p>Every device connects to two neighbours forming a closed circle; data travels through the ring according to the access mechanism, traditionally <b>token passing</b> – a special control frame circulates and a device transmits when it receives the token. <b>Advantages:</b> organised transmission, predictable access, fewer collisions, each device gets a turn. <b>Disadvantages:</b> a failed device or link can affect the ring; adding/removing devices is disruptive; troubleshooting difficult; expansion less convenient. <b>Applications:</b> Token Ring, FDDI, specialised systems.</p>
${H('Mesh topology')}
[[fig:mesh]]
<p>Devices are connected with multiple links, giving multiple possible paths; in a full mesh every device connects to every other (n(n−1)/2 links). <b>Advantages:</b> highly reliable, multiple paths, excellent fault tolerance, redundancy, suitable for critical networks. <b>Disadvantages:</b> very expensive, many cables and interfaces, complex installation and management, does not scale economically. <b>Applications:</b> WANs, Internet backbone, wireless mesh networks, military and emergency systems.</p>
${H('Tree topology')}
[[fig:starbus]]
<p>A hierarchical structure in which multiple star-like networks are connected through higher-level devices; large trees have core, distribution and access layers. <b>Advantages:</b> highly scalable, suitable for large organisations, easy hierarchical management, easy to divide into departments, easier fault isolation, branches added easily. <b>Disadvantages:</b> failure of a higher-level device affects many devices; more equipment; complex configuration; costlier than a simple star; needs planning. <b>Applications:</b> universities, corporate offices, large campuses, enterprise networks.</p>
${END}`});

Q({id:'c11',marks:10,topic:'csma',tags:['ppt'],q:'What is the total delay for a frame of 10 million bits sent over a link with 15 routers (each with 2 µs queuing and 1 µs processing time), link length 3000 km, propagation speed 2×10⁸ m/s and bandwidth 6 Mbps? Explain each type of delay.',
ans:`[[fig:delay]]
<p>The total delay (latency) has four parts: transmission delay, propagation delay, queuing delay and processing delay.</p>
${H('Transmission delay')}
<p>Time to push all the bits of the frame onto the link = frame size ÷ bandwidth = L / R.</p>
<p>T<sub>t</sub> = 10 × 10⁶ bits ÷ 6 × 10⁶ bits/s = <b>1.667 s</b></p>
${H('Propagation delay')}
<p>Time for a bit to travel the length of the link = distance ÷ speed = d / v.</p>
<p>T<sub>p</sub> = 3000 × 10³ m ÷ 2 × 10⁸ m/s = 0.015 s = <b>15 ms</b></p>
${H('Queuing delay')}
<p>Time a packet waits in a router's buffer before it is forwarded. 15 routers × 2 µs = <b>30 µs</b></p>
${H('Processing delay')}
<p>Time a router takes to check the header and decide where to send the packet. 15 routers × 1 µs = <b>15 µs</b></p>
${H('Total delay')}
<p>Total = 1.667 s + 0.015 s + 0.000030 s + 0.000015 s ≈ <b>1.682 s</b></p>
<p>The transmission delay dominates because the frame is very large and the bandwidth is small; the router delays are negligible here.</p>
${END}`});

Q({id:'c12',marks:10,topic:'tcpip',tags:['ppt'],q:'Explain the Application layer and the Network Access layer of TCP/IP. Mention at least four protocols/technologies of each with their uses. Also explain the functions of the Internet layer and the role of routers.',
ans:`[[fig:osivstcp]]
${H('Application layer (top layer, closest to users)')}
<p><b>Purpose:</b> provides network services to applications so that browsers, e-mail clients and file-transfer apps can communicate over the network. <b>Functions:</b> interface for users to use network services; supports protocols for web browsing, e-mail, file transfer and remote login; handles data formatting, encryption and compression (merged with OSI's Presentation layer).</p>
${T(['Protocol','Use'],[['HTTP','Web browsing – opening websites'],['HTTPS','Encrypts web traffic for secure browsing'],['FTP','Transfers files between computers'],['SMTP','Sends e-mails'],['IMAP / POP3','Retrieves e-mails from servers'],['DNS','Converts website names (google.com) into IP addresses']])}
<p>Example: when you type www.google.com, DNS translates it to an IP address, then HTTP/HTTPS fetches the page.</p>
${H('Network Access layer')}
<p><b>Purpose:</b> physically transmits data over different media (Ethernet cables, Wi-Fi, fibre). <b>Functions:</b> encapsulation (packets → frames), MAC addressing (identifies devices), error detection and correction, defines the physical medium (wired or wireless).</p>
${T(['Technology','Use'],[['Ethernet (IEEE 802.3)','Wired LANs'],['Wi-Fi (IEEE 802.11)','Wireless networks'],['Bluetooth','Short-range wireless communication'],['PPP','Direct connection between two devices']])}
${H('Internet layer and routers')}
<p><b>Purpose:</b> logical addressing (IP addresses) and routing packets across different networks. <b>Functions:</b> logical addressing – a unique IP address for each device; routing – finding the best path across networks; packet forwarding – moving packets from one network to another using routers. <b>Protocols:</b> IP (addresses and routes packets), ICMP (diagnostics – ping), ARP (IP → MAC), RIP and OSPF (routing protocols that help routers find the best path). <b>Role of routers:</b> they read the destination IP address and forward each packet toward its destination network on the best route (a WhatsApp message reaches your friend even on a different network).</p>
${END}`});

Q({id:'d1',marks:16,topic:'osi',tags:['ppt'],q:'Explain the OSI reference model in detail with a neat diagram: the function of each layer, the data unit (PDU) at each layer, protocols and real-life examples, and how data is encapsulated from sender to receiver.',
ans:`${H('Introduction')}
<p>The Open Systems Interconnection (OSI) model is an ISO standard (ISO/IEC 7498, 1984) that divides network communication into 7 layers. Each layer does a specific job and talks only to the layers directly above and below it, so hardware, software and protocols can be developed independently. Benefits: modular design, standard communication between vendors, and troubleshooting layer by layer.</p>
[[fig:osi]]
${H('Layer by layer')}
${T(['#','Layer','PDU','Function','Example'],[
['1','Physical','Bit','Transmits raw bits over cables, connectors, voltages, data rates; defines electrical/optical/radio signals and the physical topology (1 = voltage, 0 = no voltage)','"The road the data drives on" – Ethernet cable, fibre, Wi-Fi radio; Ethernet PHY, USB, Bluetooth, DSL, RS-232'],
['2','Data Link','Frame','Groups bits into frames with MAC addresses; detects/corrects errors with CRC; controls access to a shared medium (CSMA/CD, CSMA/CA)','"Traffic rules": MAC = number plate; a switch forwards by it; Ethernet, Wi-Fi 802.11, PPP, ARP'],
['3','Network','Packet','Logical IP addressing; routing – best path from source to destination; fragmentation and reassembly','"Postal service": IP = home address; routers = post offices; IP, ICMP, OSPF, BGP'],
['4','Transport','Segment','End-to-end delivery between applications using ports; segmentation and reassembly in order; flow, error and congestion control; TCP reliable / UDP fast','"Courier with tracking": TCP registered post, UDP postcard; TCP, UDP'],
['5','Session','Data','Establishes, manages and terminates sessions; checkpoints to resume long transfers; dialog control','"A phone call": dial, talk, hang up; NetBIOS, RPC, SIP, PPTP'],
['6','Presentation','Data','Translation (ASCII/Unicode), encryption/decryption, compression (ZIP, JPEG, MP3)','"Translator and a safe": the HTTPS padlock; SSL/TLS, JPEG, MPEG'],
['7','Application','Data','Network services to user software: file transfer, e-mail, web, name resolution, remote login','"The apps you use": browser HTTP, mail SMTP/IMAP, FTP, DNS, DHCP']])}
<p>Mnemonics: top→bottom "Please Do Not Throw Sausage Pizza Away"; bottom→top "All People Seem To Need Data Processing".</p>
${H('Encapsulation and data flow')}
[[fig:encap]]
<p>At the sender the data goes down the layers: the transport layer adds its header (ports, sequence numbers) making a segment; the network layer adds IP addresses making a packet; the data link layer adds MAC addresses and a CRC trailer making a frame; the physical layer sends the frame as bits. Each header is read by the same layer at the other end. A router on the way looks only up to layer 3 (reads the IP header, chooses the path, builds a new frame). At the receiver the headers are removed in reverse order until the application gets the original data.</p>
${H('Summary')}
<p>Layers 1–3 move data across the network, layer 4 guarantees end-to-end delivery, layers 5–7 serve the user's software. Even though real networks run TCP/IP, OSI is the common language for designing and debugging networks.</p>
${END}`});

Q({id:'d2',marks:16,topic:'guided',tags:['ppt'],q:'What is transmission media? Classify it with examples. Explain the construction, working, advantages, disadvantages and applications of twisted pair, coaxial and optical fibre cables with neat diagrams, and compare guided with unguided media.',
ans:`${H('Transmission media')}
<p>A <b>transmission medium</b> is the physical path between the transmitter and the receiver – the channel through which data is sent, as electromagnetic signal waves. <b>Classification:</b> <b>guided media</b> use physical cables (twisted pair, coaxial, fibre optic); <b>unguided media</b> use wireless signals (radio waves, microwaves, infrared).</p>
${H('1. Twisted-pair cable')}
[[fig:utp]]
<p><b>Construction:</b> two insulated copper wires twisted around each other; several pairs bundled in a sheath; UTP has no shield, STP has a foil/braid shield. <b>Working:</b> twisting reduces interference between the wires and from outside. <b>Advantages:</b> low cost, high speed, easy to install (UTP); better noise protection (STP). <b>Disadvantages:</b> open to interference and short distance (UTP); expensive and hard to install (STP). <b>Applications:</b> telephone lines, Ethernet LANs (Cat5/Cat6), industrial Ethernet (STP).</p>
${H('2. Coaxial cable')}
[[fig:coax]]
<p><b>Construction:</b> copper centre conductor, dielectric insulator (PE/Teflon), braided outer conductor (shield), plastic jacket. <b>Working:</b> the signal travels on the centre conductor; the shield blocks interference and acts as the return path; baseband or broadband modes. <b>Advantages:</b> easy to install and extend, high bandwidth, less expensive than fibre, less noise. <b>Disadvantages:</b> one cable failure can disturb the network, bulky, expensive over long distances, not for very high speeds. <b>Applications:</b> cable TV, broadband Internet, CCTV, short-distance networking.</p>
${H('3. Optical fibre cable')}
[[fig:fiber]]
<p><b>Construction:</b> glass core, cladding of lower refractive index, protective coating, buffer, Kevlar strength members, outer jacket. <b>Working:</b> light signals are kept inside the core by total internal reflection; can be unidirectional or bidirectional (WDM). <b>Advantages:</b> very high bandwidth, lightweight, negligible attenuation, fastest transmission, immune to EMI, secure. <b>Disadvantages:</b> very costly, hard to install and maintain, fragile, one fibre is one-way. <b>Applications:</b> high-speed Internet (FTTH), telecom and data centres, undersea cables, medical imaging, military.</p>
${H('Comparison of the three')}
[[fig:mediacompare]]
${H('Guided vs unguided media')}
${T(['Aspect','Guided media','Unguided media'],[['Transmission path','Physical cables / wires','Wireless signals'],['Bandwidth','High (especially fibre)','Moderate to high'],['Range','Limited by cable length','Long range (radio waves)'],['Cost','Moderate to high','Low to moderate'],['Interference','Low (except twisted pair)','Susceptible'],['Mobility','None','Supports mobile users'],['Applications','Office Ethernet, cable TV, Internet backbone','Wi-Fi, satellite TV/GPS, remote controls']])}
<p><b>Conclusion:</b> the choice depends on speed, bandwidth, distance, cost and the network's needs: UTP for desks, fibre for backbones and long distance, wireless for mobility.</p>
${END}`});

Q({id:'d3',marks:16,topic:'csma',tags:['ppt'],q:'Explain CSMA, CSMA/CD and CSMA/CA with flowcharts. Discuss the persistence methods, binary exponential backoff, the hidden-node problem and RTS/CTS. Differentiate CSMA/CD from CSMA/CA and explain why modern switched Ethernet does not need CSMA/CD.',
ans:`${H('1. CSMA')}
<p>When many devices share one medium, two may transmit at once and collide. CSMA (Carrier Sense Multiple Access) makes a station sense the medium first: carrier sensing → wait if busy → transmit if idle → handle collisions → random backoff and retry. Collisions can still happen because signals take time to propagate, so two distant stations may both see an idle channel.</p>
[[fig:persist]]
<p><b>Persistence methods:</b> 1-persistent – keep sensing, send immediately when idle (Ethernet; lowest delay, most collisions). Non-persistent – if busy wait a random time, sense again (fewer collisions, more delay). p-persistent – when idle send with probability p, else wait a slot (balanced; wireless LANs, IoT).</p>
${H('2. CSMA/CD (Ethernet)')}
[[fig:csmacd]]
<p>On a shared wire a station can listen while it transmits. Steps: sense → start transmitting → keep monitoring → on collision stop immediately → send a <b>jam signal</b> so all stations notice → wait a random backoff → retry. <b>Binary exponential backoff:</b> after each repeated collision the range of random waiting times becomes larger, so the same stations are unlikely to collide again and again.</p>
${H('3. CSMA/CA (Wi-Fi)')}
[[fig:csmaca]]
<p>A wireless station cannot detect collisions: its own signal is far stronger than an incoming one, and hidden terminals exist. So 802.11 avoids collisions: sense → if idle wait a random backoff before sending → optional <b>RTS/CTS</b> to reserve the medium → send data → receiver sends <b>ACK</b>; no ACK means collision, so back off and retry.</p>
[[fig:hidden]]
<p><b>Hidden-node problem:</b> A and B both reach the AP but cannot hear each other, so both may send together and collide at the AP. <b>RTS/CTS:</b> the sender's RTS asks to reserve the medium; the AP's CTS is heard by all nearby stations, which defer for the announced duration. Benefit: fewer hidden-node collisions; cost: control-frame overhead.</p>
${H('4. CSMA/CD vs CSMA/CA')}
${T(['Aspect','CSMA/CD','CSMA/CA'],[['Collision handling','Detects collisions during transmission','Avoids collisions before transmission'],['Used in','Wired networks (Ethernet)','Wireless networks (Wi-Fi)'],['Method','Listen → transmit → detect collision → backoff','Listen → wait (backoff) → RTS/CTS → transmit'],['Extra signals','Jam signal after collision','RTS/CTS to reserve the channel'],['Acknowledgment','Not always used','ACK usually used'],['Efficiency','Higher in low-traffic wired networks','Better in wireless with interference']])}
${H('5. Why switched Ethernet needs no CSMA/CD')}
<p>CSMA/CD was needed only because many stations shared one cable. In a modern switch each device has its own full-duplex point-to-point link: separate wire pairs carry data in each direction, so device and switch can send at the same time without interfering, and each port is its own collision domain with just two ends. With no shared medium there can be no collision, so sensing, detection, jamming and backoff are not needed and the full bandwidth is available both ways.</p>
${END}`});

Q({id:'d4',marks:16,topic:'errorctl',tags:['ppt'],q:'What is error detection and what causes errors? Explain the types of errors and the use of redundancy. Describe simple parity, two-dimensional parity, checksum and CRC with one solved example each, stating what each can and cannot detect. Briefly explain Hamming distance.',
ans:`${H('Error detection, causes and types')}
<p><b>Error detection</b> is the process of identifying errors that occur during data transmission. <b>Causes:</b> noise, signal attenuation, interference, hardware malfunctions. <b>Types:</b> <b>single-bit error</b> – only one bit is changed; <b>burst error</b> – two or more bits are changed in a sequence. <b>Redundancy:</b> extra bits are added to the data to carry the information needed to detect (and sometimes correct) errors. Methods: simple parity, two-dimensional parity, checksum, CRC.</p>
${H('1. Simple parity check')}
[[fig:parity]]
<p>Add one bit so the number of 1s is even (even parity): data 1101011 (five 1s) → parity 1 → 11010111. The receiver counts the 1s; odd ⇒ error. <b>Detects</b> single-bit errors (any odd number). <b>Cannot detect</b> an even number of errors (burst errors), cannot locate or correct, no idea of the position; simple and cheap with one extra bit.</p>
${H('2. Two-dimensional parity')}
[[fig:twodparity]]
<p>Parity for every row and every column. Lecture example: in the received 4×4 block, row 3 and column 4 both fail, so bit (3,4) is wrong (0 → should be 1) and the receiver flips it. <b>Detects</b> and <b>corrects</b> single-bit errors and detects most multi-bit errors.</p>
${H('3. Checksum')}
[[fig:checksum]]
<p>Add the data words with 1's complement arithmetic (carry added back), complement the sum = checksum. Example: 10101001 + 00111001 = 11100010 → checksum 00011101; receiver adds all three → 11111111 → complement 0 ⇒ no error. <b>Detects</b> most errors; <b>cannot detect</b> errors that cancel out in the sum.</p>
${H('4. CRC')}
[[fig:crc]]
<p>Append k−1 zeros, divide by the k-bit key with modulo-2 (XOR) division, remainder = CRC, codeword = data + CRC. Example: data 100100, key 1101 → remainder 001 → send 100100001; receiver divides and gets 000 ⇒ no error; 100000001 would give a non-zero remainder ⇒ error. The CRC length equals the degree of the generator polynomial. CRC detects single-bit errors, odd errors and burst errors up to the polynomial degree, and is used in Ethernet (CRC-32) and storage.</p>
${H('5. Hamming distance')}
<p>The number of positions in which two equal-length binary strings differ (count the 1s in their XOR). Example: 10110010 vs 10010011 → differ at positions 3 and 8 → distance 2. It is used in error detection and correction: a code with minimum distance d detects d−1 errors and corrects (d−1)/2 errors. Forward error correction methods such as Hamming code and Reed-Solomon are the way to improve error correction at the data link layer (lecture case).</p>
${END}`});

Q({id:'d5',marks:16,topic:'devices',tags:['ppt'],q:'Explain repeater, hub, bridge, switch, router, gateway and access point with their OSI layer, working and a situation where each is the right choice. Explain collision domain and broadcast domain with respect to these devices.',
ans:`[[fig:devices]]
${H('Devices')}
<p><b>Repeater (L1)</b> – regenerates weak signals to extend distance; two ports; no addresses. <i>Use:</i> a long cable whose signal becomes weak (two 100 m runs joined); Wi-Fi extender for the garden.</p>
<p><b>Hub (L1)</b> – multi-port repeater; every signal is copied to all ports; shared, half-duplex. <i>Use:</i> a temporary demo network where speed and security do not matter; otherwise replaced by switches.</p>
<p><b>Bridge (L2)</b> – connects two LAN segments, learns MAC addresses per side and forwards only cross-segment frames. <i>Use:</i> an office with two LAN segments that wants less traffic between them; wireless bridge between buildings.</p>
<p><b>Switch (L2)</b> – connects devices in a star; learns which MAC address is on which port and forwards each frame only to that port (Lecture 4). <i>Use:</i> a 30-PC lab on Gigabit Ethernet – each PC gets its own full-duplex link.</p>
<p><b>Router (L3)</b> – joins different networks; reads IP addresses, uses a routing table to choose the best path; NAT, DHCP, firewall at home. <i>Use:</i> a company LAN that must reach the Internet; two different IP networks that must exchange packets.</p>
<p><b>Gateway (up to L7)</b> – protocol translator between dissimilar systems. <i>Use:</i> a telephone system (PSTN) that must talk to Internet voice (SIP); payment or e-mail gateways.</p>
<p><b>Access Point (L2, wireless)</b> – provides wireless connectivity to stations and forwards their traffic to the wired LAN; handles authentication and association (Lecture 19). <i>Use:</i> laptops and phones need LAN/Internet access without cables.</p>
${H('Collision domain and broadcast domain')}
[[fig:hubswitch]]
<p>A <b>collision domain</b> is the set of devices that share one medium, so only one can transmit at a time and their frames can collide. A hub or repeater keeps all its ports in ONE collision domain (the lecture: "the more devices, the more collisions"). A bridge or switch <b>separates</b> collision domains – each switch port is its own domain, and a full-duplex link has no collisions at all.</p>
<p>A <b>broadcast domain</b> is the set of devices that receive a broadcast frame (destination FF:FF:FF:FF:FF:FF). Hubs, bridges and switches pass broadcasts on, so a whole switched LAN is one broadcast domain (unless divided into VLANs). Only a <b>router</b> stops broadcasts, so each router interface is a separate broadcast domain. Example: three hubs connected to a switch connected to a router with two LAN interfaces – 3 (+ other switch ports) collision domains, 2 broadcast domains. Switches reduce collisions; routers and VLANs contain broadcasts and add security.</p>
${END}`});

Q({id:'d6',marks:16,topic:'lantech',tags:['ppt'],q:'Compare Ethernet, Token Ring, FDDI and Wireless LAN in terms of standard, topology, medium, speed, medium-access method, reliability and applications. Explain CSMA/CD in Ethernet and token passing in FDDI with diagrams.',
ans:`${H('Comparison')}
${T(['Feature','Ethernet','Token Ring','FDDI','Wireless LAN'],[['Standard','IEEE 802.3','IEEE 802.5','ANSI','IEEE 802.11 (Wi-Fi)'],['Topology','Bus (old) → star with switches','Logical ring, physical star (MAU)','Dual ring','Infrastructure (AP, BSS/ESS) or ad hoc'],['Medium','Copper (UTP, coax) / fibre','Twisted pair / legacy media','Optical fibre','Radio (2.4/5/6 GHz)'],['Speed','10 Mbps → 100 Gbps','4 / 16 Mbps','100 Mbps','11 Mb/s (b) to Gb/s class (ac/ax/be)'],['Access method','CSMA/CD (shared); none on switched full-duplex','Token passing','Timed token passing','CSMA/CA with ACK, RTS/CTS'],['Collisions','Possible on shared media','None','None','Possible (hidden nodes), avoided'],['Reliability','Reliable and stable on cables','Ring break affects all unless bypassed','Very high – dual ring self-heals','Lower – interference, variable coverage'],['Applications','Virtually all LANs, data centres, backbones','Legacy LANs','1990s campus/enterprise backbones','Mobile users, classrooms, hotspots']])}
${H('CSMA/CD in Ethernet')}
[[fig:csmacd]]
<p>A device checks whether the channel is free; if free it sends its frame while listening. If two devices send at the same time a collision occurs; both detect it, stop, send a jam signal, wait a random time (binary exponential backoff – the range grows after each collision) and retry. In modern switched full-duplex Ethernet there is no shared medium, so CSMA/CD is not needed.</p>
${H('Token passing in FDDI')}
[[fig:fddi]]
<p>A token circulates; a station with data waits for it, captures it (permission to transmit), its frame travels toward the destination, the destination copies the frame, and token access continues for the other stations. The dual ring gives redundancy: if one link fails the stations wrap the primary ring onto the secondary ring and the network keeps working. FDDI = fibre + token + dual ring.</p>
[[fig:ethernetcmp]]
${H('Conclusion')}
<p>Ethernet won because of cost and simplicity, especially once switching removed collisions; token methods gave predictable access but at higher cost; Wi-Fi extends LANs to mobile users with a collision-avoidance MAC suited to radio.</p>
${END}`});

Q({id:'d7',marks:16,topic:'tcpip',tags:['ppt'],q:'Explain the TCP/IP model in detail: its four layers with functions and protocols, how data travels when a user sends an e-mail or opens a website (with a diagram), and the XylonTech case: which layer causes file corruption, why TCP is not ideal for VoIP, and which layer to check for connection timeouts.',
ans:`${H('The TCP/IP model')}
<p>TCP/IP is the standard protocol suite used for communication over the Internet – a simpler, practical version of the OSI model with four layers.</p>
[[fig:osivstcp]]
<p><b>Application layer</b> – services to applications; user interface to the network; web, e-mail, file transfer, remote login; formatting, encryption, compression. Protocols: HTTP, HTTPS, FTP, SMTP, IMAP/POP3, DNS.</p>
<p><b>Transport layer</b> – reliable communication: segmentation, flow control, error handling, multiplexing. Protocols: TCP (reliable – web, mail, files), UDP (fast – video calls, gaming, streaming).</p>
<p><b>Internet layer</b> – logical addressing and routing: unique IP address per device, best path, packet forwarding by routers. Protocols: IP, ICMP (ping), ARP (IP → MAC), RIP/OSPF.</p>
<p><b>Network Access layer</b> – physical transmission: encapsulation into frames, MAC addressing, error detection, the medium. Technologies: Ethernet 802.3, Wi-Fi 802.11, Bluetooth, PPP.</p>
${H('How data travels: sending an e-mail / opening a website')}
[[fig:encap]]
<ol><li><b>Application layer</b> – Gmail formats the e-mail with SMTP (or the browser asks DNS for the IP of www.google.com and uses HTTP/HTTPS).</li><li><b>Transport layer</b> – TCP breaks the data into packets, numbers them, and handles error detection and retransmission.</li><li><b>Internet layer</b> – each packet gets source and destination IP addresses; IP and the routers choose the best path.</li><li><b>Network Access layer</b> – packets become electrical signals or radio waves on Ethernet, Wi-Fi or fibre.</li></ol>
<p>At the receiver the process is reversed, rebuilding the original e-mail or web page.</p>
${H('XylonTech case')}
<ol><li><b>File corruption / partial files</b> → the <b>Transport layer</b>, which is responsible for reliable transfer, error detection, retransmission and ordering. If TCP is used it should correct this; corruption suggests TCP is bypassed by an unreliable protocol like UDP (the Application layer may also mishandle data after delivery).</li><li><b>VoIP latency and dropped packets</b> → TCP is not ideal because its connection set-up, error correction and retransmission add latency, and real-time voice needs timely delivery more than perfect delivery. Use <b>UDP</b>, defined at the Transport layer: faster, no connection overhead, and some packet loss is tolerable.</li><li><b>"Connection timeout" errors</b> → analyse the <b>Network (Internet) layer</b>, responsible for routing and addressing: packets not reaching the destination cause timeouts. Tools: ping (connectivity), traceroute (where packets are dropped), Wireshark (packet inspection).</li></ol>
${END}`});

 ['r3','The NETWORK layer adds its header NH (source and destination IP addresses) → packet.'],
 ['r4','The DATA LINK layer adds a header DH (MAC addresses) and a trailer DT (CRC) → frame.'],
 ['r5','The PHYSICAL layer sends the frame as bits/signals. The receiver removes the headers in reverse order (decapsulation).']]},
utp:{draw:'Left: four twisted pairs inside a jacket labelled UTP. Right: the same with a shield layer labelled STP. Note 100 m, RJ-45.',steps:[
 ['utp','UTP – Unshielded Twisted Pair: two insulated copper wires twisted around each other; several pairs in one plastic jacket; no shield.'],
 ['utppairs','Twisting makes outside noise hit both wires equally, so it cancels out (less interference and crosstalk).'],
 ['utp','UTP: low cost, high speed, easy to install, used for Ethernet and telephones. Weakness: open to interference, short distance (~100 m).'],
 ['stpshield','STP – Shielded Twisted Pair: a metal foil or braid jacket around the pairs blocks outside interference.'],
 ['stp','STP: higher speed and no crosstalk, used for high-data-rate Ethernet and telephone data channels. Weakness: expensive, hard to install, must be grounded.']]},
coax:{draw:'A stripped cable end showing four layers with labels: copper core, dielectric insulator, braided shield, plastic jacket.',steps:[
 ['core','The INNER COPPER CORE carries the signal.'],
 ['dielectric','The DIELECTRIC INSULATOR (PVC or Teflon) keeps the core in the middle and separated from the shield.'],
 ['shield','The BRAIDED OUTER CONDUCTOR works as the return path and as a SHIELD against electromagnetic interference.'],
 ['jacket','The PLASTIC JACKET protects everything. Used for cable TV at home, older Ethernet, CCTV. Modes: baseband (one channel) and broadband (bandwidth split into channels).']]},
fiber:{draw:'A stripped fibre end: jacket, buffer/Kevlar, cladding, thin glass core; a zig-zag light ray inside the core. Label "total internal reflection".',steps:[
 ['core','The GLASS CORE carries the data as light pulses (light on = 1, off = 0).'],
 ['cladding','The CLADDING is a less dense glass/plastic layer; light hitting it is reflected back into the core.'],
 ['ray','The zig-zag ray is TOTAL INTERNAL REFLECTION: the light never leaves the core, so very little is lost and signals go a long way.'],
 [['buffer','jacket'],'Buffer, Kevlar and jacket protect the fibre. Fibre has the highest bandwidth, lightest weight, almost no attenuation and no interference; but it is costly, fragile, hard to install, and one fibre is one-way.']]},
mediacompare:{draw:'Write a table: Parameter / Twisted pair / Coaxial / Fibre with rows data rate, attenuation, cost, noise.',steps:[
 ['tp','TWISTED PAIR: data rate 10 Mbps–10 Gbps for short runs, high attenuation (about 100 m), cheapest, most affected by noise (EMI, crosstalk).'],
 ['coax','COAXIAL: higher bandwidth than twisted pair, moderate attenuation (about 500 m), moderate cost, low noise because of the shield.'],
 ['fiber','OPTICAL FIBRE: Gbps to Tbps, very low attenuation (many km), most expensive, no noise at all because it carries light.']]},
unguided:{draw:'Three panels: a tower with rings (radio), two towers with a double arrow (microwave), remote → TV (infrared). Write the frequency range above each.',steps:[
 ['radio','RADIO WAVES (3 kHz–1 GHz): go out in all directions and pass through walls; long range. Used for Wi-Fi, Bluetooth, AM/FM radio. Weakness: interference from other signals.'],
 ['micro','MICROWAVES (1–300 GHz): travel in a straight line, so the two antennas need LINE OF SIGHT; high bandwidth, long distance. Used for satellite and mobile networks. Weakness: blocked by obstacles, affected by rain.'],
 ['ir','INFRARED (300 GHz–400 THz): only a few metres, cannot pass through walls (so it is private and interference-free). Used in remote controls. Weakness: short range, needs line of sight.']]},
impair:{draw:'Three small waves: one shrinking (attenuation), one changed shape (distortion), one with jagged noise.',steps:[
 ['att','ATTENUATION: the signal loses energy as it travels, so its strength drops with distance. Fixed with amplifiers/repeaters.'],
 ['dist','DISTORTION: the shape of the signal changes, because different frequency parts travel at different speeds and arrive at different times.'],
 ['noise','NOISE: unwanted signals get added to the data while it travels on the medium (thermal, induced, crosstalk, impulse).']]},
dllsub:{draw:'Stacked boxes: Network layer on top, then LLC and MAC (together = Data Link layer), Physical layer at the bottom.',steps:[
 ['net','The NETWORK layer above hands packets down to the data link layer.'],
 ['llc','LLC – Logical Link Control: the upper part of the data link layer; it does flow control and error control and talks to the network layer.'],
 ['mac','MAC – Medium Access Control: the lower part; it adds physical (MAC) addresses and decides who may use a shared medium (CSMA/CD, CSMA/CA, token passing).'],
 ['phy','The PHYSICAL layer below sends the frame as bits. So the data link layer turns a raw bit stream into reliable frames.']]},
framing:{draw:'Seven boxes in a row with name and size: Preamble 7 | SFD 1 | Dest MAC 6 | Src MAC 6 | Length/Type 2 | Data 46–1500 | CRC 4. Note min 64 / max 1518 bytes.',steps:[
 ['pre','PREAMBLE (7 bytes of 10101010…) + SFD (1 byte): help the receiver sync its clock and mark where the frame starts.'],
 ['addr','DESTINATION MAC and SOURCE MAC (6 bytes each): who the frame is for and who sent it.'],
 ['len','LENGTH / TYPE (2 bytes): how many data bytes, or which upper protocol is inside (e.g. IPv4).'],
 ['data','DATA + PAD (46–1500 bytes): the packet from the network layer; small data is padded so the frame is at least 64 bytes.'],
 ['crc','CRC (4 bytes): error-check value computed on the frame; if it does not match, the frame is dropped.'],
 ['size','Minimum frame 64 bytes, maximum 1518 bytes (without the preamble).']]},
bitstuff:{draw:'Write the data bits, then the stuffed bits with the inserted 0s underlined, then FLAG | stuffed data | FLAG with flag = 01111110.',steps:[
 ['data','The DATA contains runs of 1s. The flag pattern 01111110 must never appear inside the data, or the receiver would think the frame ended.'],
 ['inserted','RULE: after every five 1s in a row the sender inserts a 0 (shown in colour), whatever the next bit is.'],
 ['stuffed','This is the STUFFED data. The receiver removes any 0 that comes right after five 1s, so the original data is restored.'],
 [['flag','frame'],'The FRAME is flag + stuffed data + flag. Used in bit-oriented protocols such as HDLC.']]},
parity:{draw:'Seven data-bit boxes then a separate parity-bit box. Show the count of 1s and the rule. Write what it can and cannot detect.',steps:[
 ['data','The DATA 1101011 has five 1s – an odd number.'],
 ['parity','EVEN PARITY: add a 1 so the total number of 1s becomes six (even). (If the count were already even, add 0.)'],
 ['count','The receiver counts the 1s. Even ⇒ accept. If one bit flips the count becomes odd ⇒ error DETECTED. Works for any odd number of errors.'],
 ['miss','If two bits flip the count is still even ⇒ the error is MISSED. Parity cannot detect an even number of errors, cannot find where the error is, and is weak for burst errors.']]},
crc:{draw:'Write the long division with XOR step by step, box the remainder, then codeword = data + CRC. Give the generator in binary and polynomial form.',steps:[
 ['generator','The GENERATOR (divisor) is 1101 = x³ + x² + 1. It has k = 4 bits, so the CRC will have k − 1 = 3 bits.'],
 ['division','Step 1: add three 0s to the data 100100 → 100100000. Step 2: divide by 1101 using modulo-2 (XOR) division: when the leading bit is 1, XOR with 1101; when it is 0, XOR with 0000; then bring down the next bit.'],
 ['division','Step 3: the REMAINDER after the last bit is 001 – that is the CRC.'],
 ['codeword','Step 4: CODEWORD = data + CRC = 100100 001 = 100100001 (6 + 3 = 9 bits).'],
 ['check','Receiver: divide the received codeword by 1101 again. Remainder 000 ⇒ no error; any other remainder ⇒ error, discard the frame.']]},
stopwait:{draw:'Two vertical lines (Sender, Receiver). Arrows: Frame 0 →, ← ACK, Frame 1 → lost (✗), timeout, Frame 1 again →, ← ACK.',steps:[
 ['f0','The SENDER sends FRAME 0 and then stops: it may not send another frame until an acknowledgement comes back.'],
 ['ack0','The RECEIVER checks the frame and sends an ACK. Only now can the sender continue. The link was idle during the whole round trip.'],
 ['lost','FRAME 1 is lost (or arrives damaged and is discarded).'],
 ['timer','No ACK arrives, so the sender’s TIMER runs out.'],
 ['resend','The sender sends FRAME 1 again and this time gets its ACK. Simple, but slow: only one frame is in flight at a time.']]},
slidingwindow:{draw:'A row of numbered frames 0–11; a bracket around frames 3–6 labelled window W = 4; captions: ACKed / outstanding / not yet allowed; an arrow showing the window sliding right.',steps:[
 ['acked','Frames 0–2 were sent and already ACKNOWLEDGED.'],
 ['window','The WINDOW (W = 4) covers frames 3–6: the sender may send all of these without waiting for an ACK.'],
 ['notyet','Frames 7 onward are outside the window – not allowed yet.'],
 ['slide','When the ACK for frame 3 arrives the window SLIDES right and frame 7 becomes allowed. Many frames in flight ⇒ much better use of the link than stop-and-wait.']]},
maccat:{draw:'Root box "Multiple-access protocols" with three children: Random access, Controlled access, Channelization; list the methods under each.',steps:[
 ['root','When many stations share one medium, a MULTIPLE-ACCESS protocol decides who may send and when.'],
 ['random','RANDOM ACCESS: any station may send when it wants, so collisions can happen and must be handled: ALOHA, CSMA, CSMA/CD (Ethernet), CSMA/CA (Wi-Fi).'],
 ['controlled','CONTROLLED ACCESS: a station sends only when it is allowed: reservation, polling (a primary asks each station in turn), token passing (Token Ring, FDDI). No collisions.'],
 ['channel','CHANNELIZATION: the bandwidth is divided among stations by frequency (FDMA), by time (TDMA) or by code (CDMA).']]},
csmacd:{draw:'Flowchart: frame ready → channel idle? (no: wait) → transmit and listen → collision? (no: done) → yes: jam signal → random backoff → sense again; after 16 tries abort.',steps:[
 ['ready','1 A frame is ready to send.'],
 ['sense','2 CARRIER SENSING: listen to the channel. Busy? wait. Idle? go ahead.'],
 ['transmit','3 TRANSMIT and keep LISTENING: compare what is on the wire with what you are sending.'],
 ['collision','4 COLLISION? If the signal differs, another station sent at the same time.'],
 ['done','5 No collision ⇒ the frame is sent successfully.'],
 ['jam','6 Collision ⇒ stop at once and send a JAM SIGNAL so that every station notices the collision.'],
 ['backoff','7 BINARY EXPONENTIAL BACKOFF: wait a random time (the range doubles after each collision), then sense again.'],
 ['abort','8 After 16 failed attempts the frame is dropped.']]},
csmaca:{draw:'Two vertical lines (Station A, AP). Arrows in order: RTS →, ← CTS, DATA →, ← ACK. Note backoff before RTS and that other stations keep quiet.',steps:[
 ['sta','Station A senses the channel. If idle it waits a short time (DIFS) plus a random BACKOFF before doing anything – this avoids collisions.'],
 ['rts','A sends RTS (Request To Send), a short frame that says how long it needs the medium.'],
 ['cts','The AP replies CTS (Clear To Send). Every station that hears it (including hidden ones) sets its NAV and stays quiet.'],
 ['data','A sends the DATA frame.'],
 ['ack','The AP returns an ACK. If no ACK comes, A assumes a collision, doubles its backoff range and tries again. Used by Wi-Fi because wireless cannot detect collisions.']]},
persist:{draw:'Three columns: 1-persistent (busy: keep sensing → idle: send now → collision: backoff), Non-persistent (busy: random wait → sense again → idle: send), p-persistent (idle: send with p → else next slot → busy: keep sensing).',steps:[
 ['one','1-PERSISTENT: keep sensing while busy; the moment the channel is idle, send (probability 1). Lowest delay, but all waiting stations send together → most collisions. Used by Ethernet.'],
 ['non','NON-PERSISTENT: if busy, wait a random time, then sense again; if idle, send. Fewer collisions, but the channel can stay idle while stations wait → more delay.'],
 ['pp','p-PERSISTENT: when idle, send with probability p; otherwise wait for the next slot and try again. Balances delay and collisions; used in slotted channels.']]},
hidden:{draw:'Two overlapping circles (ranges of A and C) with the AP in the overlap and A, C at the outer edges. Arrows from both to the AP: collision.',steps:[
 ['rangeA','Station A can reach the AP, but its signal does not reach station C.'],
 ['rangeC','Station C can also reach the AP, but cannot hear A. A and C are HIDDEN from each other.'],
 ['collide','Both sense an idle channel and send at the same time ⇒ the frames collide at the AP. Neither sender notices – that is why Wi-Fi cannot use collision detection.'],
 ['why','Solution: RTS/CTS. The CTS from the AP is heard by both A and C, so C waits while A sends.']]},
tokenring:{draw:'A ring with 5 nodes, a direction arrow and a token; beside it list the six token-passing steps. Note IEEE 802.5, 4/16 Mbps.',steps:[
 ['token','1 A free TOKEN circulates around the ring while nobody is sending.'],
 ['sender','2 Station A has data: it captures the token and marks it busy.'],
 ['frame','3 A changes the token into a frame with addresses and data; every station passes the frame along.'],
 ['dest','4 The destination C recognises its address and copies the frame.'],
 ['sender','5 The frame comes back to A, which removes it from the ring.'],
 ['token','6 A releases a new free token so the next station can send. Deterministic, no collisions. IEEE 802.5, 4/16 Mbps, physical star via MAU.']]},
fddi:{draw:'Left: two rings with opposite arrows (primary, secondary) and station boxes. Right: the same with a break and the two rings joined (wrapped) at the stations beside the break.',steps:[
 ['normalp','Normal operation: the PRIMARY ring carries the data at 100 Mbps in one direction (token passing on fibre).'],
 ['normals','The SECONDARY ring runs the opposite way and normally idles as a backup path. Dual-attachment stations connect to both rings.'],
 ['break','A cable break cuts both rings at one point.'],
 ['wrap','The stations on either side of the break WRAP the primary ring onto the secondary, making one longer ring that goes around the fault. The network keeps working (fault tolerance). FDDI = Fiber + token + dual ring.']]},
wlan:{draw:'A line labelled Distribution system; two APs hanging from it, each with stations around it (BSS); a dashed box around both labelled ESS. Separately three laptops joined directly = ad hoc (IBSS).',steps:[
 ['ds','The DISTRIBUTION SYSTEM (the wired LAN / Ethernet backbone) connects the access points together and to the Internet.'],
 ['bss1','A BSS (Basic Service Set) = one ACCESS POINT plus the stations connected to it. Stations talk through the AP – this is INFRASTRUCTURE mode.'],
 ['ess','Two or more BSSs joined by the DS, with the same SSID, form an ESS (Extended Service Set). A user can ROAM from one AP to the next.'],
 ['adhoc','AD HOC mode (IBSS): no AP; stations talk directly with each other. Good for small temporary networks; no Internet access.']]},
switching:{draw:'Three small networks of 4–5 nodes between A and B. Circuit: a highlighted dedicated path. Message: one whole message stored at a node. Packet: small packets on different links.',steps:[
 ['circuit','CIRCUIT SWITCHING: a dedicated path is set up first (setup), then data flows along it (transfer), then it is released (teardown). Like a telephone call. Fixed delay, but capacity is wasted when idle.'],
 ['message','MESSAGE SWITCHING: no path is reserved. Each node stores the WHOLE message and forwards it when a link is free (store-and-forward). Like a telegraph. Big storage and long delays.'],
 ['packet','PACKET SWITCHING: the message is cut into small packets; each packet is stored and forwarded on its own, several at once on different links, then put together at B. The Internet works this way.']]},
vcdatagram:{draw:'Two copies of a small network between A and B. Left: two different highlighted paths (datagram). Right: one highlighted path (virtual circuit).',steps:[
 ['dgpath','DATAGRAM (connectionless): each packet carries the full address and is routed on its own, so packets may take different paths.'],
 ['dg','No setup; packets may arrive out of order or be lost; routers keep no connection state; if a link fails later packets go another way. Used by IP.'],
 ['vcpath','VIRTUAL CIRCUIT (connection-oriented): a setup phase chooses ONE path, and every packet follows it in order.'],
 ['vc','Packets carry only a short circuit number; resources can be reserved; if a switch fails the circuit must be set up again. Used by ATM, Frame Relay, MPLS.']]},
macaddr:{draw:'Six boxes with hex pairs (00:1A:2B:3C:4D:5E); bracket the first three as OUI (vendor) and the last three as device number. Below: a switch with two PCs and its MAC table.',steps:[
 ['oui','A MAC address is 48 bits = 6 bytes = 12 hex digits. The first 3 bytes are the OUI – the vendor code given by IEEE.'],
 ['nic','The last 3 bytes are chosen by the vendor, so every network card in the world has a unique address.'],
 ['table','The SWITCH learns which MAC is on which port (from the source address of frames) and keeps a MAC table.'],
 ['frame','A frame for …9F is sent only out of port 2. PC2’s card sees its own address and accepts the frame; other cards ignore it. FF:FF:FF:FF:FF:FF = broadcast to everyone.']]},
ethernetcmp:{draw:'Three small models with a label plate each: Ethernet (switch + PCs), Token Ring (ring + token), FDDI (double ring). Write access method, speed, medium.',steps:[
 ['eth','ETHERNET (IEEE 802.3): contention access with CSMA/CD on a shared cable; today a switched star with no collisions; 10 Mbps up to 100 Gbps; UTP, coax or fibre. The most common LAN.'],
 ['tr','TOKEN RING (IEEE 802.5): token passing on a logical ring (physical star through a MAU); 4 or 16 Mbps; no collisions, fair turns; now obsolete.'],
 ['fddi','FDDI (ANSI): timed token passing on a DUAL fibre ring; 100 Mbps; up to 200 km; self-healing by wrapping the rings; used as a campus backbone in the 1990s.']]},
flowcong:{draw:'Left: fast sender → slow receiver with a feedback arrow "send only W frames". Right: three senders → one router (queue) → receiver, caption "queue fills, packets dropped".',steps:[
 ['fast','FLOW CONTROL is about one FAST SENDER and one SLOW RECEIVER.'],
 ['window','The receiver tells the sender how much it may send ("only W frames, then wait for my ACK") so the receiver’s buffer never overflows.'],
 ['senders','CONGESTION CONTROL is about the NETWORK: many senders push more traffic than a router or link can carry.'],
 ['queue','The router’s queue fills up, delay grows and packets are dropped. Even a ready receiver cannot stop this – the senders must slow down (TCP congestion window). Flow control = receiver problem; congestion control = network problem.']]},
segmented:{draw:'Tree: Internet → firewall/router → core switch → four switches with VLAN labels (servers, staff PCs, printers, guest Wi-Fi). Note the firewall rules between VLANs.',steps:[
 ['internet','The INTERNET connection comes in at one controlled point.'],
 ['fw','The FIREWALL / ROUTER decides what may enter or leave the organisation.'],
 ['core','The CORE switch routes between the segments (VLANs) and applies the rules: staff → servers and printers; guests → Internet only.'],
 ['servers','VLAN 10 – SERVERS: kept separate so only allowed traffic reaches them.'],
 ['staff','VLAN 20 – STAFF PCs: their own broadcast domain, so broadcasts and faults stay local.'],
 ['printers','VLAN 30 – PRINTERS: reachable from staff, not from guests.'],
 ['guest','VLAN 40 – GUEST Wi-Fi: isolated, Internet only. Benefits: better performance (smaller broadcast domains), security, fault containment, easier management, easy to grow.']]},
officenet:{draw:'ISP → router+firewall → core switch; branches: server-room switch (servers, printer), desktop switch (wired PCs), access point with coverage circle (laptop, phone).',steps:[
 ['router','ISP → ROUTER/FIREWALL → CORE SWITCH: the wired Gigabit backbone that everything depends on.'],
 ['serverroom','SERVER ROOM: servers and the network printer on dedicated wired ports – stable speed, low delay, data not radiated into the air.'],
 ['desks','DESKTOPS on UTP cables to a floor switch: full-duplex, no sharing, reliable, physically secure.'],
 ['wifi','ACCESS POINT (powered from the wired LAN) gives Wi-Fi with WPA3 to laptops and phones on their own VLAN – mobility where it is needed without weakening the core.'],
 ['mobile','So: mostly wired for fixed devices (speed, security, reliability) plus wireless for mobile users (ease of use).']]},
vpn:{draw:'Left to right: laptop → Wi-Fi → Internet → VPN gateway/firewall → internal web app. Shade a tunnel from laptop to gateway labelled "encrypted VPN tunnel"; note MFA and HTTPS.',steps:[
 ['laptop','The EMPLOYEE’S LAPTOP (company-managed, antivirus, disk encryption) connects to Wi-Fi secured with WPA2/WPA3.'],
 ['internet','The traffic must cross the untrusted INTERNET, where anyone could read or change it.'],
 ['tunnel','So the laptop starts a VPN: an ENCRYPTED TUNNEL (IPsec or SSL/TLS) from the laptop to the company. Wi-Fi and Internet see only scrambled data.'],
 ['gateway','The VPN GATEWAY / FIREWALL checks who is connecting: username + password + MFA code + device certificate. It then allows access only to the web application (HTTPS, port 443).'],
 ['app','The INTERNAL WEB APP itself uses HTTPS and login, so the data is protected end to end. Two gateways give reliability. This gives confidentiality, integrity, authentication and availability.']]},
standards:{draw:'List the organisations with one job each: ISO–OSI model, IEEE–802.x LAN standards, IETF–Internet RFCs, ITU-T–telecom, ANSI–USA, EIA/TIA–RS-232/cabling, W3C–web, ICANN–names and IP addresses.',steps:[
 ['iso','ISO – International Organization for Standardization (Geneva, 1947): made the OSI 7-layer model; also ISO/IEC 27001 security.'],
 ['ieee','IEEE – Institute of Electrical and Electronics Engineers: the IEEE 802 LAN standards – 802.3 Ethernet, 802.11 Wi-Fi, 802.15 Bluetooth/Zigbee, 802.16 WiMAX, 802.1Q VLAN.'],
 ['ietf','IETF – Internet Engineering Task Force: Internet protocols published as RFCs – TCP, IP, HTTP, HTTPS, FTP, SMTP, DNS, DHCP.'],
 ['itu','ITU-T – International Telecommunication Union: telephone, broadband, fibre, video conferencing and satellite standards (a UN agency).'],
 ['ansi','ANSI – American National Standards Institute: coordinates US standards and represents the USA in ISO; FDDI.'],
 ['eia','EIA / TIA: RS-232 serial interface (computer ↔ modem, printer); TIA/EIA-568 structured cabling (cable types, connectors, lengths).'],
 [['w3c','icann'],'W3C (Tim Berners-Lee, 1994): HTML, CSS, XML. ICANN (1998): domain names, IP address allocation, DNS root servers.']]},
delay:{draw:'Host A — Router — Host B; above each link write "transmission L/R", below "propagation d/v"; under the router "queuing + processing".',steps:[
 ['link1','TRANSMISSION DELAY = L/R: time to push all L bits of the frame onto the link at R bits per second. Example: 10,000 bits on 1 Mbps = 10 ms.'],
 ['link2','PROPAGATION DELAY = d/v: time for a bit to travel distance d at speed v (about 2×10⁸ m/s in a cable). Example: 3000 km → 15 ms.'],
 ['router','At the ROUTER add QUEUING delay (waiting in the buffer) and PROCESSING delay (checking the header, table lookup).'],
 [['a','b'],'Total delay = transmission + propagation + queuing + processing (for every hop). Lecture numerical: 10⁷ bits at 6 Mbps, 3000 km, 15 routers with 2 µs + 1 µs each ≈ 1.667 s + 15 ms + 45 µs.']]},
checksum:{draw:'Sender: add the two words, complement the sum = checksum. Receiver: add all three → 11111111 → complement 0 ⇒ OK. State the end-around-carry rule.',steps:[
 ['sender','SENDER: write the data as equal-size words (here two 8-bit words: 10101001 and 00111001).'],
 ['sum','Add them with 1’s complement arithmetic: if a carry comes out of the leftmost bit, add it back to the right end. Sum = 11100010.'],
 ['chk','Complement the sum (flip every bit) → CHECKSUM = 00011101. Send the data followed by the checksum.'],
 ['rcv','RECEIVER: add all words INCLUDING the checksum the same way → 11111111.'],
 ['ok','Complement of 11111111 is 00000000 ⇒ no error, accept. Any other result ⇒ error, reject. Used in IP, TCP and UDP headers.']]},
twodparity:{draw:'A 4×4 bit grid with a 5th column (row parity) and 5th row (column parity). Mark the received wrong bit, the failing row and column, and the corrected bit.',steps:[
 ['data','The DATA is written in rows (4×4 bits).'],
 ['rowp','Each ROW gets a parity bit (last column) so the row has an even number of 1s.'],
 ['colp','Each COLUMN gets a parity bit (bottom row) too, including the corner bit.'],
 ['rowfail','Received block: row 3 now has an odd number of 1s → row 3 parity FAILS.'],
 ['colfail','Column 4 also has an odd number of 1s → column 4 parity FAILS.'],
 ['error','The error is where they cross: position (3,4). It was received as 0 but should be 1.'],
 ['fix','Flip that bit back ⇒ CORRECTED without asking for retransmission. 2-D parity detects all 1-, 2- and 3-bit errors and corrects single-bit errors.']]},
distributed:{draw:'Left: one mainframe with dumb terminals. Right: a network with four nodes each doing one part of the work.',steps:[
 ['mainframe','CENTRALISED: one big mainframe does all the processing; the terminals only display. If it fails or is busy, everyone waits.'],
 ['terminals','The terminals have no processing power of their own.'],
 ['nodes','DISTRIBUTED PROCESSING: the task is divided into parts, each handled by a different computer on the network, and the results are combined.'],
 ['net','Benefits: faster (work in parallel), no single point of failure, easy to grow, data can be kept where it is used, security (each system limits what it allows). Example: client–server, cloud.']]},
arq:{draw:'Three panels of frame boxes 0–4 with frame 2 marked lost; under each show what is resent: Go-Back-N resends 2,3,4; Selective Repeat only 2; Stop-and-Wait its one frame.',steps:[
 ['gbn','GO-BACK-N: the sender has several frames in flight; frame 2 is lost. The receiver throws away 3 and 4 (it accepts only in order), so the sender goes back and resends 2, 3, 4. Simple receiver, but wasteful on noisy links.'],
 ['sr','SELECTIVE REPEAT: the receiver keeps 3 and 4 in its buffer and asks for 2 only; the sender resends just frame 2. Most efficient, but needs more buffer and logic.'],
 ['sw','STOP-AND-WAIT: one frame at a time; if it is lost, the timer expires and that single frame is resent. Simplest and slowest.']]},
};

const TOPIC_NAME=Object.fromEntries(TOPICS.map(t=>[t.id,t.title]));
