const T=(head,rows)=>`<div class="tbl"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

Q({id:'a1',marks:10,topic:'datacomm',tags:['asg'],q:'Explain how data is exchanged between two devices in a communication system. Identify the five basic components required for data communication and draw a simple labelled block diagram. Also discuss the need for communication standards and mention the major organizations responsible for developing them.',
ans:`${H('1. How data is exchanged')}
<p>Data communication is the exchange of data between two devices through a transmission medium such as a wire cable or a wireless signal. The sender changes the message into a signal (electrical, light or radio), the signal travels over the medium, and the receiver changes it back into the original data. Both devices must follow the same rules (protocol). Good data communication has four features: <b>delivery</b> (data reaches the correct destination), <b>accuracy</b> (no errors), <b>timeliness</b> (arrives in acceptable time) and low <b>jitter</b> (small variation in arrival time).</p>
${H('2. Five basic components')}
[[fig:datacomm]]
<ol><li><b>Message</b> – the information to be communicated: text, images, audio, video.</li><li><b>Sender</b> – the device that creates and sends the message: computer, smartphone, sensor.</li><li><b>Receiver</b> – the device that receives the message: computer, server, printer, mobile.</li><li><b>Transmission medium</b> – the physical path: wired (twisted pair, coaxial, fibre) or wireless (radio, microwave, infrared, satellite).</li><li><b>Protocol</b> – the set of rules that govern the communication so both devices understand the data: HTTP, FTP, TCP/IP, SMTP.</li></ol>
<p>Other supporting parts: encoder/decoder, modem/transceiver, switches and routers, topology and timing (synchronisation).</p>
${H('3. Need for standards')}
<p>Network standards are rules, protocols and guidelines that make devices and software from different companies work together. They are needed for: compatibility between vendors; reliable, error-free communication; better security and performance; global communication and Internet connectivity; and lower development cost.</p>
${H('4. Major organizations')}
<ul><li><b>ISO</b> – International Organization for Standardization: the OSI reference model.</li><li><b>IEEE</b> – Institute of Electrical and Electronics Engineers: LAN standards 802.3 Ethernet, 802.11 Wi-Fi, 802.15 Bluetooth.</li><li><b>IETF</b> – Internet Engineering Task Force: Internet protocols (TCP, IP, HTTP, SMTP, DNS) published as RFCs.</li><li><b>ITU-T</b> – International Telecommunication Union: telecom, broadband, optical and multimedia standards.</li><li><b>ANSI</b> – American National Standards Institute: coordinates US standards and represents the USA in ISO.</li><li><b>EIA / TIA</b> – RS-232 interface and TIA/EIA-568 structured cabling.</li><li><b>W3C</b> – web standards (HTML, CSS); <b>ICANN</b> – domain names and IP addresses.</li></ul>
${END}`});

Q({id:'a2',marks:10,topic:'categories',tags:['asg'],q:'Describe the major components of a computer network and explain the function of each component. Classify networks according to their geographic coverage and discuss any three categories, stating one advantage and one limitation of each.',
ans:`${H('1. Components of a computer network')}
<p>A network has these parts (Lecture 4):</p>
<ol><li><b>Nodes</b> – computers, servers, printers, smartphones, IoT devices that send and receive data.</li><li><b>Networking devices</b> – switches (send data to the right device inside the network), routers (forward packets between networks), hubs (repeat signals to all ports), access points (connect wireless devices).</li><li><b>Transmission media</b> – Ethernet cables, fibre-optic cables or wireless links that carry the signals.</li><li><b>Protocols</b> – rules such as Ethernet, TCP/IP and Wi-Fi that control how data is formatted and sent.</li><li>Also from Lecture 1: <b>encoder/decoder</b>, <b>modem/transceiver</b> and <b>timing</b> (synchronisation).</li></ol>
<p>The topology decides which device connects to which, and so the path the data takes.</p>
${H('2. Classification by geographic coverage')}
[[fig:categories]]
<p>Networks are classified by the area they cover: <b>PAN</b> (a few metres), <b>LAN</b> (building/campus), <b>MAN</b> (city), <b>WAN</b> (country/continent).</p>
<p><b>(a) LAN – Local Area Network:</b> connects computers within a small area such as a room, building or campus; very high speed (100 Mbps to several Gbps); owned by one organisation; uses Ethernet or Wi-Fi. Example: college lab, office LAN, home Wi-Fi. <i>Advantage:</i> very fast data and resource sharing (printers, files, Internet). <i>Limitation:</i> limited to a small area; hardware and cabling cost.</p>
<p><b>(b) MAN – Metropolitan Area Network:</b> covers a city or town (5–50 km), usually made by connecting many LANs with fibre; owned by an organisation or a telecom company. Example: cable TV network of a city, bank branches in one city. <i>Advantage:</i> connects many LANs across a city with good speed. <i>Limitation:</i> expensive to set up and maintain; harder to secure; needs skilled staff.</p>
<p><b>(c) WAN – Wide Area Network:</b> spans cities, countries or continents using satellite links, leased lines and fibre backbones; owned by many organisations. Example: the Internet, nationwide bank network, airline reservation system. <i>Advantage:</i> connects users over huge distances and allows global business. <i>Limitation:</i> high cost, lower speed, more errors and security threats.</p>
<p>(PAN: one person's devices within about 10 m via Bluetooth/USB – easy and low power, but very short range.)</p>
${END}`});

Q({id:'a3',marks:16,topic:'topology',tags:['asg'],q:'Define network topology and explain its importance in designing a computer network. Draw a neat diagram for each topology and mention the situations in which each is most suitable.',
ans:`${H('Definition')}
<p><b>Network topology</b> is the physical or logical arrangement of computers, networking devices and communication links in a network – in simple words, how devices are connected and how data travels between them. <i>Physical topology</i> is the actual cable layout; <i>logical topology</i> is how data flows.</p>
${H('Importance in network design')}
<ul><li><b>Better network planning</b> – helps decide how devices should be interconnected.</li><li><b>Efficient communication</b> – a suitable topology improves data transmission and performance.</li><li><b>Fault management</b> – decides how a failed cable, switch or device affects the rest of the network.</li><li><b>Scalability</b> – a good topology makes adding new devices easy.</li><li><b>Cost management</b> – the design can match the budget (cable, ports, devices).</li><li><b>Network security</b> – supports segmentation and controlled communication between sections.</li></ul>
${H('1. Bus topology')}
[[fig:bus]]
<p>All computers connect to one central cable (the bus) with terminators at both ends to absorb the signal. Data from one station is seen by all; only the addressed station accepts it. Cheap and simple, but a backbone break stops everything and traffic causes collisions. <b>Suitable for:</b> small temporary networks, early Ethernet LANs.</p>
${H('2. Star topology')}
[[fig:star]]
<p>Every device has its own cable to a central switch (or hub). The switch reads the destination MAC address and forwards the frame to the right port. Easy to install, manage and troubleshoot; one cable fault affects one device; but the central device is a single point of failure. <b>Suitable for:</b> computer labs, schools, offices, homes, data centres – the most common modern LAN.</p>
${H('3. Ring topology')}
[[fig:ring]]
<p>Each device connects to two neighbours, forming a closed loop; data travels around the ring and access is by token passing (only the token holder sends). Organised and collision-free, but one failed device or link can stop a simple ring and adding devices is disruptive. <b>Suitable for:</b> Token Ring, FDDI, special systems needing predictable access.</p>
${H('4. Mesh topology')}
[[fig:mesh]]
<p>Every device is directly connected to every other device (n(n−1)/2 links; 5 devices → 10 links). Highly reliable with multiple paths and excellent fault tolerance, but very expensive and complex. <b>Suitable for:</b> WAN and Internet backbones, military and emergency networks, critical links.</p>
${H('5. Tree (star-bus) topology')}
[[fig:starbus]]
<p>Several star networks connected through higher-level devices (core, distribution and access layers). Highly scalable and easy to manage by department, but a high-level device failure affects many devices. <b>Suitable for:</b> universities, corporate offices, large campuses, enterprise networks.</p>
${H('6. Star-ring topology')}
[[fig:starring]]
<p>Stations are cabled like a star to a central MAU, but inside the MAU the ports form a ring, so the token still passes station to station; a dead station is bypassed. <b>Suitable for:</b> IBM Token Ring networks that want ring behaviour with easy maintenance.</p>
${H('7. Hybrid topology')}
<p>Two or more topologies combined (for example star-bus) to meet specific needs; flexible but complex and costly.</p>
${H('Conclusion')}
<p>The choice depends on cost, reliability, performance and scalability. Modern LANs mostly use star or tree; mesh is for backbones; bus and ring are mostly historical.</p>
${END}`});

Q({id:'a4',marks:7,topic:'lineconfig',tags:['asg'],q:'Using suitable examples such as a television broadcast, a walkie-talkie, and a telephone conversation, explain simplex, half-duplex, and full-duplex transmission modes.',
ans:`<p><b>Transmission mode</b> (communication mode) is the direction of data flow between two devices connected over a network. There are three types.</p>
[[fig:modes]]
${H('1. Simplex – television broadcast')}
<p>Communication is one way only (unidirectional): one device only sends and the other only receives; the receiver can never send back. The whole channel capacity is used in one direction. It is the simplest and cheapest mode. In a TV broadcast the station transmits picture and sound and the TV set only receives. Like a one-way street. Other examples: keyboard → CPU, CPU → monitor, radio, loudspeaker.</p>
${H('2. Half-duplex – walkie-talkie')}
<p>Communication is two way, but only one device can send at a time – the devices take turns. While one sends, the other only receives. The full bandwidth is available to whichever device is sending. With a walkie-talkie one person presses the button and talks while the other listens; he says "over" and releases the button so the other can reply. Better than simplex but slower than full-duplex because of the waiting. Other examples: old intercoms, CB radio, police wireless.</p>
${H('3. Full-duplex – telephone conversation')}
<p>Both devices send and receive at the same time. The channel capacity is split or managed so that both directions work together. In a telephone call both people can talk and listen at the same moment. It is the fastest and most efficient mode for two-way communication, but needs more complex and costly hardware. Like a two-way road. Other examples: mobile calls, video conferencing, modern switched LAN links.</p>
${H('Comparison')}
<p>Simplex: one direction, low cost, low efficiency. Half-duplex: both directions one at a time, moderate. Full-duplex: both directions together, fastest, costliest.</p>
${END}`});

Q({id:'a5',marks:7,topic:'guided',tags:['asg'],q:'Compare twisted-pair, coaxial, and fibre-optic transmission media with respect to data rate, signal attenuation, cost, and susceptibility to noise.',
ans:`<p>All three are <b>guided media</b> – the signal travels inside a physical cable. Twisted pair and coaxial carry electrical signals on copper; fibre carries light.</p>
[[fig:mediacompare]]
${T(['Parameter','Twisted pair','Coaxial cable','Optical fibre'],[
['Data rate / bandwidth','Lower – from 10 Mbps up to 1–10 Gbps on short runs (Cat5/Cat6); bandwidth limited','Higher than twisted pair – supports moderate-speed data and many TV channels (broadband)','Highest – Gbps to Tbps; very high bandwidth'],
['Signal attenuation','High – limited to short distances (about 100 m) before a repeater','Moderate – longer than twisted pair (about 500 m)','Negligible – long distance without signal loss (many km)'],
['Cost','Lowest – cheap cable, easy to install','Moderate – less expensive than fibre, bulkier than twisted pair','Highest – costly cable and equipment, hard to install and maintain'],
['Susceptibility to noise','High – open to external interference and crosstalk (UTP); STP shielding reduces it','Low – the braided shield blocks interference','None – immune to electromagnetic interference'],
['Other','Flexible, light, easy to tap','Single cable failure can disturb the network','Fragile, unidirectional, secure']])}
${H('Conclusion')}
<p>Twisted pair is used for cheap short LAN runs (Ethernet, telephone); coaxial for cable TV and older Ethernet; fibre for backbones and long, high-speed, noise-free links.</p>
${END}`});

Q({id:'a6',marks:10,topic:'devices',tags:['asg'],q:'Prepare a comparative description of the functions of a hub, repeater, bridge, router, and gateway. Explain why a hub used in a star topology is considered a Physical Layer device.',
ans:`${H('Comparative description')}
[[fig:devices]]
${T(['Device','Layer','What it does','Traffic behaviour','Real-life example'],[
['Hub','1 – Physical','Simple multi-port device that connects computers in a LAN; broadcasts every incoming signal to ALL ports; shared bandwidth, half-duplex; cheap but inefficient and insecure – replaced by switches','Copies every frame to all ports','Old school computer-lab LAN; like a USB hub'],
['Repeater','1 – Physical','Two-port device that regenerates weak, distorted signals so data travels longer (fights attenuation); connects two segments of the same network; does not understand addresses','One stream in, one stronger stream out','Wi-Fi range extender; repeaters in undersea cables; joining two 100 m Ethernet runs'],
['Bridge','2 – Data Link','Connects two LAN segments; learns MAC addresses on each side and forwards a frame only when the destination is on the other segment; less traffic, fewer collisions','Forwards frames only to the right segment','Wireless bridge between two buildings; splitting a crowded office LAN'],
['Router','3 – Network','Connects different networks (LAN ↔ Internet, office ↔ office); reads IP addresses and chooses the best path using a routing table (static or OSPF/BGP); home routers add NAT, DHCP, firewall, Wi-Fi','Chooses the best path for each packet','Home Wi-Fi router; campus routers; Internet backbone routers'],
['Gateway','Up to 7 – Application','The "translator": converts between different protocols, data formats or systems; most powerful device, often includes routing and switching; "default gateway" is the router that leads out of the LAN','Converts between systems, then sends on','VoIP gateway (telephone PSTN ↔ Internet SIP); online payment gateway; e-mail/API gateways']])}
<p>Intelligence grows left to right: Hub → Repeater → Bridge → Router → Gateway.</p>
${H('Why a hub is a Physical-layer device')}
[[fig:hubswitch]]
<p>In a star topology all cables meet at the hub, but the hub does nothing except <b>regenerate electrical signals</b>: a signal entering one port is copied to every other port. It cannot read a frame, does not understand MAC or IP addresses, cannot filter or choose a port, and all stations share one collision domain – exactly as if they were on one shared cable. Because it works only with raw signals (bits) and the physical connection, it belongs to OSI Layer 1 – it is a multi-port repeater. A switch, which reads the destination MAC address and forwards only to that port, is the Layer-2 device that replaced it.</p>
${END}`});

Q({id:'a7',marks:10,topic:'osi',tags:['asg'],q:'Explain the purpose of the OSI reference model in computer networking and list its seven layers in sequence with their functions and services and one suitable example.',
ans:`${H('Purpose of the OSI model')}
<p>The Open Systems Interconnection (OSI) model is an ISO standard (ISO/IEC 7498, 1984) that divides network communication into 7 layers. Each layer does a specific job and talks only to the layers directly above and below it, so hardware, software and protocols can be developed independently. <b>Purpose:</b> modular design (change one layer without breaking the others), standard communication (every vendor builds to the same 7-layer contract, so devices interoperate), and faster troubleshooting (find the problem layer by layer: cable, router or app?).</p>
[[fig:osi]]
${H('The seven layers')}
<ol>
<li><b>Physical (bit)</b> – transmits raw bits over the medium: cables, connectors, voltages, data rates; defines electrical/optical/radio signals and the physical topology. <i>Example:</i> Ethernet cable, fibre, Wi-Fi radio waves; RS-232, USB.</li>
<li><b>Data Link (frame)</b> – groups bits into frames and adds a MAC address; detects errors with CRC; controls who may talk on a shared medium (CSMA/CD for Ethernet, CSMA/CA for Wi-Fi). <i>Example:</i> a switch reading MAC addresses like number plates; Ethernet, Wi-Fi, PPP, ARP.</li>
<li><b>Network (packet)</b> – adds logical IP addresses of sender and receiver; routes packets by choosing the best path; fragmentation and reassembly. <i>Example:</i> the postal service – IP address is the home address, routers are post offices; IP, ICMP, OSPF, BGP.</li>
<li><b>Transport (segment)</b> – end-to-end delivery between applications using port numbers; segments and reassembles data in order; flow, error and congestion control; reliable (TCP) or fast (UDP). <i>Example:</i> TCP = registered post (numbered, confirmed, resent), UDP = postcard (fast, for live video/gaming).</li>
<li><b>Session (data)</b> – establishes, manages and terminates sessions between applications; checkpoints so a long transfer can resume; dialog control. <i>Example:</i> a phone call – dial, talk, hang up; NetBIOS, RPC, SIP.</li>
<li><b>Presentation (data)</b> – translation between formats (ASCII/Unicode), encryption and decryption, compression (ZIP, JPEG, MP3). <i>Example:</i> a translator and a safe (the HTTPS padlock); SSL/TLS, JPEG, MPEG.</li>
<li><b>Application (data)</b> – the layer the user touches: web browsing, e-mail, file transfer, name resolution, remote login. <i>Example:</i> browser (HTTP), e-mail client (SMTP/IMAP), FTP, DNS – the phone book of the Internet.</li>
</ol>
<p><b>Mnemonic:</b> "Please Do Not Throw Sausage Pizza Away" (top to bottom) or "All People Seem To Need Data Processing" (bottom to top). At the sender each layer adds a header (encapsulation); the receiver removes them in reverse.</p>
${END}`});

Q({id:'a8',marks:10,topic:'tcpip',tags:['asg'],q:'Describe the TCP/IP reference model layer by layer, including the primary functions and commonly used protocols of each layer. Draw a diagram showing the correspondence between TCP/IP and OSI layers.',
ans:`${H('Introduction')}
<p>The TCP/IP (Transmission Control Protocol/Internet Protocol) model is the standard protocol suite used for communication over the Internet. It is a simpler, practical version of the OSI model with four layers instead of seven. OSI is mainly theoretical; TCP/IP is used in real-world networking.</p>
[[fig:osivstcp]]
${H('Layers of TCP/IP')}
<p><b>1. Application layer (top, closest to users)</b> – provides network services to applications so that browsers, e-mail clients and file-transfer apps can communicate. Functions: user interface to network services; web, e-mail, file transfer, remote login; data formatting, encryption and compression (OSI's Presentation layer is merged here). Protocols: HTTP (web), HTTPS (secure web), FTP (file transfer), SMTP (send mail), IMAP/POP3 (receive mail), DNS (name → IP address).</p>
<p><b>2. Transport layer</b> – reliable communication between devices: breaks data into segments, checks errors, manages retransmission. Functions: segmentation, flow control (do not overwhelm the receiver), error handling, multiplexing. Protocols: TCP – reliable, used for web, e-mail, file transfer; UDP – fast but unreliable, used for video calls, gaming, streaming.</p>
<p><b>3. Internet layer</b> – logical addressing and routing across different networks. Functions: gives each device a unique IP address, finds the best path, forwards packets between networks using routers. Protocols: IP (addresses and routing), ICMP (diagnostics – ping), ARP (IP → MAC), RIP and OSPF (routing protocols).</p>
<p><b>4. Network Access layer</b> – physically transmits data over media such as Ethernet cables, Wi-Fi and fibre. Functions: encapsulation of packets into frames, MAC addressing, error detection, defines the physical medium. Technologies: Ethernet (IEEE 802.3), Wi-Fi (IEEE 802.11), Bluetooth, PPP.</p>
${H('Correspondence with OSI')}
${T(['TCP/IP layer','Corresponding OSI layers'],[['Application','Application, Presentation, Session (5–7)'],['Transport','Transport (4)'],['Internet','Network (3)'],['Network Access','Data Link and Physical (1–2)']])}
<p><b>Example – sending an e-mail:</b> Gmail formats the mail with SMTP (Application) → TCP splits it into numbered packets and makes delivery reliable (Transport) → IP adds source/destination addresses and finds the best path (Internet) → the packets become signals on Ethernet/Wi-Fi (Network Access). The receiver reverses the steps.</p>
${END}`});

Q({id:'a9',marks:7,topic:'dll',tags:['asg'],q:'Discuss the Data Link Layer and explain its major functions and the role of each function in reliable data delivery. Define framing and explain why it is required.',
ans:`${H('Data Link Layer')}
<p>The Data Link Layer is layer 2 of the OSI model. It takes the raw bits from the physical layer and delivers them as frames between directly connected devices (node to node), with MAC addresses and error checking, so that the layers above get reliable data. It has two sublayers: <b>LLC</b> (flow and error control) and <b>MAC</b> (addressing and medium access).</p>
[[fig:dllsub]]
${H('Functions and their role in reliable delivery')}
<ol>
<li><b>Framing</b> – divides the data stream into frames with a clear start and end. <i>Role:</i> gives units that can be addressed, checked and acknowledged one by one, and keeps sender and receiver synchronised.</li>
<li><b>Physical (MAC) addressing</b> – adds the sender's and receiver's hardware addresses to the frame. <i>Role:</i> the frame reaches the right device on the link.</li>
<li><b>Error detection</b> – adds a code (parity, checksum, CRC) to each frame; the receiver recalculates and compares. <i>Role:</i> damaged frames are found instead of being accepted.</li>
<li><b>Error correction</b> – the damaged frame is sent again, or corrected with codes like Hamming code. <i>Role:</i> correct data finally reaches the network layer.</li>
<li><b>Flow control</b> – limits how fast the sender sends. <i>Role:</i> a slow receiver's buffer does not overflow and lose frames.</li>
</ol>
<p>(The MAC sublayer also decides who may use a shared medium – CSMA/CD, CSMA/CA, token passing – so frames are not destroyed by collisions.)</p>
${H('Framing: definition and need')}
<p><b>Framing</b> is the process of dividing the data stream into smaller, manageable units called frames for transmission over the physical medium. Methods: character count, byte stuffing, bit stuffing, flag-based framing (HDLC).</p>
<p><b>Why it is required:</b> the physical layer gives only a stream of bits. Without frames the receiver cannot recognise where one message starts and the next ends, cannot attach addresses, cannot do error detection per unit, and cannot acknowledge or resend one piece. Framing helps error detection, data synchronisation and lets the receiver find the start and end of each data unit.</p>
${END}`});

Q({id:'a10',marks:10,topic:'errorctl',tags:['asg'],q:'Explain the working of a parity check and identify the types of errors it can and cannot detect. Solve one CRC problem step by step (take your own example and solve it).',
ans:`${H('Part A – Parity check')}
[[fig:parity]]
<p>Simple parity is an error-detection method that adds one extra bit to the data. <b>Working (even parity):</b> a 1 is added if the block has an odd number of 1s, and a 0 if it has an even number, so that the total number of 1s is even. The receiver counts the 1s in the received block: if the count is even the data is accepted; if it is odd, a bit was flipped during transmission and the block is rejected.</p>
<p><b>Example:</b> data 1101011 has five 1s → parity bit = 1 → sent 11010111 (six 1s). If 11010101 is received (one bit flipped) the count is five – odd – so the error is detected.</p>
<ul><li><b>Can detect:</b> single-bit errors (any odd number of flipped bits).</li><li><b>Cannot detect:</b> an even number of flipped bits (burst errors where 2, 4… bits change), because the count stays even. It also cannot correct the error or tell where it is, so it is not suitable for high-reliability use.</li></ul>
${H('Part B – CRC problem')}
<p><b>Given:</b> data word 100100 (n = 6 bits), key/divisor 1101 (k = 4 bits; generator polynomial x³ + x² + 1).</p>
<p><b>Step 1:</b> append k − 1 = 3 zeros: 100100<b>000</b>.</p>
<p><b>Step 2:</b> modulo-2 division by 1101 (XOR; when the leading bit is 1 XOR with 1101, when it is 0 XOR with 0000; bring down the next bit each time).</p>
[[fig:crc]]
<pre class="mono" style="overflow-x:auto;background:var(--surface-2);padding:10px;border-radius:6px">1001 ⊕ 1101 = 0100
→ 1000 (bring down 0) ⊕ 1101 = 0101
→ 1010 (bring down 0) ⊕ 1101 = 0111
→ 1110 (bring down 0) ⊕ 1101 = 0011
→ 0110 (bring down 0) leading 0 ⊕ 0000 = 0110
→ 1100 (bring down 0) ⊕ 1101 = 0001
remainder = 001</pre>
<p><b>Step 3:</b> remainder = CRC = <b>001</b> (3 bits = k − 1).</p>
<p><b>Step 4:</b> codeword = data + CRC = <b>100100001</b> (n + k − 1 = 9 bits).</p>
<p><b>Receiver side:</b> divide the received 100100001 by 1101 the same way → remainder 000 → no error, accept 100100. If an error changed it to 100000001, the remainder would not be zero → error detected, frame rejected.</p>
<p><b>Note:</b> the CRC length is always equal to the degree of the generator polynomial (CRC-12 → 12 bits; 1000-bit message + CRC-12 = 1012 bits sent).</p>
${END}`});

Q({id:'a11',marks:7,topic:'flowctl',tags:['asg'],q:'Describe the two basic flow-control protocols and compare their operation.',
ans:`${NOTE('flow control is listed as a DLL function in Lecture 20 but not explained; this answer uses the textbook method in simple words.')}
<p><b>Flow control</b> is the set of rules that tells the sender how much data it may send before waiting for an acknowledgement, so a fast sender does not overwhelm a slow receiver. The two basic protocols are Stop-and-Wait and Sliding Window.</p>
${H('1. Stop-and-Wait')}
[[fig:stopwait]]
<p>The sender sends one frame and then stops and waits for an ACK from the receiver before sending the next frame. A timer is started with each frame; if the ACK does not come in time the frame is sent again. Sequence numbers 0 and 1 let the receiver reject duplicates. <i>Advantage:</i> simple, little buffer needed. <i>Disadvantage:</i> the link is idle during every round trip, so it is slow – efficiency = 1/(1 + 2a).</p>
${H('2. Sliding Window')}
[[fig:slidingwindow]]
<p>The sender may send several frames (up to the window size W) before it needs an ACK. Frames carry sequence numbers; one ACK can cover many frames and can be piggybacked on data going the other way. When ACKs arrive the window slides forward and more frames may be sent. Implemented as Go-Back-N or Selective Repeat. <i>Advantage:</i> the link stays busy – efficiency = W/(1 + 2a). <i>Disadvantage:</i> more complex, needs buffers for W frames.</p>
${H('Comparison')}
${T(['Basis','Stop-and-Wait','Sliding Window'],[['Frames in flight','Only 1','Up to W'],['Sequence numbers','0 and 1','0 to 2ᵐ−1'],['Acknowledgement','One per frame','Cumulative, piggybacked'],['Link utilisation','Low','High'],['Buffer needed','Minimal','W frames'],['Complexity','Simple','Complex'],['Suitable for','Short, slow links','Long or fast links (TCP, HDLC)']])}
${END}`});

Q({id:'a12',marks:16,topic:'csma',tags:['asg'],q:'Discuss the three major categories of access methods: random access, controlled access, and channelization. Using an example, explain how a MAC address helps deliver a frame to the intended device. Finally, compare Ethernet, FDDI, and Token Ring in terms of their medium-access mechanisms.',
ans:`${H('Part A – Three categories of access methods')}
<p>When many devices share one medium, a medium access control (MAC) protocol decides who may send and when, so that transmissions do not collide (Lecture 15, Forouzan fig. 12.2).</p>
[[fig:maccat]]
<p><b>1. Random access:</b> no station is in charge; any station sends when it has data, following a procedure that reduces or resolves collisions. (a) <b>ALOHA</b> – send any time, wait for ACK, back off randomly after a collision. (b) <b>CSMA</b> – listen before sending (carrier sense); transmit only if the channel is idle; collisions can still occur because signals take time to travel. Variants: 1-persistent, non-persistent, p-persistent. (c) <b>CSMA/CD</b> – Ethernet: listen while sending, stop on collision, send a jam signal, binary exponential backoff. (d) <b>CSMA/CA</b> – Wi-Fi: random backoff before sending, optional RTS/CTS, ACK. Simple and good at light load; collisions waste bandwidth at heavy load.</p>
<p><b>2. Controlled access:</b> a station sends only when it is allowed. (a) <b>Reservation</b> – stations reserve a slot before sending. (b) <b>Polling</b> – a primary station asks each station in turn whether it has data. (c) <b>Token passing</b> – a token circulates; only its holder may send (Token Ring, FDDI). No collisions and predictable access, but token/poll overhead and the token can be lost.</p>
<p><b>3. Channelization:</b> the available bandwidth is divided among stations. (a) <b>FDMA</b> – each station gets its own frequency band. (b) <b>TDMA</b> – stations share the band by taking turns in time slots. (c) <b>CDMA</b> – all stations use the whole band at the same time, separated by codes (mobile networks). No collisions, but capacity is wasted when a station is idle.</p>
${H('Part B – How a MAC address delivers a frame')}
[[fig:macaddr]]
<p>A <b>MAC address</b> is the unique 48-bit hardware address of a network card, written as 12 hex digits (e.g. 00:1A:2B:3C:4D:5E) – the first 3 bytes identify the vendor and the last 3 the device. The data link layer puts it in the frame header, like a car's number plate (Lecture 11).</p>
<p><b>Example:</b> PC1 (MAC …4D:5E) wants to send to PC2 (MAC …8E:9F) on a switched LAN. (1) PC1 builds an Ethernet frame with destination MAC …8E:9F and source MAC …4D:5E (ARP first finds PC2's MAC from its IP). (2) The switch reads the destination MAC and looks in its MAC table, which it learned from the source addresses of earlier frames (…8E:9F → port 2). (3) The switch forwards the frame only out of port 2 (Lecture 4: "the switch examines the destination MAC address, determines the port and forwards the frame"). (4) PC2's card sees its own address, accepts the frame, checks the CRC and passes the data up; other cards ignore it. If the address is unknown the switch sends it to all ports; the broadcast address FF:FF:FF:FF:FF:FF is accepted by everyone. So the MAC address is the "house number" for delivery inside the LAN, while the IP address is used by routers between networks.</p>
${H('Part C – Ethernet vs FDDI vs Token Ring (medium access)')}
[[fig:ethernetcmp]]
${T(['Feature','Ethernet (IEEE 802.3)','Token Ring (IEEE 802.5)','FDDI'],[
['Access method','CSMA/CD – contention: sense, send, detect collision, jam, random backoff; switched full-duplex Ethernet has no collisions at all','Token passing: a station must capture the free token, send its frame, remove it when it returns and release a new token','Timed token passing on a dual ring; token gives permission to transmit'],
['Collisions','Possible on a shared medium','None','None'],
['Behaviour under load','Throughput falls as collisions grow','Predictable, each station gets a turn','Predictable, organised'],
['Topology','Bus (old) → star with switches','Logical ring (physical star via MAU)','Dual counter-rotating ring'],
['Medium / speed','UTP, coax, fibre; 10 Mbps → 100 Gbps','Twisted pair; 4/16 Mbps','Optical fibre; 100 Mbps'],
['Status','Dominant LAN today','Historical','Historical backbone']])}
<p><b>Conclusion:</b> Ethernet uses random access with collision detection; Token Ring and FDDI use controlled, collision-free token passing. Memory trick: FDDI = Fibre + Token + Dual Ring; Token Ring = Token + Ring; Ethernet = today's common LAN.</p>
${END}`});

Q({id:'a13',marks:10,topic:'switching',tags:['asg'],q:'Explain and compare circuit switching, packet switching, and message switching. Describe the working of each technique.',
ans:`${NOTE('the switching lecture is not in your PPT folder; this answer uses the textbook in simple words.')}
<p><b>Switching</b> is the way data is moved through a network of connected switches so that every pair of devices does not need its own direct link.</p>
[[fig:switching]]
${H('1. Circuit switching')}
<p><b>Working:</b> a dedicated path is set up between the two stations before any data is sent. (1) Set-up – the path is reserved link by link; (2) data transfer – data flows continuously along the path, no addresses needed; (3) teardown – the path is released. <b>Example:</b> telephone network. <b>Good:</b> guaranteed bandwidth, fixed delay, data in order, good for voice. <b>Bad:</b> set-up delay, reserved capacity wasted when idle, call blocked if no circuit is free, inefficient for bursty data.</p>
${H('2. Message switching')}
<p><b>Working:</b> no path is reserved. The whole message with its destination address is sent to the first switch, which stores it, waits for a free link, then forwards it to the next switch (store-and-forward), until it reaches the destination. <b>Example:</b> telegraph. <b>Good:</b> links shared, no set-up, no blocking. <b>Bad:</b> large storage at each switch, very long delay (the full message must arrive before it is forwarded), not suitable for real time.</p>
${H('3. Packet switching')}
<p><b>Working:</b> the message is cut into small packets with headers (addresses, sequence number); each packet is stored and forwarded by the switches, several at once on different links, and the packets are joined again at the destination. Two ways: <b>datagram</b> – each packet routed on its own (IP); <b>virtual circuit</b> – a path is chosen first and all packets follow it (ATM, Frame Relay). <b>Example:</b> the Internet. <b>Good:</b> best sharing of links, low delay, robust. <b>Bad:</b> header overhead, variable delay, packets may be lost or reordered.</p>
${H('Comparison')}
${T(['Basis','Circuit','Message','Packet'],[['Dedicated path','Yes','No','No'],['Set-up','Required','None','None (datagram) / yes (VC)'],['Store-and-forward','No','Whole message','Packets'],['Address','Only at set-up','Each message','Each packet'],['Delay','Set-up delay, then constant','Very high','Low, variable'],['Bandwidth use','Wasted when idle','Shared','Shared, best'],['Storage at nodes','None','Large','Small buffers'],['Real-time use','Excellent','Poor','Good'],['Example','Telephone','Telegraph','Internet']])}
${END}`});

Q({id:'a14',marks:7,topic:'flowctl',tags:['asg'],q:'Differentiate between flow control and congestion control with the help of suitable examples. Explain how a very fast sender can contribute to network congestion even when the receiver is ready to accept data.',
ans:`${NOTE('the PPTs mention flow control only as a function (Lecture 13, 20); the comparison below is in simple textbook words.')}
[[fig:flowcong]]
${H('Difference')}
${T(['Basis','Flow control','Congestion control'],[['Problem','The receiver cannot handle data as fast as the sender sends it (buffer overflow)','The network – routers and links – is overloaded with too many packets'],['Scope','Between one sender and one receiver','The whole network, all senders'],['Who controls','The receiver (window size, ACKs)','The network signals (lost packets, delay) and the sender slows down'],['Mechanisms','Stop-and-wait, sliding window, TCP receiver window','TCP slow start / congestion window, traffic shaping, choke packets'],['Example','A PC sending a big file to a slow printer – the printer tells it to wait','Thousands of users streaming through one router in the evening – the queue overflows and packets are dropped']])}
${H('Fast sender causing congestion while the receiver is ready')}
<p>Flow control looks only at the receiver's buffer. Suppose a server with a fast 1 Gbps connection sends to a client that says "I have lots of free buffer". Flow control then lets the server send at full speed. But the packets must pass through routers and links in between that may be slower – for example a 100 Mbps link, or a router shared by many other users. Packets arrive at that router ten times faster than it can forward them, its queue fills up, delay grows, and when the buffer is full packets are <b>dropped</b>. The sender's timers expire and it resends them, adding even more traffic – the network is congested even though the receiver had space. That is why TCP uses both: it sends at most the smaller of the receiver window and the congestion window, and slows down when it sees loss or delay.</p>
${END}`});

Q({id:'a15',marks:16,topic:'switching',tags:['asg'],q:'Differentiate between connectionless and connection-oriented services and between datagram and virtual-circuit networks. Explain the operation of a router, identify its corresponding OSI layer, and give a practical situation in which a router is essential.',
ans:`${NOTE('connection types and datagram/virtual circuit are not in the PPTs (simple textbook words below); the router part is from Lecture 10 and 13.')}
${H('Part A – Connection-oriented vs connectionless service')}
<p>A <b>connection-oriented</b> service (like a telephone call) first sets up a connection, sends the data in order over it, and then releases it. A <b>connectionless</b> service (like posting letters) sends each message on its own with a full address and no set-up.</p>
${T(['Basis','Connection-oriented','Connectionless'],[['Set-up / release','Needed before and after data (handshake)','None; each unit sent independently'],['Order','Data arrives in sequence','May arrive out of order'],['Reliability','Usually reliable: ACKs, retransmission, flow control','Best effort, no guarantee'],['Overhead','Set-up delay, then efficient','No set-up; good for short messages'],['Examples','TCP, telephone call, ATM','UDP, IP, postal letter']])}
<p>From Lecture 13: TCP (reliable, used for web, e-mail, files) is connection-oriented; UDP (fast, used for video calls and gaming) and IP are connectionless.</p>
${H('Part B – Datagram vs virtual-circuit network')}
[[fig:vcdatagram]]
${T(['Basis','Datagram network','Virtual-circuit network'],[['Routing','Each packet is routed on its own; packets may take different paths','A path is chosen once at set-up; all packets follow it'],['Address in packet','Full source and destination addresses','Short virtual-circuit number'],['Switch state','No per-connection state','One table entry per circuit in every switch'],['Order','Not guaranteed','Guaranteed'],['Failure','Packets rerouted automatically','Circuits through the failed node are lost; set up again'],['Set-up delay','None','Yes'],['Examples','IP (Internet), Ethernet','ATM, Frame Relay, X.25, MPLS']])}
${H('Part C – Operation of a router')}
[[fig:devices]]
<p>A <b>router</b> works at Layer 3, the <b>Network layer</b>. It connects different networks – your home LAN to the Internet, or one office network to another – and chooses the best path for each packet (Lecture 10).</p>
<ol><li>The router receives a frame, removes the Layer-2 header and reads the <b>destination IP address</b> of the packet.</li><li>It looks in its <b>routing table</b> (static routes or learned by dynamic protocols like RIP, OSPF, BGP) for the best path to that network.</li><li>It forwards the packet out of the chosen interface in a new frame to the next hop.</li><li>It does not forward broadcasts, so it separates networks; home routers also do NAT (all devices share one connection), DHCP (hand out IP addresses) and firewall.</li></ol>
<p><b>Practical situation:</b> a company's internal LAN must connect to the Internet (Lecture 10 activity, Group C) or two different IP networks must exchange packets (Group G). Switches and bridges work only with MAC addresses inside one network; only a router can read IP addresses and forward packets between networks. Everyday example: the home Wi-Fi router connecting phones, laptops and TVs to the ISP; Internet backbone routers forwarding millions of packets per second between cities.</p>
${END}`});

Q({id:'a16',marks:10,topic:'design',tags:['asg'],q:'An organization currently operates all computers, servers, printers, and wireless devices on a single network. Propose a more suitable segmented network architecture, explain its benefits, and draw an appropriate diagram.',
ans:`${H('Problem with a single network')}
<p>When every PC, server, printer and wireless device is on one network, all of them are in one broadcast domain and one security zone: every broadcast reaches every device, one faulty device or busy user slows everyone, a visitor's laptop on Wi-Fi can reach the servers, and faults are hard to find. (Lecture 4: topology supports segmentation and controlled communication between sections.)</p>
${H('Proposed segmented architecture')}
[[fig:segmented]]
<p>A tree (star-bus) design: Internet → <b>router/firewall</b> → <b>core switch</b> → one switch per group, with the devices divided into separate <b>VLANs</b> (logical segments):</p>
<ul><li><b>Servers segment</b> – file, database and application servers (public web server in a separate protected zone).</li><li><b>Staff PCs segment</b> – desktops and laptops (one segment per department if large).</li><li><b>Printers segment</b> – shared printers.</li><li><b>Wireless segments</b> – staff Wi-Fi (WPA3, 802.1X) and a separate, isolated guest Wi-Fi.</li></ul>
<p>Traffic between segments passes through the router/firewall, which allows only what is needed: staff → servers and printers; guests → Internet only. Access points connect to the switches and map each SSID to the right segment.</p>
${H('Benefits')}
<ol><li><b>Performance</b> – smaller broadcast domains, less unnecessary traffic; servers get their own bandwidth.</li><li><b>Security</b> – segments are isolated; a compromised guest device cannot reach the servers; rules at the firewall.</li><li><b>Fault containment</b> – a problem stays inside one segment and is easier to find.</li><li><b>Easier management</b> – devices grouped logically; policies and monitoring per segment.</li><li><b>Scalability</b> – add a department, a switch or an access point without redesign.</li><li><b>Reliability</b> – a failure of one switch affects only its group.</li></ol>
${END}`});

Q({id:'a17',marks:16,topic:'design',tags:['asg'],q:'The organization is considering either a completely wireless network or a primarily wired network supplemented with wireless connectivity. Compare these two approaches in terms of cost, speed, security, reliability, and ease of use. For an office containing desktop systems, mobile users, servers, and printers, state which approach you would adopt, provide technical reasons, and draw the proposed network diagram.',
ans:`${H('Comparison (from Lecture 16 Ethernet and Lecture 19 WLAN)')}
${T(['Criterion','Completely wireless (Wi-Fi only)','Primarily wired (Ethernet) + wireless'],[
['Cost','No structured cabling, quick to deploy; but many access points and wireless cards are needed, and APs still need cables','Higher cost at the start for cabling and switches; Ethernet hardware and maintenance are cost-effective and last long'],
['Speed','Shared airtime (CSMA/CA); real throughput varies with distance, walls and number of users','High speed (up to 100 Gbps), dedicated full-duplex per port, low latency – good for gaming, VoIP, streaming'],
['Security','Radio signals leak outside the building; needs WPA3 and careful configuration; rogue APs','Harder to intercept than wireless; physical access needed; server traffic never on air; Wi-Fi kept in its own segment'],
['Reliability','Interference, congestion, dead zones; performance changes with environment and load','Reliable and stable, less prone to interference; wireless only as an extra'],
['Ease of use','Easiest for mobile users and visitors; flexible, easy to add or move devices','Fixed devices need a port and cabling takes longer, but mobile users still get Wi-Fi']])}
${H('Recommended approach')}
<p>For an office with <b>desktops, servers, printers and mobile users</b>, use a <b>primarily wired Gigabit Ethernet network supplemented with Wi-Fi</b>.</p>
<p><b>Technical reasons:</b></p>
<ol><li>Desktops, servers and printers do not move; they need high, stable speed and low latency – Ethernet gives dedicated full-duplex links with no collisions, while Wi-Fi shares airtime through CSMA/CA (Lecture 15/19).</li><li>Servers hold sensitive data; wired links do not radiate and can be put in their own segment (Lecture 16: Ethernet is secure, harder to intercept).</li><li>Reliability: Ethernet is stable and less prone to interference (Lecture 16); a Wi-Fi outage then affects only laptops and phones.</li><li>Access points themselves must connect to the wired LAN, so a wired backbone is needed anyway.</li><li>Mobile users and visitors get Wi-Fi 6 access points with WPA3 (and 802.1X for staff) on separate staff and guest SSIDs – mobility, flexibility and convenience (Lecture 19 advantages of WLAN).</li><li>Easy to grow: more switch ports or more access points as needed.</li></ol>
${H('Proposed network diagram')}
[[fig:officenet]]
<p>ISP → router/firewall → core Gigabit switch → (a) server-room switch with servers and printers, (b) floor switch with desktops on UTP Cat6 cables, (c) access points giving Wi-Fi coverage to laptops and phones in their own segment. This gives performance, security and reliability for fixed devices and mobility for people.</p>
${END}`});

Q({id:'a18',marks:10,topic:'design',tags:['asg'],q:'An employee working remotely needs secure access to the company’s internal web application through a Wi-Fi connection. Design a secure and reliable communication path for this access.',
ans:`${H('What must be protected')}
<p>The path crosses a Wi-Fi network and the public Internet that the company does not control, so it must give: <b>authentication</b> (only the real employee and device), <b>confidentiality</b> (nobody can read the data), <b>integrity</b> (nobody can change it), <b>access control</b> (only the web app, nothing else) and <b>reliability</b> – the same security goals listed for WLAN in Lecture 19.</p>
${H('Designed communication path')}
[[fig:vpn]]
<ol>
<li><b>Secure Wi-Fi link</b> – the laptop joins a Wi-Fi network protected by WPA2/WPA3 with a strong password (Lecture 19 best practice: strong passwords, WPA3/WPA2, updated firmware). Open hotspots are treated as unsafe – the next step protects the data anyway.</li>
<li><b>Safe laptop</b> – company-managed, updated operating system, antivirus, disk encryption, and a device certificate installed.</li>
<li><b>VPN tunnel across the Internet</b> – a VPN client (IPsec or SSL/TLS) makes an <b>encrypted tunnel</b> from the laptop to the company's VPN gateway/firewall. Every packet is encrypted and integrity-checked (the "safe" of the Presentation layer, Lecture 11), so the Wi-Fi owner or any ISP sees only scrambled data.</li>
<li><b>Strong login</b> – username + password + MFA code (app or token) and the device certificate; the gateway gives the laptop an internal IP address.</li>
<li><b>Access control inside</b> – the firewall allows the VPN user to reach only the web application server (HTTPS, port 443) in the server segment; all sessions are logged and monitored.</li>
<li><b>Application security</b> – the web app itself uses HTTPS (encrypted web, Lecture 13) with login, role-based access and session time-outs, so data is protected end to end even inside the tunnel.</li>
<li><b>Reliability</b> – two VPN gateways on separate Internet links, automatic reconnection, and mobile data as a backup path for the laptop.</li>
</ol>
<p><b>Result:</b> confidentiality by encryption (WPA3, VPN, HTTPS), integrity by the VPN/TLS checks, authentication by MFA and certificates, and availability by redundant gateways.</p>
${END}`});

Q({id:'b1',marks:7,topic:'datacomm',tags:['ppt'],q:'Define data communication. Explain the key features that make data communication effective, and list its applications.',
ans:`<p><b>Data communication</b> is the exchange of data between two or more devices through a transmission medium such as cables, wireless signals or optical fibre. It is the foundation of modern computer networks and lets devices share information and resources.</p>
${H('Key features')}
<ol><li><b>Delivery</b> – data is delivered to the correct destination.</li><li><b>Accuracy</b> – data is transmitted without errors.</li><li><b>Timeliness</b> – data is delivered within an acceptable time, which is crucial for real-time applications like video calls.</li><li><b>Jitter</b> – variation in packet arrival time is kept small, important for audio and video streaming.</li></ol>
${H('Applications')}
<p>Internet browsing, video conferencing, online gaming, file sharing, and communication between IoT (Internet of Things) devices.</p>
<p>A data communication system consists of a message, sender, receiver, transmission medium and protocol, and can work in simplex, half-duplex or full-duplex mode.</p>
${END}`});

Q({id:'b2',marks:7,topic:'standards',tags:['ppt'],q:'What are network standards and why are they important? Explain the contribution of ISO and IEEE to computer networks.',
ans:`<p><b>Network standards</b> are a set of rules, protocols and guidelines that make sure networking devices and software from different companies can communicate efficiently and reliably. They give interoperability, compatibility, security and scalability.</p>
${H('Why they are important')}
<ul><li>Compatibility between devices from different vendors.</li><li>Reliable and error-free communication.</li><li>Better network security and performance.</li><li>Global communication and Internet connectivity.</li><li>Lower development and implementation cost.</li></ul>
${H('ISO')}
<p>The International Organization for Standardization (established 1947, Geneva, 170+ member bodies) is an independent, non-governmental organisation that develops international standards. Its main contribution to networking is the <b>OSI reference model</b>, which divides communication into seven layers (Physical, Data Link, Network, Transport, Session, Presentation, Application). Even though networks run on TCP/IP, OSI is the standard framework for learning, designing and troubleshooting. Other work: ISO/IEC 27001 (information security), ISO 9001 (quality). Advantages: worldwide acceptance, vendor-independent, better interoperability.</p>
${H('IEEE')}
<p>The Institute of Electrical and Electronics Engineers (founded 1963, New York) is the world's largest professional technical association. Its IEEE 802 committee develops LAN and MAN standards: <b>802.3 Ethernet</b>, <b>802.11 Wi-Fi</b>, 802.15 Bluetooth/ZigBee, 802.16 WiMAX, 802.1Q VLAN. These standards define how wired and wireless LANs work.</p>
${END}`});

Q({id:'b3',marks:7,topic:'topology',tags:['ppt'],q:'Explain the working of star topology with the steps followed when PC1 sends data to PC4 through a switch. Why is a switch important?',
ans:`[[fig:star]]
<p>In <b>star topology</b> every computer or network device is connected to a central device, normally a switch. Main components: the central switch/hub, the network devices and an individual link for each device.</p>
${H('Working: PC1 → Switch → PC4')}
<ol><li>PC1 creates the data frame.</li><li>PC1 sends the frame to the switch.</li><li>The switch examines the destination MAC address.</li><li>The switch determines the appropriate port.</li><li>The switch forwards the frame toward PC4.</li><li>PC4 receives and processes the frame.</li></ol>
${H('Why the switch is important')}
<p>A modern Ethernet switch learns which MAC addresses are reachable through which ports. So when PC1 sends to PC4, the switch forwards the frame specifically to PC4's port instead of sending it to every port (as a hub would). This gives better performance and security.</p>
${H('Advantages and disadvantages')}
<p>Advantages: easy to install, manage and troubleshoot; a cable failure affects one device; easy to add devices; good performance; suitable for large LANs. Disadvantages: needs a central device; if it fails, connected devices are affected; more cable than bus; higher cost. Used in labs, schools, offices, homes and data centres.</p>
${END}`});

Q({id:'b4',marks:7,topic:'devices',tags:['ppt'],q:'For each situation choose the correct network device and justify it: (a) weak Wi-Fi in the garden, (b) two LAN segments with too much traffic between them, (c) internal LAN needs Internet, (d) telephone system must talk to an Internet voice system, (e) a very long cable with weak signal.',
ans:`<p>This is the case-based activity from Lecture 10: pick the device by its function and OSI layer.</p>
${T(['Situation','Device','Why'],[
['(a) Wi-Fi signal is weak in the garden and must be extended','<b>Repeater</b> (Wi-Fi range extender)','A Layer-1 device that catches the weak signal, regenerates it and re-broadcasts it at full strength'],
['(b) Two LAN segments, reduce unnecessary traffic between them','<b>Bridge</b>','A Layer-2 device that learns MAC addresses on each side and forwards only the frames that must cross; local traffic stays local, fewer collisions'],
['(c) Internal LAN must connect to the Internet','<b>Router</b>','A Layer-3 device that joins different networks and forwards packets by IP address along the best path'],
['(d) Traditional telephone system ↔ Internet-based voice','<b>Gateway</b>','The protocol translator (up to Layer 7) converting PSTN telephone signalling to Internet voice (SIP)'],
['(e) Long cable, signal becomes weak before the destination','<b>Repeater</b>','Regenerates the attenuated signal so it reaches the end (e.g. joins two 100 m Ethernet runs)']])}
<p>Also: MAC-based filtering between two LAN sections → bridge; two different IP networks → router; two networks with different protocols → gateway. Rule: Hub and repeater = Layer 1 (signals), bridge/switch = Layer 2 (MAC), router = Layer 3 (IP), gateway = up to Layer 7 (translation).</p>
${END}`});

Q({id:'b5',marks:7,topic:'tcpip',tags:['ppt'],q:'Differentiate between TCP and UDP. Mention their characteristics and give real-world applications where each is preferred.',
ans:`<p>TCP and UDP are the two protocols of the <b>Transport layer</b> of the TCP/IP model, which is responsible for reliable communication between devices – segmentation, flow control, error handling and multiplexing.</p>
${T(['Basis','TCP (Transmission Control Protocol)','UDP (User Datagram Protocol)'],[['Type','Reliable, connection-oriented','Fast but unreliable, connectionless'],['Delivery','Breaks data into numbered packets, checks errors, retransmits lost packets, delivers in order','Sends packets without checking; lost packets are not resent'],['Speed','Slower – connection set-up, error correction and retransmission add latency','Faster – no connection overhead'],['Used when','Data accuracy matters','Speed matters more than accuracy'],['Applications','Web browsing, e-mail, file transfer/downloads','Video calls (VoIP), online gaming, live streaming']])}
<p><b>Example from the lecture:</b> when downloading a file, TCP makes sure all packets arrive correctly. In a video call, UDP gives speed even if some packets are lost – a few lost voice packets are acceptable, but delay is not. In the XylonTech case, VoIP calls with latency should use UDP instead of TCP; file corruption points to a Transport-layer problem (TCP should be handling retransmission).</p>
${END}`});

Q({id:'b6',marks:7,topic:'csma',tags:['ppt'],q:'Explain the working of CSMA/CD with a neat flowchart. What is the purpose of the jam signal and random backoff?',
ans:`[[fig:csmacd]]
<p><b>CSMA/CD</b> (Carrier Sense Multiple Access with Collision Detection) is used in wired Ethernet on a shared medium. On a shared wire a station can keep listening while it transmits, so it can detect a collision, stop, and retry after a random delay.</p>
${H('Steps')}
<ol><li><b>Carrier sensing</b> – the station listens to the channel to check if it is idle.</li><li><b>Start transmission</b> – if idle, it starts sending the data.</li><li><b>Collision detection</b> – while sending, it keeps monitoring the channel.</li><li><b>Stop on collision</b> – if a collision is detected, it stops immediately.</li><li><b>Jam signal</b> – it sends a jam signal to tell all stations about the collision.</li><li><b>Backoff</b> – it waits a random backoff time.</li><li><b>Retry</b> – it repeats from step 1.</li></ol>
${H('Purpose of the jam signal')}
<p>The two colliding stations may be far apart and the collision signal may be weak or short. The jam signal makes the collision strong and clear so that <b>every</b> station on the segment notices it, discards the damaged frame and does not start sending.</p>
${H('Purpose of random backoff (binary exponential backoff)')}
<p>After a collision, stations should not retransmit immediately, because they would collide again. Each station waits a random time; after repeated collisions the range from which the waiting time is chosen becomes larger (doubles). This reduces the chance that the same stations collide again and again.</p>
${END}`});

Q({id:'b7',marks:7,topic:'csma',tags:['ppt'],q:'Explain CSMA/CA with random backoff, RTS/CTS and acknowledgment. Why is CSMA/CA suitable for wireless networks?',
ans:`[[fig:csmaca]]
<p><b>CSMA/CA</b> (Carrier Sense Multiple Access with Collision Avoidance) is used in wireless networks such as Wi-Fi (IEEE 802.11). It focuses on avoiding collisions rather than detecting them.</p>
${H('Working')}
<ol><li><b>Carrier sensing before transmission</b> – the station listens to check whether the channel is idle or busy.</li><li><b>Collision avoidance with waiting</b> – if the channel is idle, the station waits a random backoff time before sending, so that other stations that also want to send do not start at the same time.</li><li><b>RTS/CTS (optional, mostly in Wi-Fi)</b> – the sender sends RTS (Request To Send) and waits for CTS (Clear To Send) from the receiver; this reserves the channel and silences other stations.</li><li><b>Data transmission</b> – after CTS (or after the backoff) the station sends the data.</li><li><b>Acknowledgment</b> – the receiver sends an ACK if the data arrived correctly. If no ACK is received, the sender assumes a collision and retries after another random backoff.</li></ol>
${H('Why it suits wireless networks')}
<ul><li>A transmitting wireless station's own signal is much stronger than a weak incoming signal, so it cannot listen and detect a collision while transmitting – collision detection is impractical.</li><li>The <b>hidden-terminal problem</b>: two stations may both reach the access point but not hear each other, so they cannot sense each other's transmission; RTS/CTS and ACK handle this.</li><li>So IEEE 802.11 uses collision avoidance; ACKs and retransmissions recover lost or corrupted frames.</li></ul>
${END}`});

Q({id:'b8',marks:7,topic:'lantech',tags:['ppt'],q:'Draw and explain the Ethernet frame format. State the size and function of each field.',
ans:`[[fig:framing]]
${T(['Field','Size','Function'],[['Preamble','7 bytes','Alternating 1s and 0s to synchronise the receiver clock'],['SFD (Start Frame Delimiter)','1 byte','Marks the start of the frame'],['Destination address','6 bytes','MAC address of the receiving device (unicast, multicast or broadcast)'],['Source address','6 bytes','MAC address of the sender'],['Length / Type','2 bytes','Number of data bytes, or the upper-layer protocol inside (e.g. IPv4)'],['Data + Pad','46–1500 bytes','The packet from the network layer; padded to at least 46 bytes'],['CRC (FCS)','4 bytes','Error check (CRC-32); frame dropped if it fails']])}
<p><b>Frame size:</b> minimum 64 bytes (so a collision is detected before the sender finishes), maximum 1518 bytes (preamble not counted).</p>
<p><b>MAC address role:</b> the 48-bit hardware address identifies devices. The switch reads the destination MAC to forward the frame to the right port, and the receiving card accepts only frames addressed to it (or broadcast). The source MAC lets the receiver reply and lets the switch learn the port.</p>
${END}`});

Q({id:'b9',marks:7,topic:'errorctl',tags:['ppt'],q:'If the data unit to be transmitted is 10101001 00111001, compute the checksum at the sender and verify it at the receiver using 1’s complement arithmetic.',
ans:`<p><b>Checksum method:</b> the sender adds the data units using 1's complement arithmetic (a carry over is added back to the sum), complements the sum to get the checksum, and sends it with the data. The receiver adds all units including the checksum, complements the result, and if it is zero there is no error.</p>
[[fig:checksum]]
${H('Sender')}
<pre class="mono" style="background:var(--surface-2);padding:10px;border-radius:6px;overflow-x:auto">  10101001   subunit 1
  00111001   subunit 2
  --------
  11100010   sum (1's complement addition)
  00011101   checksum (complement of the sum)</pre>
<p>Transmitted: 10101001 00111001 <b>00011101</b>.</p>
${H('Receiver')}
<pre class="mono" style="background:var(--surface-2);padding:10px;border-radius:6px;overflow-x:auto">  10101001   subunit 1
  00111001   subunit 2
  00011101   checksum
  --------
  11111111   sum
  00000000   sum's complement</pre>
<p>The result is zero, so <b>no error</b> occurred and the data is accepted. If any bit had changed, the complement would not be zero and the data would be rejected.</p>
${END}`});

Q({id:'b10',marks:7,topic:'dll',tags:['ppt'],q:'Explain character count, byte stuffing and bit stuffing with the lecture examples: (a) transmit frame ABC by character count, (b) data A FLAG B ESC C by byte stuffing, (c) data 01111110 1101111110110 by bit stuffing with flag 01111110.',
ans:`${H('(a) Character count')}
<p>The first byte of the frame tells the total number of characters in the frame including the count byte. Frame ABC → transmitted <b>[4 A B C]</b>. The receiver reads 4, so it takes the next 3 characters as the frame. Drawback: if the count byte is corrupted the receiver loses track of where the frame ends (misalignment).</p>
${H('(b) Byte stuffing')}
<p>FLAG marks the start and end of a frame. If FLAG or ESC appears in the data, an ESC is inserted before it. Data <code>A FLAG B ESC C</code> → stuffed <b>[A ESC FLAG B ESC ESC C]</b>. The receiver removes each ESC and keeps the byte after it as data. Used in PPP and SLIP.</p>
${H('(c) Bit stuffing')}
[[fig:bitstuff]]
<p>The flag is 01111110. Whenever five consecutive 1s appear in the data, the sender inserts a 0 after them. Data <code>01111110 1101111110110</code>: scanning left to right, after each run of five 1s a 0 is inserted, giving the stuffed data <b>011111010 11011111010110</b> (underline the inserted 0s in the exam). The transmitted frame is <b>01111110 | stuffed data | 01111110</b>. The receiver removes the 0 that follows every five 1s. Used in HDLC and SDLC.</p>
${T(['Feature','Character count','Byte stuffing','Bit stuffing'],[['Delimiter','Count field','FLAG byte','01111110'],['Trigger','—','FLAG/ESC in data','Five 1s in a row'],['Action','—','Insert ESC','Insert 0'],['Weakness','Corrupt count loses sync','Frame grows','Small overhead'],['Used in','Early protocols','PPP, SLIP','HDLC, SDLC']])}
${END}`});

Q({id:'b11',marks:7,topic:'errorctl',tags:['ppt'],q:'What is Hamming distance? Find the Hamming distance for the pairs (a) 11001 and 10011, (b) 0110 and 1110, (c) 101010 and 111111, (d) 00000000 and 11111111, (e) 1100 and 1100. Why is it important?',
ans:`<p><b>Hamming distance</b> is the number of positions at which two binary strings of equal length differ. It tells how many bits must change to turn one string into the other. Method: XOR the two strings and count the 1s.</p>
${T(['Pair','Codeword 1','Codeword 2','XOR','Different positions','Distance'],[['a','11001','10011','01010','2, 4','<b>2</b>'],['b','0110','1110','1000','1','<b>1</b>'],['c','101010','111111','010101','2, 4, 6','<b>3</b>'],['d','00000000','11111111','11111111','1–8','<b>8</b>'],['e','1100','1100','0000','none','<b>0</b>']])}
<p><i>Note:</i> the lecture answer key gives 3 for pair (a), but 11001 ⊕ 10011 = 01010 has only two 1s, so the correct distance is 2. Always count by XOR in the exam.</p>
${H('Why it is important')}
<p>In transmission, bits can get corrupted by noise. Hamming distance helps detect and correct errors: if the smallest distance between valid codewords is d, the code can detect up to d − 1 errors and correct up to (d − 1)/2 errors. Example from the lecture: sent 10110010, received 10010011 → distance 2 → two bits were corrupted.</p>
${END}`});

Q({id:'b12',marks:7,topic:'lantech',tags:['ppt'],q:'Expand FDDI. Explain its main components and describe its data transfer step by step. Which feature keeps the network working when one link fails?',
ans:`<p><b>FDDI = Fiber Distributed Data Interface</b> – a high-speed LAN technology based on fibre-optic cable that uses token passing on a dual ring. Key idea: fibre + ring topology + token passing + redundancy.</p>
[[fig:fddi]]
${H('Main components')}
<ul><li><b>Fibre-optic link</b> – the physical medium for high-speed communication.</li><li><b>Network stations</b> – the devices on the ring.</li><li><b>Token</b> – the permission/control mechanism for transmission.</li><li><b>Primary ring</b> – the normal data path.</li><li><b>Secondary ring</b> – the alternate/redundant path.</li><li><b>Frames</b> – the units of data carried around the ring.</li></ul>
${H('Data transfer step by step')}
<ol><li>A token circulates around the ring.</li><li>A station with data waits for the token.</li><li>The station captures the token – it now has permission to transmit.</li><li>The data frame travels toward the destination.</li><li>The destination identifies and copies the frame.</li><li>Token access continues for the other stations.</li></ol>
<p>Like one classroom microphone: only the token holder gets to speak.</p>
${H('Feature that keeps it working on failure')}
<p>The <b>dual-ring redundancy</b> (fault tolerance): if one link fails, the stations next to the fault wrap the primary ring onto the secondary ring, giving an alternate path, so the network keeps running. Applications: campus and enterprise backbones, high-reliability LANs.</p>
${END}`});

Q({id:'b13',marks:7,topic:'lantech',tags:['ppt'],q:'Define WLAN and explain its components. Differentiate between infrastructure mode and ad hoc mode.',
ans:`<p><b>WLAN (Wireless LAN)</b> is a Local Area Network that uses radio-frequency communication to connect devices without physical data cables. Its purpose is local connectivity, resource sharing and Internet access with user mobility. Wi-Fi is the widely used WLAN technology based on the IEEE 802.11 family.</p>
[[fig:wlan]]
${H('Components (infrastructure WLAN)')}
<ul><li><b>Station (STA)</b> – a wireless endpoint with a network interface: laptop, smartphone, tablet, printer.</li><li><b>Access Point (AP)</b> – provides wireless connectivity and bridges/forwards traffic toward the wired network; takes part in authentication and association. (An AP is not the same as a router; home Wi-Fi routers combine both.)</li><li><b>Distribution System (DS)</b> – the wired LAN that connects APs and supports larger deployments.</li></ul>
${H('Infrastructure vs ad hoc')}
${T(['Infrastructure mode','Ad hoc mode'],[['AP required: stations communicate through an access point','No dedicated AP: stations communicate directly with one another'],['Centralised connectivity: the AP connects clients to the LAN/Internet','Peer-to-peer communication among the participating stations'],['Scalable: multiple APs form an ESS, roaming possible','Temporary use: small or short-term networks'],['Typical use: homes, colleges, offices, hospitals','Limitation: less control, not suitable for large deployments']])}
<p><b>Terms:</b> BSS – stations associated with one AP (BSSID); IBSS – independent BSS for ad hoc (no AP); ESS – several BSSs connected by a DS, larger coverage and roaming.</p>
${END}`});

Q({id:'b14',marks:7,topic:'csma',tags:['ppt'],q:'Three devices X (1-persistent), Y (non-persistent) and Z (p-persistent, p = 0.3) share a CSMA channel that becomes idle at time T0. Arrange them in order of aggressiveness (likelihood to transmit first) and explain. Which method scales best to 100+ devices?',
ans:`${T(['Device','Type','Behaviour when the channel becomes idle','Aggressiveness'],[['X','1-persistent','Senses and transmits immediately if idle (probability 1)','Most aggressive'],['Z','p-persistent, p = 0.3','Senses and transmits with 30% probability; otherwise waits for the next slot','Moderately aggressive'],['Y','Non-persistent','If it found the channel busy it waits a random time before sensing again, so it may not even be listening at T0','Least aggressive']])}
<p><b>Order:</b> X → Z → Y.</p>
${H('Explanation')}
<ul><li>X (1-persistent) has the <b>highest collision risk</b>: if several stations are waiting, they all transmit the moment the channel frees and collide.</li><li>Y (non-persistent) has the <b>longest delay</b>: it waits a random back-off even after sensing a busy channel – fewer collisions but more waiting.</li><li>Z (p-persistent) balances the two with the probability p.</li></ul>
${H('Scaling to 100+ devices')}
<p><b>p-persistent CSMA</b> is the most efficient and scalable. The probability p reduces the chance that many devices transmit at the same time; with a proper (lower) p under heavy load, collisions are avoided and the channel stays fairly used, especially in slotted networks like Wi-Fi.</p>
${END}`});
